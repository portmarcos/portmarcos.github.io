<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Fase 1 · Estação de Quixadá</title>
<meta name="description" content="O Caso dos Originais Desaparecidos — fase de ação na estação de Quixadá (O Quinze, Rachel de Queiroz).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Lora:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b120b;--paper:#f1e2c2;--amber:#f4a83c;--amber2:#ffcf7a;--rust:#8e3418;--ok:#3f7d3a;--bad:#a52a1a;--muted:#c9b48e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0603;color:var(--paper);font-family:Lora,Georgia,serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#game{position:relative;width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;background:#000;box-shadow:0 0 60px #000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:8px 10px;pointer-events:none;z-index:5;background:linear-gradient(180deg,rgba(15,8,3,.75),transparent)}
#hud .lamps{display:flex;gap:1px}
#hud .lamps img{height:clamp(22px,3.4vw,36px);transition:filter .3s}
#hud .lamps img.on{filter:drop-shadow(0 0 6px rgba(255,170,60,.9))}
#hud .lamps img.out{animation:blow .8s}
@keyframes blow{0%{transform:scale(1.3)}100%{transform:scale(1)}}
.hs{font-family:'Special Elite';font-size:clamp(.72rem,1.4vw,1rem);background:rgba(20,10,4,.7);border:1px solid #6b4526;border-radius:8px;padding:3px 9px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.hs b{color:var(--amber2)}
.hs img{height:1.3em}
#hud .sp{flex:1}
#hud button{pointer-events:auto;background:rgba(20,10,4,.7);border:1px solid #6b4526;border-radius:8px;height:clamp(28px,4vw,38px);min-width:clamp(28px,4vw,38px);font-size:clamp(.8rem,1.4vw,1rem)}
#clues{display:flex;gap:4px}
#clues i{width:clamp(14px,2vw,20px);height:clamp(14px,2vw,20px);border-radius:50%;border:1px dashed #a7743b;display:inline-block;background:rgba(0,0,0,.3)}
#clues i.ok{background:radial-gradient(circle at 35% 35%,#ffd98a,#b8691c);border:1px solid #ffd98a;box-shadow:0 0 8px rgba(255,190,90,.8)}
#toast{position:absolute;left:50%;top:13%;transform:translateX(-50%);z-index:6;font-family:'Special Elite';font-size:clamp(.8rem,1.6vw,1.1rem);background:rgba(20,10,4,.85);border:1px solid #a7743b;border-radius:10px;padding:8px 16px;max-width:80%;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}

/* touch */
#touch{position:absolute;inset:0;z-index:4;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(30,16,6,.55);border:2px solid rgba(220,170,100,.55);color:#ffe6b5;font-family:'Special Elite';display:grid;place-items:center;font-size:clamp(.7rem,1.6vw,1rem);touch-action:none}
.tb.on{background:rgba(244,168,60,.45)}
#tL{left:2%;bottom:5%;width:12%;aspect-ratio:1}
#tR{left:15.5%;bottom:5%;width:12%;aspect-ratio:1}
#tJ{right:2%;bottom:5%;width:12%;aspect-ratio:1}
#tT{right:15%;bottom:4%;width:9.5%;aspect-ratio:1}
#tA{right:4.5%;bottom:28%;width:9.5%;aspect-ratio:1}
#tLa{right:16%;bottom:24%;width:9.5%;aspect-ratio:1}
#tU{left:9%;bottom:28%;width:9%;aspect-ratio:1}
#tD{left:9%;bottom:-1%;width:0;aspect-ratio:1;display:none}

/* overlays */
.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(8,4,1,.72);backdrop-filter:blur(3px);animation:fi .25s}
@keyframes fi{from{opacity:0}}
.paper{position:relative;width:min(760px,100%);max-height:calc(100dvh - 28px);overflow:auto;color:var(--ink);border-radius:6px;padding:26px clamp(18px,4vw,38px) 22px;
  background:radial-gradient(ellipse at 30% 20%,#f8ecd0 0%,#ecd9b0 55%,#d8bd88 100%);box-shadow:inset 0 0 50px rgba(120,70,20,.55),0 20px 60px rgba(0,0,0,.8);animation:pin .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes pin{from{transform:translateY(16px) rotate(-1deg);opacity:0}}
.paper h2{font-family:'Playfair Display';font-weight:900;font-size:clamp(1.3rem,3vw,1.9rem);line-height:1.1;color:#3a1d0b}
.paper h3{font-family:'Playfair Display';font-size:1.1rem;color:#5a2a10;margin:14px 0 6px}
.paper p{line-height:1.55}
.kicker{font-family:'Special Elite';font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--rust)}
.stamp{position:absolute;right:16px;top:14px;font-family:'Special Elite';color:rgba(150,30,15,.75);border:3px double rgba(150,30,15,.75);padding:3px 10px;transform:rotate(8deg);font-size:.8rem;letter-spacing:.1em}
.q{font-size:clamp(1rem,1.8vw,1.1rem);line-height:1.55;margin:6px 0 12px;font-weight:600}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:rgba(255,250,235,.55);border:1px solid rgba(110,70,30,.35);border-radius:8px;padding:9px 12px;margin-bottom:7px;font-size:.96rem;line-height:1.45;color:var(--ink)}
.opt:hover:not(:disabled){background:rgba(255,236,190,.95);border-color:var(--rust)}
.opt b{font-family:'Playfair Display';font-weight:900;color:var(--rust);min-width:18px}
.opt.right{background:rgba(120,180,90,.35);border-color:var(--ok)}
.opt.wrong,.opt.gone{opacity:.4;text-decoration:line-through}
.fb{margin-top:10px;padding:11px 14px;border-radius:8px;line-height:1.5;font-size:.96rem;border-left:5px solid}
.fb.ok{background:rgba(110,170,80,.2);border-color:var(--ok)}
.fb.bad{background:rgba(190,60,40,.14);border-color:var(--bad)}
.acts{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.pbtn{border:none;border-radius:8px;padding:10px 20px;font-family:'Playfair Display';font-weight:700;font-size:1rem;color:#ffe6b5;background:linear-gradient(180deg,#7a3f1a,#4a220c);box-shadow:0 4px 0 #2a1205;text-shadow:0 1px 0 #000;text-decoration:none;display:inline-block}
.pbtn:hover{filter:brightness(1.15)}
.pbtn.ghost{background:transparent;color:var(--rust);box-shadow:none;border:1px solid var(--rust);text-shadow:none}
.lupa{display:flex;align-items:center;gap:6px;background:rgba(255,250,235,.5);border:1px solid rgba(110,70,30,.45);border-radius:8px;padding:6px 12px;font-family:'Special Elite';font-size:.9rem;color:var(--ink)}
.lupa img{height:22px}.lupa:disabled{opacity:.4}
.lock{display:flex;justify-content:center;gap:10px;margin:12px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:4px}
.wheel button{width:50px;height:28px;border:none;border-radius:6px;background:#5a3418;color:#ffe6b5}
.wheel div{width:50px;height:60px;border-radius:8px;display:grid;place-items:center;font-family:'Special Elite';font-size:2.1rem;color:#ffe6b5;background:linear-gradient(180deg,#1f130a,#4a2c16 45%,#1f130a);border:2px solid #9a6a35}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0}
.tile{width:44px;height:52px;border-radius:7px;border:none;font-family:'Special Elite';font-size:1.6rem;color:var(--ink);background:linear-gradient(180deg,#fbf3df,#e2c992);box-shadow:0 3px 0 #9a7444}
.tile.used{visibility:hidden}.tile.slot{background:rgba(90,50,20,.12);box-shadow:inset 0 0 0 2px rgba(110,70,30,.35)}
.mrow{display:grid;grid-template-columns:minmax(110px,.8fr) 1.6fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed rgba(110,70,30,.35)}
.mrow select{width:100%;font-family:Lora;padding:7px;border-radius:7px;border:1px solid rgba(110,70,30,.5);background:#fffaf0;color:var(--ink)}
.mrow.ok select{background:rgba(170,220,140,.5)}.mrow.bad select{background:rgba(230,150,130,.4)}
.cin{display:block;margin:0 auto;font-family:'Special Elite';font-size:1.4rem;letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:8px;width:min(300px,100%);border-radius:8px;border:2px solid rgba(110,70,30,.5);background:#fffaf0;color:var(--ink)}
.clue{display:flex;gap:14px;align-items:flex-start;margin-top:10px}
.clue img{width:84px;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0;font-size:.95rem}
.keys kbd{font-family:'Special Elite';background:#fbf3df;border:1px solid #9a7444;border-bottom-width:3px;border-radius:5px;padding:1px 7px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stats div{background:rgba(255,250,235,.5);border-radius:8px;padding:8px;text-align:center}
.stats b{display:block;font-family:'Playfair Display';font-size:1.4rem;color:#3a1d0b}
.stats span{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:#6b4526}
.medal{font-family:'Playfair Display';font-weight:900;font-size:1.5rem;color:var(--rust)}
.bigletter{font-family:'Special Elite';font-size:3.6rem;width:84px;height:100px;margin:8px auto;display:grid;place-items:center;background:#fbf3df;border-radius:8px;box-shadow:0 4px 0 #9a7444}
.center{text-align:center}
.shake{animation:shk .4s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* diálogo */
#dlg{position:fixed;inset:0;z-index:45;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent 60%);cursor:pointer}
#dlg .por{position:absolute;left:max(2vw,calc(50% - 560px));bottom:min(140px,24vh);height:min(52vh,460px);max-width:40vw;object-fit:contain;object-position:bottom;filter:drop-shadow(0 10px 25px rgba(0,0,0,.8))}
#dlg .box{position:relative;width:min(1100px,96vw);min-height:130px;margin-bottom:10px;padding:24px 6% 20px;background:url(img/ui-pergaminho.webp) center/100% 100% no-repeat;color:var(--ink)}
#dlg .nm{position:absolute;left:5%;top:-15px;font-family:'Playfair Display';font-weight:900;color:#ffe6b5;background:linear-gradient(180deg,#6b3a1a,#3e200d);border:2px solid #b98a45;border-radius:8px;padding:2px 14px}
#dlg .tx{font-family:'Special Elite';font-size:clamp(.95rem,1.7vw,1.18rem);line-height:1.5;min-height:2.8em}
#dlg .nx{position:absolute;right:6%;bottom:8px;font-family:'Special Elite';font-size:.78rem;color:#6b4526}
#comic{position:fixed;inset:0;z-index:55;background:#0b0603;display:flex;align-items:center;justify-content:center;cursor:pointer}
#comic .fr{position:relative;width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;overflow:hidden;box-shadow:0 0 60px #000}
#comic .fr img.bg{width:100%;height:100%;object-fit:cover;animation:kbc 10s ease-out forwards}
@keyframes kbc{from{transform:scale(1.12)}to{transform:scale(1)}}
#comic .cap,.cine{position:absolute;left:4%;right:4%;bottom:4%;background:rgba(251,243,223,.95);color:#1b120b;border:2px solid #5a3418;border-radius:6px;padding:12px 16px;font-family:'Special Elite',monospace;font-size:clamp(.82rem,1.7vw,1.12rem);line-height:1.5;box-shadow:0 8px 20px rgba(0,0,0,.6);animation:pin .5s}
#comic .cap b,.cine b{display:block;font-family:'Playfair Display';font-size:.8em;letter-spacing:.12em;text-transform:uppercase;color:#8e3418;margin-bottom:2px}
#comic .fol{position:absolute;right:3%;top:5%;width:11%;transform:rotate(6deg);filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));animation:pin .6s}
#comic .skip{position:absolute;right:2%;top:3%;z-index:2;font-family:'Special Elite';font-size:.85rem;background:rgba(20,10,4,.75);color:#ffe6b5;border:1px solid #a7743b;border-radius:8px;padding:5px 12px}
#comic .nx{position:absolute;right:6%;bottom:6%;font-family:'Special Elite';font-size:.78rem;color:#6b4526}
.cine{position:fixed;z-index:30;left:50%;right:auto;bottom:6%;transform:translateX(-50%);width:min(760px,92vw)}
.tl{margin:6px 0 0 22px;line-height:1.5;font-size:.93rem}.tl li{margin-bottom:4px}.tl li.lock{color:#9a7a55;font-style:italic;list-style:none;margin-left:-4px}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.pick button{border:2px solid rgba(110,70,30,.4);background:rgba(255,250,235,.6);border-radius:10px;padding:8px 14px;font-family:'Special Elite';font-size:.95rem;color:#2b1a0d}
.pick button.on{border-color:#8e3418;background:#fbe5b8;box-shadow:0 0 0 3px rgba(142,52,24,.18)}
.pl{border:1px dashed rgba(110,70,30,.45);border-radius:10px;padding:10px 12px;margin-top:10px}
.pl h3{margin:0 0 4px}
.pl input,.rk input{font-family:'Special Elite';font-size:1rem;padding:7px 10px;border-radius:7px;border:1px solid rgba(110,70,30,.5);background:#fffaf0;color:#1b120b;width:min(260px,100%)}
.rk table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.9rem}
.rk th,.rk td{padding:5px 6px;border-bottom:1px dashed rgba(110,70,30,.35);text-align:left}
.rk th{font-family:'Special Elite';font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:#6b4526}
.rk tr.me td{background:rgba(244,168,60,.25);font-weight:600}
#load{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#0b0603;font-family:'Special Elite';color:var(--muted)}
@media (max-height:520px){#dlg .box{min-height:84px;padding:16px 6% 12px}#dlg .por{height:56vh;bottom:auto;top:4vh}.paper{padding:18px}}
</style>
</head>
<body>
<div id="load">Carregando a estação de Quixadá…</div>
<div id="wrap"><div id="game">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="lamps" id="lamps"></div>
    <div class="hs hidden" id="hDupla"></div>
    <div class="hs">★ <b id="hScore">0</b></div>
    <div class="hs"><img src="img/q1/i-pagina1.webp" alt=""><b id="hPages">0</b>/<span id="hPagesT">0</span></div>
    <div class="hs">Pistas <span id="clues"></span></div>
    <div class="hs" title="Velas de São José"><img src="img/q1/vela-on.webp" alt=""><b id="hVelas">0</b>/3</div>
    <div class="hs hidden" id="hKey"><img src="img/q1/chave.webp" alt=""><b id="hKeyN">1</b></div>
    <div class="sp"></div>
    <button id="bMute" title="Som">🔊</button>
    <button id="bPause" title="Pausa (Esc)">⏸</button>
  </div>
  <div id="toast"></div>
  <div id="touch" class="hidden">
    <div class="tb" id="tL" data-k="left">◀</div>
    <div class="tb" id="tR" data-k="right">▶</div>
    <div class="tb" id="tU" data-k="up">▲</div>
    <div class="tb" id="tJ" data-k="jump">PULAR</div>
    <div class="tb" id="tT" data-k="throw">PAPEL</div>
    <div class="tb" id="tA" data-k="act">AÇÃO</div>
    <div class="tb" id="tLa" data-k="lamp">LUZ</div>
  </div>
</div></div>

<script src="dados.js"></script>
<script src="/assets/js/config-sheets.js"></script>
<script>
/* =====================================================================
   O CASO DOS ORIGINAIS DESAPARECIDOS — FASE 1 · ESTAÇÃO DE QUIXADÁ
   Fase de plataforma: pistas escondidas, inimigos, chefe com enigmas.
   ===================================================================== */
const CH=CAPITULOS[0], CHI=0;
const VW=960, VH=540, G=470;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const KEY='caso_originais_v1';
const store={get(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}};

/* ---------------- imagens ---------------- */
const SRC={ceu:'q1/ceu',inacia:'q1/npc-inacia',chico:'q1/npc-chico',cordulina:'q1/npc-cordulina',mocinha:'q1/npc-mocinha',vicente:'q1/npc-vicente',cabra:'q1/npc-cabra',oratorio:'q1/oratorio',velaOff:'q1/vela-off',velaOn:'q1/vela-on',campoBg:'q1/alagadico',interior:'q1/vagao-interior',casa:'q1/casa-interior',porta:'q1/porta-aberta',malaF:'q1/mala-trancada',malaAb:'q1/mala-aberta-pista',chave:'q1/chave',chaveB:'q1/chave-brilho',estacao:'q1/estacao',torre:'q1/caixa-dagua',banco:'q1/banco',loco:'q1/locomotiva',vag1:'q1/vagao1',vag2:'q1/vagao2',
  plat:'q1/k-plataforma',pedra:'q1/k-pedra',caixote:'q1/k-caixote',barril:'q1/k-barril',mala:'q1/k-mala',malaA:'q1/k-mala-aberta',trouxa:'q1/k-trouxa',chao:'q1/k-chao',viga:'q1/k-viga',telhado:'q1/k-telhado',
  pag1:'q1/i-pagina1',pag2:'q1/i-pagina2',lampada:'q1/i-lampada',tinta1:'q1/i-tinta1',tinta2:'q1/i-tinta2',tinta3:'q1/i-tinta3',poeira:'q1/i-poeira',vapor:'q1/i-vapor',brilho:'q1/i-brilho',
  det:'q1/detetive',cap:'q1/capanga',boss:'q1/chefe',con:'q1/conceicao',diario:'i-diario',lampOn:'i-lamp-on'};
const IMG={};
function loadAll(){return Promise.all(Object.entries(SRC).map(([k,v])=>new Promise(r=>{const i=new Image();i.onload=()=>{IMG[k]=i;r()};i.onerror=()=>{IMG[k]=null;r()};i.src='img/'+v+'.webp'})))}
const SH={det:{w:269,h:232,s:.47},cap:{w:214,h:242,s:.46},boss:{w:374,h:422,s:.58},con:{w:182,h:302,s:.35}};

/* ---------------- som ---------------- */
let AC=null,muted=false;try{muted=localStorage.getItem('caso_mute')==='1'}catch(e){}
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d=.15,type='sine',v=.08,w=0,f2){if(muted||!ac())return;const t=AC.currentTime+w,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}
function noise(d=.2,v=.2,f=1000,q=1,w=0){if(muted||!ac())return;const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;s.buffer=b;g.gain.value=v;s.connect(fl).connect(g).connect(AC.destination);s.start(AC.currentTime+w)}
const SFX={
  jump(){tone(330,.14,'triangle',.06,0,620)},dj(){tone(500,.14,'triangle',.06,0,900)},
  throw(){noise(.12,.18,2400,1.5)},hit(){noise(.1,.3,500,1);tone(160,.12,'square',.05)},
  stomp(){tone(220,.12,'square',.07,0,90);noise(.15,.25,300,.8)},page(){tone(1200,.08,'triangle',.05);tone(1600,.1,'triangle',.05,.06)},
  hurt(){tone(200,.35,'sawtooth',.06,0,80);noise(.4,.2,600,.5)},clue(){[659,880,1175,1568].forEach((f,i)=>tone(f,.4,'triangle',.06,i*.08))},

    if(K.down&&P.ground&&P.onSeg){P.drop=.25;P.ground=false;P.buf=0}
    else if(P.coy>0){P.vy=-760;P.coy=0;P.buf=0;P.jumps=1;P.ground=false;SFX.jump();puff(P.x,P.y,.5)}
    else if(P.jumps<2){P.vy=-640;P.jumps=2;P.buf=0;SFX.dj();puff(P.x,P.y,.4)}
  }
  if(!K.jump&&!K.up&&P.vy<-300)P.vy+=2600*dt; // pulo variável
  P.vy=Math.min(P.vy+2100*dt,950);
  // horizontal
  P.x+=P.vx*dt;let b=pbox();
  for(const s of solidsAll()){if(s.hide&&s.ground)continue;if(boxHit(b,s)){if(P.vx>0)P.x=s.x-P.w/2-.01;else if(P.vx<0)P.x=s.x+s.w+P.w/2+.01;else{P.x=(P.x<s.x+s.w/2)?s.x-P.w/2:s.x+s.w+P.w/2}P.vx=0;b=pbox()}}
  P.x=clamp(P.x,P.w/2,Lv.w-P.w/2);
  if(bossActive&&scene==='main')P.x=clamp(P.x,5700,6640);
  // vertical
  const prevY=P.y;P.y+=P.vy*dt;b=pbox();const wasG=P.ground;P.ground=false;P.onSeg=null;
  for(const s of solidsAll()){if(boxHit(b,s)){if(P.vy>=0&&prevY<=s.y+4){P.y=s.y;P.vy=0;P.ground=true;if(s.st===0&&s.crumb!==undefined){}if(Lv.crumble.includes(s)&&s.st===0){s.st=1;s.t=.55;SFX.crack()}}else if(P.vy<0){P.y=s.y+s.h+P.h;P.vy=0}b=pbox()}}
  P.drop-=dt;
  if(P.vy>=0&&P.drop<=0){for(const sg of Lv.oneway){const x1=Math.min(sg.x1,sg.x2),x2=Math.max(sg.x1,sg.x2);if(P.x<x1-4||P.x>x2+4)continue;const sy=surfY(sg,P.x);if(prevY<=sy+6&&P.y>=sy-1){P.y=sy;P.vy=0;P.ground=true;P.onSeg=sg}}}
  if(COOP&&P.vy>=0&&P.drop<=0)for(const o of PLAYERS){if(o===P)continue;const top=o.y-o.h+6;if(Math.abs(P.x-o.x)<24&&prevY<=top+6&&P.y>=top-1){P.y=top;P.vy=0;P.ground=true;P.onHead=o}}
  if(COOP){for(const o of PLAYERS){if(o===P)continue;const lim=VW-110;if(P.x-o.x>lim){P.x=o.x+lim;P.vx=Math.min(0,P.vx)}if(o.x-P.x>lim){P.x=o.x-lim;P.vx=Math.max(0,P.vx)}}}
  if(P.ground){P.jumps=0;if(!wasG&&prevY<P.y-0||(!wasG)){P.land=.12;puff(P.x,P.y,.35)}}
  // animação
  P.an+=dt*(Math.abs(P.vx)>20?Math.abs(P.vx)/22:0);
  if(P.inv>0)P.inv-=dt;if(P.hurt>0)P.hurt-=dt;if(P.throwT>0)P.throwT-=dt;if(P.land>0)P.land-=dt;
  // arremesso
  if(pressed('throw')&&P.throwT<=0&&projs.length<3){P.throwT=.28;SFX.throw();projs.push({x:P.x+P.face*24,y:P.y-58,vx:P.face*620+P.vx*.3,life:.7,rot:0,dir:P.face})}
  // queda em buraco
  if(P.y>VH+160)damage(true);
}
function damage(fall){
  if(!fall&&P.inv>0)return;
  lamps--;errosFase++;score=Math.max(0,score-50);combo=0;P.inv=1.4;P.hurt=.4;SFX.hurt();shake=.35;hudLamps(true);
  if(fall){const o=COOP&&PLAYERS.find(q=>q!==P&&q.ground&&q.y<VH);if(o){P.x=o.x-o.face*30;P.y=o.y;P.vx=P.vy=0;P.climb=null;toast((P.nome||'Detetive')+' voltou para perto do parceiro.')}else respawn()}else{P.vy=-420;P.vx=-P.face*260}
  if(lamps<=0)setTimeout(gameOver,400);
  updHud();
}
function respawn(){const sw=checkpoint.scene!==scene;if(sw)switchScene(checkpoint.scene);P.x=checkpoint.x;P.y=checkpoint.y;P.vx=P.vy=0;P.climb=null;if(sw||COOP){const me=P;PLAYERS.forEach(q=>{if(q!==me){q.x=clamp(me.x-34,20,Lv.w-20);q.y=me.y;q.vx=q.vy=0;q.climb=null}})}}

/* ================== INIMIGOS ================== */
function updEnemies(dt){
  for(const e of Lv.enemies){
    e.an+=dt*8;
    if(e.st==='dead'){e.t+=dt;continue}
    if(e.st==='stun'){e.t-=dt;if(e.t<=0)e.st='walk';continue}
    if(e.st==='atk'){e.t+=dt;if(e.t>.6){e.st='walk';e.cd=1.1}continue}
    e.cd-=dt;e.x+=e.dir*62*dt;if(e.x<e.x1){e.x=e.x1;e.dir=1}if(e.x>e.x2){e.x=e.x2;e.dir=-1}
    const tp=nearestP(e.x,e.y),dx=tp.x-e.x;if(e.cd<=0&&Math.abs(dx)<105&&Math.abs(tp.y-e.y)<40&&Math.sign(dx)===e.dir){e.st='atk';e.t=0}
  }
  Lv.enemies=Lv.enemies.filter(e=>!(e.st==='dead'&&e.t>.7));
}
function hazards(){
  const pb=pbox();
  for(const e of Lv.enemies){if(e.st==='dead')continue;
    if(e.st==='atk'&&e.t>.28&&e.t<.5&&P.inv<=0){const hb={x:e.dir>0?e.x:e.x-70,y:e.y-80,w:70,h:60};if(boxHit(hb,pb)){damage();continue}}
    const eb={x:e.x-e.w/2,y:e.y-e.h,w:e.w,h:e.h};
    if(boxHit(pb,eb)){if(P.vy>80&&P.y-eb.y<26){killEnemy(e,true);P.vy=(K.jump||K.up)?-700:-480;P.jumps=1}else if(e.st!=='stun')damage()}}
  for(const m of (Lv.malas||[])){const mb={x:m.x-18,y:m.y-26,w:36,h:26};if(boxHit(pb,mb)&&P.inv<=0)damage();
    if(!m.jumped&&!P.ground&&Math.abs(P.x-m.x)<20&&P.y<m.y-26&&m.y-P.y<110){m.jumped=true;score+=25;floatTxt(m.x,m.y-50,'+25');updHud()}}
  for(const v of Lv.vents)if(v.active&&boxHit(pb,ventRect(v)))damage();
  if(boss&&scene==='main'){const b=boss;
    for(const w of b.waves)if(boxHit(pb,{x:w.x-24,y:G-26,w:48,h:26}))damage();
    if(b.slamAt!=null&&Math.abs(P.x-b.slamAt)<80&&P.y>G-60)damage();
    if(['walk','wind','slam','rec'].includes(b.st)&&boxHit(pb,bossBox()))damage();
    if(b.st==='dizzy'&&boxHit(pb,bossBox()))bossHitBy()}
}
function killEnemy(e,stomp){e.st='dead';e.t=0;combo++;comboT=2.5;const pts=100*Math.min(combo,5);score+=pts;floatTxt(e.x,e.y-100,'+'+pts+(combo>1?' COMBO x'+combo:''));SFX.stomp();ink(e.x,e.y-40,10);updHud()}

/* ---------------- malas rolando ---------------- */
function updMalas(dt){
  const th=Lv.thrower;if(!th)return;
  if(!th.dead){th.t-=dt;th.anim=th.t<.45?(th.t<.2?5:4):0;if(th.t<=0){th.t=2.3+Math.random()*.6;Lv.malas.push({x:th.x-30,y:th.y-6,vx:-175,vy:0,rot:0,life:0,jumped:false})}}
  else th.deadT+=dt;
  for(const m of Lv.malas){m.life+=dt;m.vy=Math.min(m.vy+1900*dt,900);const py=m.y;m.x+=m.vx*dt;m.y+=m.vy*dt;m.rot+=m.vx*dt/16;
    let landed=false;for(const sg of Lv.oneway){if(sg.tag!=='tier')continue;if(m.x<sg.x1||m.x>sg.x2)continue;if(py<=sg.y1+2&&m.y>=sg.y1){m.y=sg.y1;landed=true}}
    if(m.y>=G&&m.x<4800){m.y=G;landed=true}
    if(landed){if(m.vy>250){m.vx=-m.vx;puff(m.x,m.y,.3);SFX.hit()}m.vy=0}}
  Lv.malas=Lv.malas.filter(m=>!m.dead&&m.life<16&&m.x>1300&&m.x<3000);
}
/* ---------------- vapor ---------------- */
function ventRect(v){return v.dir===0?{x:v.x-12,y:v.y-v.len,w:24,h:v.len}:v.dir<0?{x:v.x-v.len,y:v.y-22,w:v.len,h:30}:{x:v.x,y:v.y-22,w:v.len,h:30}}
function updVents(dt){for(const v of Lv.vents){const t=(T+v.ph)%v.per;const was=v.active;v.warn=t>v.per-v.on-.6&&t<v.per-v.on;v.active=t>=v.per-v.on;
  if(v.active&&!was&&Math.abs(v.x-P.x)<700)SFX.steam()}}

/* ---------------- projéteis ---------------- */
function updProjs(dt){
  for(const p of projs){p.x+=p.vx*dt;p.life-=dt;p.rot+=dt*14;const pb={x:p.x-12,y:p.y-8,w:24,h:16};
    for(const e of Lv.enemies){if(e.st==='dead')continue;if(boxHit(pb,{x:e.x-e.w/2,y:e.y-e.h,w:e.w,h:e.h})){p.life=0;e.hp--;SFX.hit();ink(p.x,p.y,4);if(e.hp<=0)killEnemy(e);else{e.st='stun';e.t=.35;e.x+=p.dir*10}break}}
    if(Lv.malas)for(const m of Lv.malas){if(p.life>0&&boxHit(pb,{x:m.x-18,y:m.y-26,w:36,h:26})){p.life=0;m.dead=true;score+=25;floatTxt(m.x,m.y-40,'+25');puff(m.x,m.y,.4);SFX.hit();updHud()}}
    const th=Lv.thrower;if(th&&!th.dead&&p.life>0&&boxHit(pb,{x:th.x-20,y:th.y-95,w:40,h:95})){p.life=0;th.hp--;SFX.hit();ink(p.x,p.y,5);if(th.hp<=0){th.dead=true;score+=300;floatTxt(th.x,th.y-110,'+300');ink(th.x,th.y-40,14);toast('O carregador caiu! Examine a pilha de malas.');updHud()}}
    const br=Lv.breakable;if(br&&!br.open&&p.life>0&&boxHit(pb,{x:br.x-24,y:br.y-30,w:48,h:30})){p.life=0;br.hit=.2;SFX.hit();puff(br.x,br.y,.3);toast('Não adianta: a mala está presa por um cadeado. Precisa da chave.')}
    if(boss&&p.life>0&&bossActive&&boxHit(pb,bossBox())){p.life=0;bossHitBy()}
    for(const s of Lv.solids){if(!s.ground&&!s.hide&&boxHit(pb,s)){p.life=0;break}}
  }
  for(let i=projs.length-1;i>=0;i--)if(projs[i].life<=0)projs.splice(i,1);
}

    if(v>.45&&d<60&&(!h.need||h.need(P))){if(h.kind==='lamp'){h.got=1;getLamp(h.x,h.y)}else if(h.kind==='clue'){h.ready=true;h.by=P.id}}else if(h.by===P.id)h.ready=false}

let near=null;
function updInter(){near=null;
  for(const c of (Lv.candles||[])){if(!c.lit&&Math.abs(P.x-c.x)<40&&Math.abs(P.y-c.y)<70){const lk=isTouch?'LUZ':COOP?(P.id?'J':'G'):'C';near={label:'Vela apagada · segure '+lk,use:()=>toast('Segure '+lk+' perto da vela para acendê-la com a lamparina.'),x:c.x-20,y:c.y-40,w:40,h:30}}}

}

let boss=null;
function bossBox(){return{x:boss.x-48,y:boss.y-190,w:96,h:190}}
function startBoss(){bossActive=true;Lv.solids.push({x:5680,y:G-300,w:20,h:300,hide:1,bw:1});boss={x:6420,y:G,hp:3,st:'intro',t:0,face:-1,slams:0,spd:1,flash:0,waves:[],qi:0,gone:{}};
  say([{q:'detetive',t:'O Agente Carimbo! Dizem que ele cansa depois de três golpes no chão. É nessa hora que a verdade o atinge — mas só se eu souber a resposta.'}]).then(()=>{boss.st='walk';boss.t=0})}
function updBoss(dt){
  if(!boss)return;const b=boss;b.t+=dt;b.slamAt=null;if(b.flash>0)b.flash-=dt;const tp=nearestP(b.x,b.y);
  for(const w of b.waves){w.x+=w.dir*340*b.spd*dt;w.life-=dt}
  b.waves=b.waves.filter(w=>w.life>0);
  if(b.st==='intro'||b.st==='dead'||b.st==='quiz')return;
  if(b.st!=='dizzy')b.face=tp.x<b.x?-1:1;
  if(b.st==='walk'){b.x+=b.face*80*b.spd*dt;b.x=clamp(b.x,5760,6600);if(Math.abs(tp.x-b.x)<170||b.t>2.2){b.st='wind';b.t=0}}
  else if(b.st==='wind'){if(b.t>.7/b.spd){b.st='slam';b.t=0;SFX.slam();shake=.45;ink(b.x+b.face*70,G-10,12);
      b.waves.push({x:b.x+b.face*90,dir:1,life:2},{x:b.x+b.face*90,dir:-1,life:2});
      b.slamAt=b.x+b.face*80}}
  else if(b.st==='slam'){if(b.t>.5){b.st='rec';b.t=0;b.slams++}}
  else if(b.st==='rec'){if(b.t>.55/b.spd){b.t=0;if(b.slams>=3){b.st='dizzy';b.slams=0;toast('Ele está tonto! Acerte-o agora!')}else b.st='walk'}}
  else if(b.st==='dizzy'){if(b.t>4.5){b.st='walk';b.t=0}}
  else if(b.st==='hurt'){if(b.t>1.1){b.st='walk';b.t=0}}
}
function bossHitBy(){const b=boss;if(b.st!=='dizzy'){SFX.hit();floatTxt(b.x,b.y-200,'Sem efeito!');return}
  b.st='quiz';const D=CH.desafios[3-b.hp];
  openChallenge(D,b,ok=>{
    if(ok){b.hp--;b.flash=1;b.st='hurt';b.t=0;score+=300;floatTxt(b.x,b.y-210,'+300');ink(b.x,b.y-100,16);shake=.5;P.vx=-b.face*-300;P.x+=(P.x<b.x?-40:40);
      if(b.hp<=0)bossDefeat()}
    else{b.st='walk';b.t=0;b.spd=Math.min(1.8,b.spd*1.2);toast('O Agente se enfureceu!')}
    updHud()})}
function bossDefeat(){const b=boss;b.st='dead';b.t=0;bossDone=true;SFX.win();for(let i=0;i<30;i++)parts.push({img:Math.random()<.5?'pag1':'pag2',x:b.x,y:b.y-100,vx:(Math.random()-.5)*600,vy:-Math.random()*700,life:2.4,rot:Math.random()*6,vr:(Math.random()-.5)*10,s:.07+Math.random()*.04,g:900});

function bubble(x,y,nome,text){ctx.save();ctx.font='14px Lora, Georgia, serif';const words=text.split(' '),lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>220&&cur){lines.push(cur);cur=w}else cur=t}lines.push(cur);
  const lh=18,wd=Math.max(...lines.map(l=>ctx.measureText(l).width),ctx.measureText(nome).width)+22,ht=lines.length*lh+30,bx=x-wd/2,by=y-ht-10;
  ctx.fillStyle='rgba(251,243,223,.96)';ctx.strokeStyle='#5a3418';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(bx,by,wd,ht,9);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-8,by+ht-1);ctx.lineTo(x,by+ht+10);ctx.lineTo(x+8,by+ht-1);ctx.fill();
  ctx.textAlign='left';ctx.fillStyle='#8e3418';ctx.font='bold 11px "Special Elite",monospace';ctx.fillText(nome.toUpperCase(),bx+11,by+15);
  ctx.fillStyle='#2b1a0d';ctx.font='14px Lora, Georgia, serif';lines.forEach((l,i)=>ctx.fillText(l,bx+11,by+33+i*lh));ctx.restore()}
function drawPlayer(){
  let f=5;const run=Math.abs(P.vx)>20;
  if(P.climb)f=Math.floor(P.an*3)%2?7:6;
  else if(P.hurt>0)f=12;else if(P.throwT>0)f=P.throwT>.18?10:11;
  else if(!P.ground)f=P.vy<-150?7:8;else if(P.land>0)f=9;else if(K.lamp&&!run)f=13;else if(run)f=Math.floor(P.an)%6;
  const al=P.inv>0&&Math.sin(T*30)>0?.35:1;
  const fem=P.gen==='f'&&IMG.detF,alt=COOP&&P.id===1&&!fem;
  if(alt)ctx.filter='hue-rotate(185deg) saturate(.85)';
  sheet(fem?'detF':'det',SH.det,f,P.x,P.y,P.face<0&&!P.climb,al);ctx.filter='none';
  if(COOP){const c=P.id?'#5fd0c4':'#ffcf7a';ctx.save();ctx.font='bold 12px "Special Elite",monospace';ctx.textAlign='center';const t=(P.nome||'J'+(P.id+1)).slice(0,12),w=ctx.measureText(t).width+12;
    ctx.fillStyle='rgba(20,10,4,.8)';ctx.beginPath();ctx.roundRect(P.x-w/2,P.y-P.h-34,w,17,6);ctx.fill();ctx.fillStyle=c;ctx.fillText(t,P.x,P.y-P.h-21);
    ctx.beginPath();ctx.moveTo(P.x-5,P.y-P.h-17);ctx.lineTo(P.x+5,P.y-P.h-17);ctx.lineTo(P.x,P.y-P.h-11);ctx.fill();ctx.restore()}
}
function drawLight(){const p0=P,k0=K;for(const q of PLAYERS){P=q;K=q.K;drawLight1()}P=p0;K=k0}
function drawLight1(){
  if(!K.lamp||state!=='play')return;const cam=scene==='main'||scene==='campo';const x=(P.x+P.face*22-(cam?camX:0)),y=(P.y-46-(scene==='main'?camY:0));
  ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(x,y,4,x,y,200);g.addColorStop(0,'rgba(255,200,110,.45)');g.addColorStop(.5,'rgba(255,150,50,.15)');g.addColorStop(1,'rgba(255,120,30,0)');ctx.fillStyle=g;ctx.fillRect(x-200,y-200,400,400);ctx.restore();
}

/* ================== LOOP ================== */
let last=0;
function frame(now){
  requestAnimationFrame(frame);if(!Lv)return;
  const dt=Math.min(.033,(now-last)/1000||0);last=now;
  if(state==='play'){T+=dt;elapsed+=dt;
    if(fading&&fadeCb){fading+=dt*4;if(fading>=1.5&&fadeCb){const cb=fadeCb;fadeCb=null;use(PLAYERS[0]);cb();gather();fading=1}}
    if(!fading||fading<1){updEnemies(dt);updMalas(dt);updVents(dt);updBoss(dt);updProjs(dt);updCrumble(dt);
      for(const q of PLAYERS){use(q);updatePlayer(dt);if(state!=='play')break;hazards();updPickups(dt);updInter();q.near=near;if(state!=='play'||fadeCb)break}
      use(PLAYERS[0]);for(const h of Lv.hidden){h.vis=h._v>0?h._v:Math.max(0,(h.vis||0)-dt*2);h._v=0}}
    if(fading&&!fadeCb){fading-=dt*3;if(fading<=0)fading=0}
    if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}
    if(shake>0)shake=Math.max(0,shake-dt);
    updParts(dt);
    // câmera
    if(scene==='main'||scene==='campo'){const mx=PLAYERS.reduce((a,q)=>a+q.x,0)/PLAYERS.length,my=Math.min(...PLAYERS.map(q=>q.y));let tx=COOP?mx-VW*.5:P.x-VW*.42+P.face*40;let minX=0,maxX=Lv.w-VW;if(bossActive&&scene==='main'){minX=5680;maxX=6660-VW}camX+=(clamp(tx,minX,maxX)-camX)*Math.min(1,dt*5);
      if(scene==='main'){const ty=Math.min(0,(COOP?my:P.y)-330);camY+=(clamp(ty,-280,0)-camY)*Math.min(1,dt*4)}else camY=0}
    if(scene==='main'&&!bossActive&&!bossDone&&gateOpen&&PLAYERS.some(q=>q.x>5760)){startBoss();PLAYERS.forEach(q=>{if(q.x<5720){q.x=5730;q.y=G;q.vx=q.vy=0}})}
    if(AC)musicTick();
  }else if(state==='cine'){T+=dt;updParts(dt);if(fading&&!fadeCb){fading-=dt*3;if(fading<=0)fading=0}}
  else if(state==='pause'||state==='modal'){for(const q of PLAYERS)for(const k in q.PR)q.PR[k]=0}
  try{draw()}catch(e){console.error(e)}
}

function comic(){return new Promise(res=>{let i=0;const d=document.createElement('div');d.id='comic';document.body.appendChild(d);
  const show=()=>{const q=HQ[i];d.innerHTML=`<div class="fr"><img class="bg" src="${q.img}" alt="">${q.fol?'<img class="fol" src="img/q1/folhinha.webp" alt="">':''}<button class="skip">Pular ▸▸</button><div class="cap"><b>${q.tit} · ${i+1}/${HQ.length}</b>${q.t}</div><span class="nx">▸ clique ou ESPAÇO</span></div>`;SFX.page();
    d.querySelector('.skip').onclick=e=>{e.stopPropagation();end()}};
  const end=()=>{d.remove();removeEventListener('keydown',kd);clearInput();res()};
  const next=()=>{i++;if(i>=HQ.length)end();else show()};
  const kd=e=>{if(['Space','Enter','ArrowRight'].includes(e.code)){e.preventDefault();next()}else if(e.code==='Escape')end()};
  d.addEventListener('click',next);addEventListener('keydown',kd);show()})}

      const TT={80:'Jogador 1: A/D anda, W ou ESPAÇO pula · Jogador 2: setas, ↑ pula. Um pode subir na cabeça do outro!',300:'Papel: F (jogador 1) ou K (jogador 2). Também dá para pular na cabeça dos capangas!',520:'Lamparina: segure G (jogador 1) ou J (jogador 2) — ela revela o que está escondido.'};W.main.triggers.forEach(t=>{if(TT[t.x])t.msg=TT[t.x]})}
