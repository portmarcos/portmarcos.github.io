<style>

#toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:6;font-family:'Special Elite',monospace;font-size:clamp(.8rem,1.6vw,1.1rem);background:rgba(18,10,24,.88);border:1px solid #8b73bd;border-radius:10px;padding:8px 14px;max-width:80%;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#prompt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);z-index:5;font-family:'Special Elite',monospace;background:rgba(18,10,24,.85);border:1px solid var(--amber);color:var(--amber2);border-radius:20px;padding:5px 14px;font-size:clamp(.75rem,1.5vw,1rem);pointer-events:none}
#dlg{position:absolute;left:3%;right:3%;bottom:3%;z-index:7;display:flex;gap:12px;align-items:stretch;background:rgba(14,8,18,.94);border:2px solid #8b73bd;border-radius:14px;padding:10px 14px;min-height:20%}
#dlg img{height:clamp(70px,16vw,150px);width:auto;border-radius:8px;border:1px solid #5d4a7a;object-fit:cover;aspect-ratio:3/4;background:#201428}

#dlg .x{font-size:clamp(.85rem,1.8vw,1.2rem);line-height:1.45}
#dlg .k{align-self:flex-end;font-size:.75rem;color:var(--muted);animation:bl 1s infinite}

.ov{position:absolute;inset:0;z-index:20;background:rgba(7,4,10,.93);display:flex;align-items:center;justify-content:center;padding:3%;overflow:auto}
.panel{background:linear-gradient(180deg,#201630,#150e20);border:2px solid #8b73bd;border-radius:16px;padding:clamp(12px,2.4vw,26px);max-width:min(860px,100%);width:100%;box-shadow:0 12px 50px #000}
.panel h2{font-family:'Playfair Display',serif;color:var(--amber2);font-size:clamp(1.1rem,2.8vw,1.8rem);margin-bottom:8px}
.panel p{line-height:1.5;margin:6px 0;font-size:clamp(.85rem,1.7vw,1.1rem)}
.cita{border-left:3px solid var(--amber);padding:8px 12px;margin:10px 0;font-style:italic;background:rgba(255,255,255,.04);font-size:clamp(.85rem,1.7vw,1.1rem);line-height:1.55}
.src{font-size:.78rem;color:var(--muted);margin-top:-4px}
.btn{background:linear-gradient(180deg,#e3a84a,#b0701f);color:#1a0f08;font-weight:700;border:none;border-radius:10px;padding:9px 18px;margin:6px 6px 0 0;font-size:clamp(.85rem,1.6vw,1.05rem)}
.btn.sec{background:#2b1f3d;color:var(--paper);border:1px solid #6b55a0}
.btn:disabled{opacity:.4;cursor:default}
.opt{display:block;width:100%;text-align:left;background:#2b1f3d;border:1px solid #6b55a0;border-radius:10px;padding:9px 12px;margin:7px 0;font-size:clamp(.82rem,1.6vw,1.05rem);line-height:1.4}
.opt:hover:not(:disabled){background:#3a2b52}
.opt.ok{background:#1f4a28;border-color:#5fb36a}
.opt.bad{background:#552018;border-color:#c0523a}
.bar{height:6px;background:#2b1f3d;border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--amber);width:0}
input[type=text]{width:100%;padding:9px 12px;border-radius:8px;border:1px solid #6b55a0;background:#120b1c;color:var(--paper);font:inherit;margin:4px 0 8px;-webkit-user-select:text;user-select:text}
.gpick{display:flex;gap:8px;margin:6px 0 10px}
.gpick button{flex:1;background:#2b1f3d;border:2px solid #6b55a0;border-radius:10px;padding:8px}
.gpick button.on{border-color:var(--amber);background:#3d2b57}
/* abertura */
.card{position:relative;background:#e9dcc0;color:#2a1a10;border-radius:6px;padding:clamp(18px,4vw,48px);text-align:center;font-family:'Playfair Display',serif;font-weight:700;letter-spacing:.04em;line-height:1.7;box-shadow:inset 0 0 40px rgba(90,50,10,.35);font-size:clamp(.95rem,2.6vw,1.7rem)}
.card small{display:block;font-family:'Special Elite',monospace;font-size:.5em;letter-spacing:.1em;margin-bottom:10px;opacity:.7}
#scr{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.panelImg{width:100%;border-radius:8px;border:1px solid #5d4a7a}
/* touch */
#touch{position:absolute;inset:0;z-index:4;pointer-events:none}
#touch button{pointer-events:auto;position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,12,30,.55);color:#fff;font-size:1.3rem;width:clamp(48px,11vw,72px);height:clamp(48px,11vw,72px);touch-action:none}
#tL{left:2%;bottom:6%}#tR{left:calc(2% + clamp(56px,13vw,84px));bottom:6%}
#tJ{right:2%;bottom:6%}#tA{right:calc(2% + clamp(56px,13vw,84px));bottom:6%;font-size:.8rem}#tC{right:calc(2% + clamp(28px,6.5vw,42px));bottom:calc(6% + clamp(56px,13vw,84px))}
body:not(.touch) #touch{display:none}
#rot{position:fixed;inset:0;z-index:99;background:#07050a;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:1.2rem}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}

  <span class="hs" id="hLamp"></span><span class="hs">Pandora <b id="hPag">3/3</b></span><span class="hs">Pontos <b id="hPts">0</b></span>
  <span class="hs" id="hTask"></span><span class="sp"></span>
  <button id="bMute" title="Som (M)">♪</button><button id="bPause" title="Pausa (Esc)">II</button>
</div>
<div id="toast"></div><div id="prompt" class="hidden"></div>
<div id="dlg" class="hidden"><img id="dImg" alt=""><div class="t"><div class="n" id="dNome"></div><div class="x" id="dTxt"></div></div><div class="k">Espaço ▶</div></div>
<div id="touch"><button id="tL">◀</button><button id="tR">▶</button><button id="tJ">PULO</button><button id="tA">AÇÃO</button><button id="tC">✦</button></div>

</div></div>

<script>
"use strict";
/* ============ Constantes ============ */
const CW=960,CH=540,G=480,WW=960;
const DPR=Math.min(window.devicePixelRatio||1,1.5);
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');cv.width=CW*DPR;cv.height=CH*DPR;
const $=id=>document.getElementById(id);
const SAVE='caso_realismo_v1';
const SRC={det:'../caso-originais/img/q1/detetive.webp',detF:'../caso-originais/img/q1/detetive-f.webp',bras:'img/q1/bras.webp',hipo:'img/q1/hipopotamo.webp',
 bg:'img/q1/bg-velorio.webp',bgd:'img/q1/bg-delirio.webp',retBras:'img/q1/ret-bras.webp',retDet:'../caso-originais/img/detetive.webp',retDetF:'../caso-originais/img/detetive-f.webp',
 bgi:'img/q1/bg-infancia.webp',qui:'img/q1/quincas.webp',retQui:'img/q1/ret-quincas.webp',pan:'img/q1/pandora.webp',retPan:'img/q1/ret-pandora.webp'};
const OPCIONAL=['hq2','hq3','amigos','caixao','padre'];
const IMG={};
const SH={det:{w:269,h:232,s:.47},bras:{w:137,h:340,s:.37},hipo:{w:303,h:230,s:.6},qui:{w:194,h:340,s:.37},pan:{w:223,h:330,s:1.1}};
function loadAll(cb){
  const keys=Object.keys(SRC);let n=0;
  keys.forEach(k=>{const im=new Image();im.onload=()=>{IMG[k]=im;if(++n===keys.length)cb()};im.onerror=()=>{if(++n===keys.length)cb()};im.src=SRC[k]});
}
function sheet(k,sh,f,x,y,flip,alpha,sc){
  const im=IMG[k];if(!im)return;const s=sh.s*(sc||1),w=sh.w*s,h=sh.h*s;
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.translate(x,y+3);if(flip)ctx.scale(-1,1);
  ctx.drawImage(im,f*sh.w,0,sh.w,sh.h,-w/2,-h,w,h);ctx.restore();
}
/* ============ Estado ============ */
let state='start',T=0,camX=0,shake=0,flash=0;
const S={nome:'',turma:'',gen:'m'};
const Z={pts:0,pages:0,lamps:3,leit:0,tot:3,enviou:false};
const F={porta:false};
const B={hp:3,r:0,ph:'wait',t:0,sp:0,atk:[],laugh:0,hurt:0,vine:[]};
const LOBO={x:0,dir:1,pause:0,on:false,seen:0};const BUSH=[];let hidden=false;let crowd=[],crowdT=4;
const K={left:0,right:0,jump:0,lamp:0,act:0};
const P={x:110,y:G,vx:0,vy:0,face:1,ground:true,jumps:2,inv:0,an:0,land:0,hurt:0};
let cpX=110,lastStep=0;
const PITS=[];
const PLAT=[{x:150,y:G-100,w:110},{x:360,y:G-170,w:110},{x:560,y:G-100,w:110}];
const PAGES=[];
let stamps=[],stampT=3,rain=[],bolt=0,boltT=8,hint=0,hipo={on:false,x:0,y:0,t:0},cine=null,paused=false,floaters=[],marks=[];
for(let i=0;i<240;i++)rain.push({x:Math.random()*CW*1.3,y:Math.random()*CH,v:520+Math.random()*320,l:10+Math.random()*14});
/* ============ Áudio ============ */
let AC=null,rainG=null,muted=false;
function audio(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=.5;
  rainG=AC.createGain();rainG.gain.value=muted?0:.012;s.connect(f).connect(rainG).connect(AC.destination);s.start();
}
function noiseBurst(dur,freq,vol){if(!AC||muted)return;const n=AC.sampleRate*dur,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=AC.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(AC.destination);s.start()}
function tone(fr,dur,vol,type){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=fr;g.gain.value=vol||.04;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+dur)}
const thunder=()=>noiseBurst(1.8,320,.5),thud=()=>noiseBurst(.4,200,.7),blip=v=>tone(180+v*40,.05,.025,'triangle');
function setMute(m){muted=m;if(rainG)rainG.gain.value=m?0:.012;$('bMute').textContent=m?'×':'♪'}
/* ============ Utilidades de UI ============ */
let toastT=0;
function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms||3200)}
const NARR={queda:['Nada.','Nem o chão, leitor.','Mais uma negativa.'],
 carimbo:['Pandora ri; a Natureza não pede desculpas.','Uma negativa acertou o narrador. Nada de novo sob o sol.','A Natureza não ouve queixas, leitor.'],
 pag:['Uma folha do sistema. Humanitas agradece.','Folha guardada. Quincas Borba vai querer revisar.']};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function addPts(n,x,y){Z.pts+=n;floaters.push({x,y,t:0,s:'+'+n});hud()}
const NP=3;
function hud(){
  let l='';for(let i=0;i<3;i++)l+='<span class="lamp'+(i<Z.lamps?'':' off')+'"></span>';$('hLamp').innerHTML='Lamparinas '+l;
  $('hPag').textContent=B.hp+'/3';$('hPts').textContent=Z.pts;
  $('hTask').innerHTML='Rodada <b>'+Math.min(3,B.r+1)+'/3</b>';
}
/* ============ Diálogo ============ */
let dq=null,dI=0,typing=null,dFull='';
function say(lines){return new Promise(res=>{
  const prev=state;state='dialog';dq={lines,i:0,res,prev};$('dlg').classList.remove('hidden');$('prompt').classList.add('hidden');next();});}
const WHO={pan:['Pandora (a Natureza)','retPan'],qui:['Quincas Borba','retQui'],pla:['Dona Plácida','retPla'],bras:['Brás Cubas','retBras'],det:['Detetive',null],narr:['Narrador (o defunto)','retBras'],prud:['Prudêncio (menino)','retPrud'],quincas:['Quincas Borba','retQuincas'],ludg:['Mestre Ludgero',null]};
function next(){
  if(typing&&dI<dFull.length){dI=dFull.length;$('dTxt').textContent=dFull;clearInterval(typing);typing=null;return}
  if(dq.i>=dq.lines.length){$('dlg').classList.add('hidden');state=dq.prev==='dialog'?'play':dq.prev;const r=dq.res;dq=null;r();return}
  const [w,t]=dq.lines[dq.i++];const info=WHO[w];$('dNome').textContent=w==='det'?(S.nome||'Detetive'):info[0];
  const ik=w==='det'?(S.gen==='f'?'retDetF':'retDet'):info[1];if(ik){$('dImg').src=SRC[ik];$('dImg').style.display=''}else $('dImg').style.display='none';
  dFull=t;dI=0;$('dTxt').textContent='';clearInterval(typing);
  typing=setInterval(()=>{dI++;$('dTxt').textContent=dFull.slice(0,dI);if(dI%2===0)blip(w==='det'?1:3);if(dI>=dFull.length){clearInterval(typing);typing=null}},24);
}
/* ============ Modais ============ */
function ov(html){const o=$('ov');o.innerHTML='<div class="panel">'+html+'</div>';o.classList.remove('hidden')}
function ovClose(){$('ov').classList.add('hidden');$('ov').innerHTML=''}
function leitura(cfg){
  return new Promise(res=>{
    const prev=state;state='modal';const words=cfg.cita.split(/\s+/).length,secs=Math.max(8,Math.ceil(words/5));
    ov('<h2>'+cfg.titulo+'</h2><p>Leia com calma. A pergunta aparece quando o tempo acabar.</p><div class="cita">'+cfg.cita+'</div><div class="src">'+cfg.fonte+'</div><div class="bar"><i id="lb"></i></div><div id="lq"></div>');
    const b=$('lb');let t0=performance.now();const iv=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/(secs*1000));b.style.width=(p*100)+'%';if(p>=1){clearInterval(iv);perg()}},100);
    function perg(){
      const q=cfg.q;let h='<p><b>'+q.t+'</b></p>';q.o.forEach((o,i)=>h+='<button class="opt" data-i="'+i+'">'+o+'</button>');$('lq').innerHTML=h;
      let tries=0;$('lq').querySelectorAll('.opt').forEach(bt=>bt.onclick=()=>{
        const i=+bt.dataset.i;if(i===q.k){bt.classList.add('ok');$('lq').querySelectorAll('.opt').forEach(x=>x.disabled=true);
          $('lq').insertAdjacentHTML('beforeend','<p>'+q.e+'</p><button class="btn" id="lok">Continuar</button>');
          const first=tries===0;if(first){Z.leit++;addPts(100,P.x-camX,P.y-120)}else addPts(40,P.x-camX,P.y-120);
          $('lok').onclick=()=>{ovClose();state=prev;res(first)}}
        else{tries++;bt.classList.add('bad');bt.disabled=true;blip(-3);toast('Releia o trecho e tente de novo.',1800)}});
    }
  });
}
function ordenarFases(){
  return new Promise(res=>{
    const prev=state;state='modal';
    const frag=['A estática: anterior a toda a criação','A expansiva: o começo das coisas','A dispersiva: o aparecimento do homem','A contrativa: a absorção do homem e das coisas'];
    let ordem=frag.map((t,i)=>({t,i})).sort(()=>Math.random()-.5),prox=0,erros=0;
    ov('<h2>As fases de Humanitas</h2><p>Quincas Borba explica que Humanitas tem quatro fases. Toque nelas na ordem em que ele as apresenta.</p><div class="card" id="dd" style="min-height:5em;font-size:clamp(.8rem,1.8vw,1.2rem)"><small>O HUMANITISMO</small><span id="ddt"></span></div><div id="fr"></div>');
    const draw=()=>{$('ddt').innerHTML=frag.slice(0,prox).join('<br>');
      $('fr').innerHTML=ordem.filter(o=>o.i>=prox).map(o=>'<button class="opt" data-i="'+o.i+'">'+o.t+'</button>').join('');
      $('fr').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(+b.dataset.i===prox){prox++;tone(520+prox*60,.12,.05,'triangle');draw()}else{erros++;b.classList.add('bad');tone(110,.2,.05);setTimeout(()=>b.classList.remove('bad'),500)}});
      if(prox>=frag.length){$('fr').innerHTML='<p>Ordem certa: estática, expansiva, dispersiva e (a que "contará mais uma") contrativa. Quincas fala com solenidade de ciência, e Machado faz a paródia do pensamento sistemático.</p><button class="btn" id="dok">Continuar</button>';
        $('dok').onclick=()=>{ovClose();state=prev;addPts(erros===0?150:80,CW/2,200);res()}}};
    draw();
  });
}
function restaurarFrase(){
  return new Promise(res=>{
    const prev=state;state='modal';
    const frag=['Humanitas, dizia ele,','o princípio das coisas,','não é outro senão o mesmo homem','repartido por todos os homens.'];
    let ordem=frag.map((t,i)=>({t,i})).sort(()=>Math.random()-.5),prox=0,erros=0;
    ov('<h2>A página do capítulo 117</h2><p>O Carimbo rasgou a definição de Humanitas em quatro pedaços. Toque nos pedaços na ordem certa.</p><div class="card" id="dd" style="min-height:5em"><small>CAPÍTULO CXVII</small><span id="ddt"></span></div><div id="fr"></div>');
    const draw=()=>{$('ddt').innerHTML=frag.slice(0,prox).join(' ');
      $('fr').innerHTML=ordem.filter(o=>o.i>=prox).map(o=>'<button class="opt" data-i="'+o.i+'" style="display:inline-block;width:auto;margin:5px">'+o.t+'</button>').join('');
      $('fr').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(+b.dataset.i===prox){prox++;tone(520+prox*60,.12,.05,'triangle');draw()}else{erros++;b.classList.add('bad');tone(110,.2,.05);setTimeout(()=>b.classList.remove('bad'),500)}});
      if(prox>=frag.length){$('fr').innerHTML='<p>Restaurada: Humanitas é o princípio de tudo, "o mesmo homem repartido por todos os homens". O Humanitismo é uma paródia das filosofias do século XIX, que explicavam tudo com sistemas grandiosos.</p><button class="btn" id="dok">Guardar a página</button>';
        $('dok').onclick=()=>{ovClose();state=prev;addPts(erros===0?200:120,CW/2,200);res()}}};
    draw();
  });
}
/* ============ Interações ============ */
const FONTE='Machado de Assis, Memórias Póstumas de Brás Cubas, cap. ';

function nearInter(){

  for(const it of INTER){
    if(it.done&&it.done())continue;if(it.cond&&!it.cond())continue;if(it.need==='lamp'&&!K.lamp)continue;
    const d=Math.abs(P.x-it.x);if(d<it.r&&d<bd){best=it;bd=d}}

function updatePlayer(dt){
  const ax=K.right-K.left,sp=210;
  P.vx+=((ax*sp)-P.vx)*Math.min(1,dt*10);if(ax)P.face=ax;
  const py=P.y;P.x+=P.vx*dt;P.x=Math.max(30,Math.min(WW-30,P.x));
  P.vy+=1750*dt;P.y+=P.vy*dt;
  let land=null;
  if(P.vy>=0){
    if(onGround(P.x)&&py<=G+1&&P.y>=G)land=G;
    for(const p of PLAT){if(P.x>p.x-10&&P.x<p.x+p.w+10&&py<=p.y+1&&P.y>=p.y){if(land==null||p.y<land)land=p.y}}
  }
  if(land!=null){if(!P.ground&&P.vy>300){P.land=.12;thud2()}P.y=land;P.vy=0;P.ground=true;P.jumps=2}else P.ground=false;
  if(K.jump&&!P._j){P._j=1;if(P.ground||P.jumps>0){P.vy=-640;if(!P.ground)P.jumps=Math.max(0,P.jumps-1);else P.jumps=1;P.ground=false;tone(300,.08,.03,'triangle')}}
  if(!K.jump)P._j=0;
  P.an+=Math.abs(P.vx)*dt/38;P.inv=Math.max(0,P.inv-dt);P.land=Math.max(0,P.land-dt);P.hurt=Math.max(0,(P.hurt||0)-dt);
  if(P.y>G+170)fall();
  for(const c of [1300,2250])if(P.x>c&&cpX<c)cpX=c;
}

function spawnAtk(r){

  if(r>=0&&B.sp<=0){B.atk.push({k:'neg',x:rx(),y:-40,w:0,wd:pick(['NÃO','NADA','NEM','FIM']),warn:.9,d:0});B.sp=[1.15,1.5,1.7][r]}

function updateWorld(dt){
  B.sp-=dt;B.sp2=(B.sp2||0)-dt;B.sp3=(B.sp3||0)-dt;B.laugh=Math.max(0,B.laugh-dt);B.hurt=Math.max(0,B.hurt-dt);
  if(state==='play'&&B.ph==='fight'){
    B.t+=dt;spawnAtk(B.r);
    const ph=P.y-70,pb=P.y;
    for(const a of B.atk){
      if(a.k==='neg'){a.warn-=dt;if(a.warn<=0){a.y+=520*dt;if(!a.d&&Math.abs(P.x-a.x)<30&&a.y+16>ph&&a.y-16<pb){a.d=1;hit();B.laugh=1}}}

      else if(a.k==='vinha'){a.t+=dt;if(a.t>1&&a.t<1.45&&!a.d&&Math.abs(P.x-a.x)<42&&P.y>G-150){a.d=1;hit();B.laugh=1}if(a.t>1&&a.t<1.05)shake=.3}

    if(B.t>=RODADAS[B.r].dur){B.ph='ask';B.atk=[];perguntar()}

  shake=Math.max(0,shake-dt);

  B.hp--;B.hurt=1.6;shake=.8;flash=1;thud();Z.lamps=Math.min(3);Z.lamps=Math.min(3,Z.lamps+1);hud();
  if(B.hp<=0){B.ph='end';await say([['pan','Não... o teu raciocínio é mais forte que a minha surdez. Vives, pois, verme.'],['bras','Vivo? Já morri, Pandora. Mas deixei a minha memória.']]);startCine();return}

/* ============ Início, HQ, fim ============ */
function iniciar(){
  ov('<h2>O Caso dos Narradores Trocados</h2><p><b>Fase 1 · Chefe: Pandora, a Natureza</b> (Memórias Póstumas de Brás Cubas, Machado de Assis).</p><p>No delírio de Brás, a Natureza (Pandora) aparece como mãe e inimiga. Desvie das negativas, do frio e das vinhas durante cada rodada; quando ela se cansar, leia o trecho e responda para feri-la. Três rodadas, três acertos.</p>'+
   '<p>Seu primeiro nome ou apelido:</p><input type="text" id="iN" maxlength="16" placeholder="Nome"><input type="text" id="iT" maxlength="12" placeholder="Turma (ex.: 3º A)"><p>Detetive:</p><div class="gpick"><button id="gM" class="on">Ele</button><button id="gF">Ela</button></div>'+
   '<p style="font-size:.85em;color:var(--muted)">Setas ou A/D: andar · Espaço: pular (duplo) · C: lamparina · E: ação · Esc: pausa. No celular, use os botões na tela.</p><button class="btn" id="go">Começar</button><button class="btn sec" id="back">Voltar ao Arquivo</button>');
  $('gM').onclick=()=>{S.gen='m';$('gM').classList.add('on');$('gF').classList.remove('on')};$('gF').onclick=()=>{S.gen='f';$('gF').classList.add('on');$('gM').classList.remove('on')};
  $('back').onclick=()=>{location.href='../index.html'};
  $('go').onclick=()=>{S.nome=($('iN').value||'').trim()||'Detetive';S.turma=($('iT').value||'').trim();audio();setMute(muted);comecar()};
}



function comecar(){
  ovClose();state='play';$('hud').classList.remove('hidden');hud();
  say([['narr','Chegamos ao fim da viagem, leitor: a planície de neve do delírio, onde mora a Natureza. Fique de pé, desvie, e responda quando ela se cansar.']]).then(()=>{B.ph='fight';B.t=0;B.sp=1;B.sp2=2;B.sp3=3;hud()});
}
function fim(){
  state='end';$('hud').classList.add('hidden');
  const pct=Math.round((Z.leit/Z.tot)*100);
  try{const o=JSON.parse(localStorage.getItem(SAVE)||'{}');o.zonas=o.zonas||{};o.found=o.found||{};o.done=o.done||[];
    if(!o.zonas[10]||o.zonas[10]<Z.pts)o.zonas[10]=Z.pts;o.found.z10=1;if(o.done.indexOf(1)<0)o.done.push(1);o.score=Object.values(o.zonas).reduce((a,b)=>a+b,0);localStorage.setItem(SAVE,JSON.stringify(o))}catch(e){}
  enviar(pct);
  ov('<h2>Fase 1 concluída: Memórias Póstumas</h2><p>Pontos do chefe: <b>'+Z.pts+'</b> · Leituras certas de primeira: <b>'+Z.leit+'/'+Z.tot+'</b></p>'+
   '<p>Você enfrentou a Natureza de Pandora, "mãe e inimiga", e viu o pessimismo de Machado fechar o romance com uma negativa: "não transmiti a nenhuma criatura o legado da nossa miséria".</p>'+
   '<p><b>Próxima fase:</b> O Mulato, de Aluísio Azevedo (Naturalismo). Em construção.</p><button class="btn" id="ba">Voltar ao Arquivo</button><button class="btn sec" id="rj">Jogar de novo</button>');
  $('ba').onclick=()=>{location.href='../index.html'};$('rj').onclick=()=>location.reload();
}
function enviar(pct){
  if(Z.enviou)return;Z.enviou=true;
  try{if(typeof SHEETS_URL==='undefined'||!SHEETS_URL)return;
    fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({atividade:'Caso 2 · Fase 1 · Chefe · Pandora',nome:S.nome,turma:S.turma,acertos:Z.leit,total:Z.tot,pct:pct,abertas:'Pontos: '+Z.pts})}).catch(()=>{});}catch(e){}
}
/* ============ Entrada ============ */
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyC:'lamp',KeyE:'act',Enter:'act'};
addEventListener('keydown',e=>{
  const k=KM[e.code];
  if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')pause(true);else if(paused)pause(false);return}
  if(e.code==='KeyM'){setMute(!muted);return}
  if(state==='dialog'&&(e.code==='Space'||e.code==='Enter'||e.code==='KeyE')){e.preventDefault();next();return}
  if(!k)return;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
  if(k==='act'){if(!K.act&&state==='play')doAct();K.act=1;return}K[k]=1;
});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)K[k]=0});
function doAct(){const it=nearInter();if(it)it.act()}
function pause(on){paused=on;if(on){state='pause';ov('<h2>Pausa</h2><button class="btn" id="rs">Continuar</button><button class="btn sec" id="bk">Voltar ao Arquivo</button>');$('rs').onclick=()=>pause(false);$('bk').onclick=()=>location.href='../index.html'}else{ovClose();state='play'}}
$('bPause').onclick=()=>{if(state==='play')pause(true)};$('bMute').onclick=()=>setMute(!muted);
$('dlg').addEventListener('pointerdown',e=>{e.preventDefault();if(state==='dialog')next()});
function bindT(id,k,act){const b=$(id);const on=e=>{e.preventDefault();if(act){if(state==='dialog'){next();return}if(state==='play')doAct()}else K[k]=1};const off=e=>{e.preventDefault();if(!act)K[k]=0};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)}
bindT('tL','left');bindT('tR','right');bindT('tJ','jump');bindT('tC','lamp');bindT('tA',null,true);
if('ontouchstart' in window||navigator.maxTouchPoints>0)document.body.classList.add('touch');
/* ============ Laço ============ */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;T+=dt;
  if(state==='play'){updatePlayer(dt);updateWorld(dt);
    camX+=((P.x-CW*.42)-camX)*Math.min(1,dt*5);camX=Math.max(0,Math.min(WW-CW,camX));
    const it=nearInter();const pr=$('prompt');if(it){pr.textContent=it.txt;pr.classList.remove('hidden')}else pr.classList.add('hidden');
    if(K.lamp&&!K._l){K._l=1;}if(!K.lamp)K._l=0;
  }else if(state==='dialog'){updateWorld(dt);P.vx=0}
  render(dt);
}
window.__t={B,RODADAS,LOBO,P,F,Z,PAGES,INTER,get state(){return state},set state(v){state=v},get camX(){return camX},set camX(v){camX=v},provas,startCine,fim,K};
loadAll(()=>{requestAnimationFrame(loop);iniciar();hud()});
</script>
</body>
