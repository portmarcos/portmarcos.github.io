<script>
"use strict";
/* ============ Constantes ============ */
const CW=960,CH=540,G=480,WW=3700;
const DPR=Math.min(window.devicePixelRatio||1,1.5);
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');cv.width=CW*DPR;cv.height=CH*DPR;
const $=id=>document.getElementById(id);
const SAVE='caso_realismo_v1';
const SRC={det:'../caso-originais/img/q1/detetive.webp',detF:'../caso-originais/img/q1/detetive-f.webp',bras:'img/q1/bras.webp',hipo:'img/q1/hipopotamo.webp',
 bg:'img/q1/bg-velorio.webp',bgd:'img/q1/bg-delirio.webp',retBras:'img/q1/ret-bras.webp',retDet:'../caso-originais/img/detetive.webp',retDetF:'../caso-originais/img/detetive-f.webp',
 bgi:'img/q1/bg-tijuca.webp',eug:'img/q1/eugenia.webp',retEug:'img/q1/ret-eugenia.webp',borb:'img/q1/borboleta.webp'};
const OPCIONAL=['hq2','hq3','amigos','caixao','padre'];
const IMG={};
Object.assign(SRC,{dPed:'img/q1/d/pedra.webp'});
const SH={det:{w:269,h:232,s:.47},bras:{w:137,h:340,s:.37},hipo:{w:303,h:230,s:.6},eug:{w:179,h:340,s:.37},borb:{w:507,h:340,s:.2}};
function loadAll(cb){
  const keys=Object.keys(SRC);let n=0;
  keys.forEach(k=>{const im=new Image();im.onload=()=>{IMG[k]=im;if(++n===keys.length)cb()};im.onerror=()=>{if(++n===keys.length)cb()};im.src=SRC[k]});
}
/* Arte final dos desafios (img/q1/d). dI: desenha o quadro f de uma tira (cw×ch) centrado em x,y. */
function dImg(k,f,cw,ch,x,y,w,h,rot,alpha,flip){const im=IMG[k];if(!im)return;ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.translate(x,y);if(rot)ctx.rotate(rot);if(flip)ctx.scale(-1,1);ctx.drawImage(im,f*cw,0,cw,ch,-w/2,-h/2,w,h);ctx.restore()}
function sheet(k,sh,f,x,y,flip,alpha,sc){
  const im=IMG[k];if(!im)return;const s=sh.s*(sc||1),w=sh.w*s,h=sh.h*s;
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.translate(x,y+3);if(flip)ctx.scale(-1,1);
  ctx.drawImage(im,f*sh.w,0,sh.w,sh.h,-w/2,-h,w,h);ctx.restore();
}
/* ===== Game feel: partículas (poeira, dash) ===== */
const PART=[];
function puff(x,y,n,k,col){for(let i=0;i<n;i++)PART.push({x:x+(Math.random()-.5)*14,y:y-2,vx:(Math.random()-.5)*90*(k||1),vy:-20-Math.random()*60*(k||1),t:0,l:.35+Math.random()*.3,r:2+Math.random()*3,c:col||'rgba(236,222,190,'})}
function updPart(dt){for(const p of PART){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt}for(let i=PART.length-1;i>=0;i--)if(PART[i].t>=PART[i].l)PART.splice(i,1)}
function drawPart(){ctx.save();ctx.translate(-camX,0);for(const p of PART){const a=1-p.t/p.l;ctx.fillStyle=p.c+(a*.6)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+p.t*1.5),0,7);ctx.fill()}ctx.restore()}
/* ============ Estado ============ */
let state='start',T=0,camX=0,shake=0,flash=0;
const S={nome:'',turma:'',gen:'m'};
const Z={pts:0,pages:0,lamps:3,leit:0,tot:4,enviou:false};
const F={cl:{},vered:false,des:false,ped:false,flor:false,borb:false,coxa:false,adeus:false,porta:false,poupou:false,gentil:false};
let borbs=[],borbT=3;
const K={left:0,right:0,jump:0,lamp:0,act:0};
const P={x:110,y:G,vx:0,vy:0,face:1,ground:true,jumps:2,inv:0,an:0,land:0,hurt:0};
let cpX=110,lastStep=0;
const PITS=[{x:700,w:110},{x:1250,w:130},{x:2300,w:140},{x:2900,w:120}];
const PLAT=[]; /* sem plataformas de caixa */
const PAGES=[[455,G-125,'o'],[595,G-175,'o'],[885,G-135,'c'],[1335,G-195,'c'],[1730,G-175,'o'],[2295,G-190,'c'],[2915,G-195,'o'],[3415,G-135,'o'],[250,G-40,'c'],[1600,G-40,'c'],[2650,G-40,'o']].map(a=>({x:a[0],y:a[1],k:a[2],got:false}));
let stamps=[],stampT=3,rain=[],bolt=0,boltT=8,hint=0,hipo={on:false,x:0,y:0,t:0},cine=null,paused=false,floaters=[],marks=[];
for(let i=0;i<240;i++)rain.push({x:Math.random()*CW*1.3,y:Math.random()*CH,v:520+Math.random()*320,l:10+Math.random()*14});
/* ============ Áudio ============ */
let AC=null,rainG=null,muted=false;
function audio(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=.5;
  rainG=AC.createGain();rainG.gain.value=muted?0:.012;s.connect(f).connect(rainG).connect(AC.destination);s.start();
}
function noiseBurst(dur,freq,vol){if(!AC||muted)return;const n=AC.sampleRate*dur,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=AC.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(AC.destination);s.start()}
function tone(fr,dur,vol,type){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=fr;g.gain.value=vol||.04;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+dur)}
const thunder=()=>noiseBurst(1.8,320,.5),thud=()=>noiseBurst(.4,200,.7),blip=v=>tone(180+v*40,.05,.025,'triangle');
function setMute(m){muted=m;if(rainG)rainG.gain.value=m?0:.012;$('bMute').textContent=m?'×':'♪'}
/* ============ Utilidades de UI ============ */
let toastT=0;
function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms||3200)}
const NARR={queda:['Até a Tijuca tem as suas ravinas, leitor.','Caí. A montanha que me perdoe.','Uma ravina é só um capítulo mais fundo.'],
 carimbo:['A borboleta bateu asas; o Carimbo bate com mais força.','O Carimbo riscou o leitor. Que falta de educação com quem lê.','Rasurado! Foi o que ele pensou. Uma borboleta teria sido mais gentil.'],
 pag:['Uma florzinha da moita. Há quem as chame de erva daninha.','Flor guardada. Tijuca nunca soube ser só cenário.']};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function addPts(n,x,y){Z.pts+=n;floaters.push({x,y,t:0,s:'+'+n});hud()}
const NP=6;
function hud(){
  let l='';for(let i=0;i<3;i++)l+='<span class="lamp'+(i<Z.lamps?'':' off')+'"></span>';$('hLamp').innerHTML='Lamparinas '+l;
  $('hPag').textContent=Z.pages+'/11';$('hPts').textContent=Z.pts;
  $('hTask').innerHTML='Provas <b>'+provas()+'/'+NP+'</b>';
}
/* ============ Diálogo ============ */
let dq=null,dI=0,typing=null,dFull='';
function say(lines){return new Promise(res=>{
  const prev=state;state='dialog';dq={lines,i:0,res,prev};$('dlg').classList.remove('hidden');$('prompt').classList.add('hidden');next();});}
const WHO={eug:['Eugênia','retEug'],eus:['Dona Eusébia',null],bras:['Brás Cubas','retBras'],det:['Detetive',null],narr:['Narrador (o defunto)','retBras'],prud:['Prudêncio (menino)','retPrud'],quincas:['Quincas Borba','retQuincas'],ludg:['Mestre Ludgero',null]};
function next(){
  if(typing&&dI<dFull.length){dI=dFull.length;$('dTxt').textContent=dFull;clearInterval(typing);typing=null;return}
  if(dq.i>=dq.lines.length){$('dlg').classList.add('hidden');state=dq.prev==='dialog'?'play':dq.prev;const r=dq.res;dq=null;r();return}
  const [w,t]=dq.lines[dq.i++];const info=WHO[w];$('dNome').textContent=w==='det'?(S.nome||'Detetive'):info[0];
  const ik=w==='det'?(S.gen==='f'?'retDetF':'retDet'):info[1];if(ik){$('dImg').src=SRC[ik];$('dImg').style.display=''}else $('dImg').style.display='none';
  dFull=t;dI=0;$('dTxt').textContent='';clearInterval(typing);
  typing=setInterval(()=>{dI++;$('dTxt').textContent=dFull.slice(0,dI);if(dI%2===0)blip(w==='det'?1:3);if(dI>=dFull.length){clearInterval(typing);typing=null}},24);
}
/* ============ Modais ============ */
function ov(html){const o=$('ov');o.innerHTML='<div class="panel">'+html+'</div>';o.classList.remove('hidden')}
function ovClose(){$('ov').classList.add('hidden');$('ov').innerHTML=''}
function leitura(cfg){
  return new Promise(res=>{
    const prev=state;state='modal';const words=cfg.cita.split(/\s+/).length,secs=Math.max(8,Math.ceil(words/5));
    ov('<h2>'+cfg.titulo+'</h2><p>Leia com calma. A pergunta aparece quando o tempo acabar.</p><div class="cita">'+cfg.cita+'</div><div class="src">'+cfg.fonte+'</div><div class="bar"><i id="lb"></i></div><div id="lq"></div>');
    const b=$('lb');let t0=performance.now();const iv=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/(secs*1000));b.style.width=(p*100)+'%';if(p>=1){clearInterval(iv);perg()}},100);
    function perg(){
      const q=cfg.q;let h='<p><b>'+q.t+'</b></p>';q.o.forEach((o,i)=>h+='<button class="opt" data-i="'+i+'">'+o+'</button>');$('lq').innerHTML=h;
      let tries=0;$('lq').querySelectorAll('.opt').forEach(bt=>bt.onclick=()=>{
        const i=+bt.dataset.i;if(i===q.k){bt.classList.add('ok');$('lq').querySelectorAll('.opt').forEach(x=>x.disabled=true);
          $('lq').insertAdjacentHTML('beforeend','<p>'+q.e+'</p><button class="btn" id="lok">Continuar</button>');
          const first=tries===0;if(cfg.re){addPts(30,P.x-camX,P.y-120)}else if(first){Z.leit++;addPts(100,P.x-camX,P.y-120)}else addPts(40,P.x-camX,P.y-120);
          $('lok').onclick=()=>{ovClose();state=prev;res(first)}}
        else{tries++;bt.classList.add('bad');bt.disabled=true;blip(-3);toast('Releia o trecho e tente de novo.',1800)}});
    }
  });
}
function restaurarFrase(){
  return new Promise(res=>{
    const prev=state;state='modal';
    const frag=['Bem-aventurados os que não descem,','porque deles é','o primeiro beijo das damas.'];
    let ordem=frag.map((t,i)=>({t,i})).sort(()=>Math.random()-.5),prox=0,erros=0;
    ov('<h2>A página do capítulo 33</h2><p>O Carimbo rasgou o "versículo" que Brás acrescentou ao Evangelho, em três pedaços. Toque nos pedaços na ordem certa.</p><div class="card" id="dd" style="min-height:5em"><small>CAPÍTULO XXXIII</small><span id="ddt"></span></div><div id="fr"></div>');

  ov('<h2>O Caso dos Narradores Trocados</h2><p><b>Fase 1 · Zona 5: A flor da moita</b> (Memórias Póstumas de Brás Cubas, Machado de Assis).</p><p>A Tijuca, uma chácara, uma borboleta preta e Eugênia. O Agente Carimbo rasgou os capítulos da flor da moita. Desvie das borboletas, colha as flores e entenda o que Brás pensou (e fez) diante de Eugênia.</p>'+
   '<p>Seu primeiro nome ou apelido:</p><input type="text" id="iN" maxlength="16" placeholder="Nome"><input type="text" id="iT" maxlength="12" placeholder="Turma (ex.: 3º A)"><p>Detetive:</p><div class="gpick"><button id="gM" class="on">Ele</button><button id="gF">Ela</button></div>'+
   '<p style="font-size:.85em;color:var(--muted)">Setas ou A/D: andar · Espaço: pular (duplo) · Shift: dash · C: lamparina · E: ação · Esc: pausa. No celular, use os botões na tela.</p><button class="btn" id="go">Começar</button><button class="btn sec" id="back">Voltar ao Arquivo</button>');
  $('gM').onclick=()=>{S.gen='m';$('gM').classList.add('on');$('gF').classList.remove('on')};$('gF').onclick=()=>{S.gen='f';$('gF').classList.add('on');$('gM').classList.remove('on')};
  $('back').onclick=()=>{location.href='../index.html'};

  if(window.__restored){$('go').insertAdjacentHTML('afterend','<button class="btn sec" id="zero">Recomeçar do início</button>');$('zero').onclick=()=>{try{localStorage.removeItem(PROGKEY)}catch(e){}location.reload()}}
}



function comecar(){
  ovClose();state='play';$('hud').classList.remove('hidden');hud();
  say([['narr','Subi à Tijuca para descansar, leitor, e foi ali que conheci Eugênia, a flor da moita. Procure a página rasgada com a lamparina (segure C): ela também espanta as borboletas pretas. Colha as flores, leia, converse. Depois, a trilha para o Rio.']]);
}
function fim(){try{localStorage.removeItem(PROGKEY)}catch(e){}
  state='end';$('hud').classList.add('hidden');
  const pct=Math.round((Z.leit/Z.tot)*100);
  try{const o=JSON.parse(localStorage.getItem(SAVE)||'{}');o.zonas=o.zonas||{};o.found=o.found||{};o.done=o.done||[];
    if(!o.zonas[5]||o.zonas[5]<Z.pts)o.zonas[5]=Z.pts;o.found.z5=1;o.score=Object.values(o.zonas).reduce((a,b)=>a+b,0);localStorage.setItem(SAVE,JSON.stringify(o))}catch(e){}
  enviar(pct);
  ov('<h2>Zona 5 concluída: A flor da moita</h2><p>Pontos: <b>'+Z.pts+'</b> · Flores: <b>'+Z.pages+'/11</b> · Leituras certas de primeira: <b>'+Z.leit+'/'+Z.tot+'</b></p>'+
   '<p>Você viu Brás zombar da "superstição" das duas mulheres e depois matar uma borboleta preta com uma toalha, tratar a deficiência de Eugênia como um "enigma" da natureza e fugir do "ridículo de casar" com ela.'+(F.gentil?' Diante de Eugênia, você tratou a deficiência com naturalidade, ao contrário de Brás.':'')+(F.poupou?' E poupou a borboleta.':'')+'</p>'+
   '<p>Eugênia é a personagem mais digna da cena: ela entende tudo e diz "faz bem". O preconceito está no narrador e na sociedade dele, não nela.</p>'+
   '<p><b>Próxima zona: Virgília e a casinha da Gamboa.</b> Em construção.</p><button class="btn" id="ba">Voltar ao Arquivo</button><button class="btn sec" id="rj">Jogar de novo</button>');
  $('ba').onclick=()=>{location.href='../index.html'};$('rj').onclick=()=>location.reload(); if(window.Trans)Trans.fim();
}
function enviar(pct){
  if(Z.enviou)return;Z.enviou=true;
  try{if(typeof SHEETS_URL==='undefined'||!SHEETS_URL)return;
    fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({atividade:'Caso 2 · Fase 1 · Zona 5 · A flor da moita',nome:S.nome,turma:S.turma,acertos:Z.leit,total:Z.tot,pct:pct,abertas:'Pontos: '+Z.pts+' · Flores: '+Z.pages+'/11'})}).catch(()=>{});}catch(e){}
}
/* ============ Gravura sépia (estilo visual unificado) ============ */
const SEP={d:'#1c1007',m:'#4a3017',b:'#7a5530',l:'#b88c52',p:'#e6d2a6'};
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function hatch(x,y,w,h,ang,gap,col,a,lw){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.strokeStyle=col;ctx.globalAlpha=a;ctx.lineWidth=lw||1;ctx.beginPath();const d=Math.max(w,h)*1.5,ca=Math.cos(ang),sa=Math.sin(ang);for(let t=-d;t<d;t+=gap){const cx=x+w/2-sa*t,cy=y+h/2+ca*t;ctx.moveTo(cx-ca*d,cy-sa*d);ctx.lineTo(cx+ca*d,cy+sa*d)}ctx.stroke();ctx.restore()}
function stoneP(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y)}
function groundSegs(x0,x1){const s=[];let cur=x0;for(const p of PITS.slice().sort((a,b)=>a.x-b.x)){if(p.x>cur)s.push([cur,Math.min(p.x,x1)]);cur=Math.max(cur,p.x+p.w)}if(cur<x1)s.push([cur,x1]);return s.filter(a=>a[1]>a[0])}

    for(let r=0;r<4;r++){const y=G+4+r*17,off=(r%2)*29,sw=58;
      for(let sx=Math.floor((a-off)/sw)*sw+off;sx<b;sx+=sw){const id=Math.round(sx/sw)+r*977,w=sw-4-rnd(id)*6;

        ctx.strokeStyle='rgba(255,230,170,.28)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx+8,y+3);ctx.lineTo(sx+w-8,y+3);ctx.stroke()}}

    ctx.strokeStyle=SEP.d;ctx.lineWidth=1.3;ctx.beginPath();for(let x=Math.floor(a/18)*18;x<b;x+=18){if(x<a)continue;const j=rnd(x)*5;ctx.moveTo(x,G-4);ctx.lineTo(x+1.5,G-6-j)}ctx.stroke()}

    hatch(p.x,G,p.w,CH-G,1.15,6,'#5a3d1d',.35,1);
    ctx.fillStyle='#6a4824';ctx.fillRect(p.x-6,G,6,CH-G);ctx.fillRect(p.x+p.w,G,6,CH-G);ctx.fillStyle='#caa468';ctx.fillRect(p.x-6,G-3,6,4);ctx.fillRect(p.x+p.w,G-3,6,4);
    ctx.strokeStyle=SEP.d;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,G-3);ctx.lineTo(p.x,CH);ctx.moveTo(p.x+p.w,G-3);ctx.lineTo(p.x+p.w,CH);ctx.stroke()}
  ctx.restore();
}
function drawCrate(p){

  ctx.strokeStyle='rgba(28,16,7,.35)';ctx.lineWidth=1;

  ctx.strokeStyle='rgba(60,40,20,.55)';ctx.lineWidth=1.8;ctx.lineCap='round';for(let i=0;i<3;i++){ctx.beginPath();const y0=G-62-((T*26+i*26)%70);ctx.moveTo(tx+Math.sin(T*2+i)*14-4,y0);ctx.bezierCurveTo(tx+Math.sin(T*2+i)*14+10,y0-8,tx+Math.sin(T*2+i)*14-10,y0-16,tx+Math.sin(T*2+i)*14+3,y0-26);ctx.globalAlpha=Math.max(0,1-((T*26+i*26)%70)/70);ctx.stroke();ctx.globalAlpha=1}
  ctx.lineCap='butt';

function drawEspadim(ex){

/* ============ DESAFIO ORIGINAL DA ZONA (agilidade) ============ */
const DCFG={"m": "roll", "x0": 1480, "act": "Subir a ladeira da Tijuca", "title": "A LADEIRA DA TIJUCA", "tip": "Pedras rolam ladeira abaixo. Pule por cima! As que quicam exigem tempo: espere o salto delas.", "intro": "A Tijuca é toda ladeira, leitor, e a flor da moita ficou lá em cima. Suba até o fim e pule as pedras que descem rolando; algumas quicam.", "win": [["bras", "Subi a ladeira inteira sem torcer o pé. Já a flor da moita, leitor, essa me torceu bem mais, e por razões que não vêm ao caso."]]};
const DES={on:false,t:0,x0:DCFG.x0,x1:DCFG.x0+900,list:[],pits:null,cp:0,ex:0,got:0,n:0};
(function nudge(){const bad=x=>PITS.some(p=>x>p.x-70&&x<p.x+p.w+70)||(typeof RAS_BOARDS!=='undefined'&&RAS_BOARDS.some(b=>Math.abs(b.x-x)<170))||INTER.some(n=>Math.abs(n.x-x)<n.r+60);
  let x=DES.x0,k=0;while(bad(x)&&k<60){x+=40;k++}DES.x0=x;DES.x1=x+900})();
INTER.push({id:'des',x:DES.x0,r:80,txt:'AÇÃO · '+DCFG.act,cond:()=>!DES.on,done:()=>F.des,act:()=>startDes()});
const dRand=(a,b)=>a+Math.random()*(b-a);
async function startDes(){
  await say([[DCFG.who||'bras',DCFG.intro]]);
  DES.on=true;DES.t=0;DES.list=[];DES.ex=0;DES.got=0;DES.n=0;DES.sp=1.2;DES.pits=PITS.splice(0);DES.cp=cpX;cpX=DES.x0+30;
  P.x=DES.x0+40;P.y=G;P.vy=0;P.vx=0;P.inv=1;camX=Math.max(0,Math.min(WW-CW,P.x-CW*.3));
  MECH.init&&MECH.init();toast(DCFG.tip,5200);
}
function endDes(win){
  DES.on=false;DES.list=[];PITS.push(...DES.pits);DES.pits=null;cpX=DES.cp;P.x=DES.x0;P.y=G;P.vy=0;P.vx=0;P.inv=1.5;camX=Math.max(0,Math.min(WW-CW,P.x-CW*.3));
  if(!win)return;
  F.des=true;addPts(350,CW/2,200);if(Z.lamps<3)Z.lamps++;hud();tone(660,.12,.05,'triangle');tone(990,.16,.04,'triangle');
  say(DCFG.win).then(()=>toast('Desafio vencido! Provas '+provas()+'/'+(typeof NP!=='undefined'?NP:5),3500));
}
function updDes(dt){
  if(!DES.on||state!=='play')return;
  DES.t+=dt;P.x=Math.max(DES.x0+15,Math.min(DES.x1-15,P.x));
  if(MECH.upd(dt)===true)endDes(true);
}
const dpx=()=>P.x,dpy=()=>P.y-44;
function dInCam(x,m){return x>camX-(m||60)&&x<camX+CW+(m||60)}
/* ---- marcos de início e fim ---- */
function dPost(x,col){ctx.fillStyle=SEP.m;ctx.fillRect(x-4,G-120,8,120);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x+4,G-120);ctx.lineTo(x+46,G-104);ctx.lineTo(x+4,G-88);ctx.closePath();ctx.fill();ctx.strokeStyle=SEP.d;ctx.lineWidth=2;ctx.strokeRect(x-4,G-120,8,120)}
function drawDes(){
  if(!DES.on)return;ctx.save();ctx.translate(-camX,0);
  dPost(DES.x0,'#6a4824');if(MECH.goal)dPost(DES.x1,'#b3541c');
  MECH.draw();ctx.restore();
  /* faixa de título */
  ctx.save();ctx.fillStyle='rgba(20,12,6,.78)';ctx.fillRect(CW/2-330,124,660,40);ctx.strokeStyle='#9a7545';ctx.lineWidth=2;ctx.strokeRect(CW/2-330,124,660,40);
  ctx.fillStyle='#e6d2a6';ctx.font='15px "Special Elite",monospace';ctx.textAlign='center';ctx.fillText(DCFG.title,CW/2,142);
  ctx.fillStyle='#caa468';ctx.font='13px "Special Elite",monospace';ctx.fillText(MECH.hud(),CW/2,158);ctx.restore();
}
const dProg=()=>Math.max(0,Math.min(1,(P.x-DES.x0)/(DES.x1-DES.x0)));
const MECH={};

MECH.goal=true;MECH.hud=()=>'Suba a ladeira · pule as pedras que rolam (as quicantes exigem tempo)';
