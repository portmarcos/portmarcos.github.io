<script>
"use strict";
/* ============ Constantes ============ */
const CW=960,CH=540,G=480,WW=3700;
const DPR=Math.min(window.devicePixelRatio||1,1.5);
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');cv.width=CW*DPR;cv.height=CH*DPR;
const $=id=>document.getElementById(id);
const SAVE='caso_realismo_v1';
const SRC={det:'../caso-originais/img/q1/detetive.webp',detF:'../caso-originais/img/q1/detetive-f.webp',bras:'img/q1/bras.webp',hipo:'img/q1/hipopotamo.webp',
 bg:'img/q1/bg-velorio.webp',bgd:'img/q1/bg-delirio.webp',retBras:'img/q1/ret-bras.webp',retDet:'../caso-originais/img/detetive.webp',retDetF:'../caso-originais/img/detetive-f.webp',
 bgi:'img/q1/bg-infancia.webp',prud:'img/q1/prudencio.webp',retPrud:'img/q1/ret-prud-menino.webp',retQuincas:'img/q1/ret-quincas.webp',eul:'img/q1/eulalia.webp',ludg:'img/q1/ludgero-retrato.webp',ludgA:'img/q1/ludgero.webp',
 z_lp:'img/q1/z2/ludgero-poses.webp',z_dl:'img/q1/z2/det-luta.webp',z_dlf:'img/q1/z2/detf-luta.webp',z_bar:'img/q1/z2/barata.webp',z_men:'img/q1/z2/menino.webp',z_mesa:'img/q1/z2/mesa.webp',z_lousa:'img/q1/z2/lousa.webp',z_tacho:'img/q1/z2/tacho.webp',z_esp:'img/q1/z2/espadim.webp',z_p0:'img/q1/z2/porta-fechada.webp',z_p1:'img/q1/z2/porta-aberta.webp',z_cxb:'img/q1/z2/cx-baixa.webp',z_cxm:'img/q1/z2/cx-media.webp',z_cxa:'img/q1/z2/cx-alta.webp',z_bar2:'img/q1/z2/barril.webp',z_chao:'img/q1/z2/chao.webp',z_palm:'img/q1/z2/palm-a.webp',z_giz:'img/q1/z2/giz.webp',z_gizq:'img/q1/z2/giz-quebrado.webp',z_pena:'img/q1/z2/pena.webp'};
const OPCIONAL=['hq2','hq3','amigos','caixao','padre'];
const IMG={};
const Z2S={lp:{w:267,h:413,n:10},dl:{w:225,h:386,n:12},dlf:{w:196,h:400,n:12},bar:{w:378,h:322,n:6},men:{w:563,h:507,n:6}};
const SH={det:{w:269,h:232,s:.47},bras:{w:137,h:340,s:.37},hipo:{w:303,h:230,s:.6},prud:{w:164,h:340,s:.5}};
function loadAll(cb){
  const keys=Object.keys(SRC);let n=0;
  keys.forEach(k=>{const im=new Image();im.onload=()=>{IMG[k]=im;if(++n===keys.length)cb()};im.onerror=()=>{if(++n===keys.length)cb()};im.src=SRC[k]});
}
function sheet(k,sh,f,x,y,flip,alpha,sc){
  const im=IMG[k];if(!im)return;const s=sh.s*(sc||1),w=sh.w*s,h=sh.h*s;
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.translate(x,y+3);if(flip)ctx.scale(-1,1);
  ctx.drawImage(im,f*sh.w,0,sh.w,sh.h,-w/2,-h,w,h);ctx.restore();
}
/* ===== Game feel: partículas (poeira, dash) ===== */
const PART=[];
function puff(x,y,n,k,col){for(let i=0;i<n;i++)PART.push({x:x+(Math.random()-.5)*14,y:y-2,vx:(Math.random()-.5)*90*(k||1),vy:-20-Math.random()*60*(k||1),t:0,l:.35+Math.random()*.3,r:2+Math.random()*3,c:col||'rgba(236,222,190,'})}
function updPart(dt){for(const p of PART){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt}for(let i=PART.length-1;i>=0;i--)if(PART[i].t>=PART[i].l)PART.splice(i,1)}
function drawPart(){ctx.save();ctx.translate(-camX,0);for(const p of PART){const a=1-p.t/p.l;ctx.fillStyle=p.c+(a*.6)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+p.t*1.5),0,7);ctx.fill()}ctx.restore()}
/* ============ Estado ============ */
let state='start',T=0,camX=0,shake=0,flash=0;
const S={nome:'',turma:'',gen:'m'};
const Z={pts:0,pages:0,lamps:3,leit:0,tot:4,enviou:false};
const F={cl:{},vered:false,ped:false,tacho:false,cavalo:false,espadim:false,escola:false,porta:false,solto:false,b0:false,b1:false,b2:false,b3:false,gaveta:false};
const K={left:0,right:0,jump:0,lamp:0,act:0};
const P={x:110,y:G,vx:0,vy:0,face:1,ground:true,jumps:2,inv:0,an:0,land:0,hurt:0};
let cpX=110,lastStep=0;
const PITS=[{x:700,w:110},{x:1250,w:130},{x:2300,w:140},{x:2900,w:120}];
const PLAT=[{x:420,y:G-60,w:70},{x:560,y:G-110,w:70},{x:850,y:G-70,w:64},{x:1180,y:G-80,w:70},{x:1300,y:G-130,w:70},{x:1500,y:G-70,w:64},{x:1700,y:G-110,w:70},
 {x:2140,y:G-70,w:64},{x:2260,y:G-125,w:70},{x:2420,y:G-70,w:64},{x:2760,y:G-80,w:64},{x:2880,y:G-130,w:70},{x:3040,y:G-70,w:64},{x:3130,y:G-70,w:64}];
const PAGES=[[455,G-125],[595,G-175],[885,G-135],[1335,G-195],[1730,G-175],[2295,G-190],[2915,G-195],[3162,G-135]].map(a=>({x:a[0],y:a[1],got:false}));
let stamps=[],stampT=3,rain=[],bolt=0,boltT=8,hint=0,hipo={on:false,x:0,y:0,t:0},cine=null,paused=false,floaters=[],marks=[];
for(let i=0;i<240;i++)rain.push({x:Math.random()*CW*1.3,y:Math.random()*CH,v:520+Math.random()*320,l:10+Math.random()*14});
/* ============ Áudio ============ */
let AC=null,rainG=null,muted=false;
function audio(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=.5;
  rainG=AC.createGain();rainG.gain.value=muted?0:.012;s.connect(f).connect(rainG).connect(AC.destination);s.start();
}
function noiseBurst(dur,freq,vol){if(!AC||muted)return;const n=AC.sampleRate*dur,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=AC.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(AC.destination);s.start()}
function tone(fr,dur,vol,type){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=fr;g.gain.value=vol||.04;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+dur)}
const thunder=()=>noiseBurst(1.8,320,.5),thud=()=>noiseBurst(.4,200,.7),blip=v=>tone(180+v*40,.05,.025,'triangle');
function setMute(m){muted=m;if(rainG)rainG.gain.value=m?0:.012;$('bMute').textContent=m?'×':'♪'}
/* ============ Utilidades de UI ============ */
let toastT=0;
function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms||3200)}
const NARR={queda:['Cresci como crescem os gatos: caindo de pé, quase sempre.','Caí. Menino-diabo também tropeça, leitor.','Um buraco no quintal é só um capítulo mais fundo.'],
 carimbo:['Ai! Quem dá palmada é o mestre; quem dá susto é a barata.','Rasurado! Foi o que o Carimbo pensou. A palmatória do mestre era mais discreta.','Menino-diabo também leva pancada, leitor. E levanta rindo.'],
 pag:['Uma página a mais. Há quem colecione selos; o leitor coleciona capítulos.','Página recolhida. O verme agradece a ordem.']};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function addPts(n,x,y){Z.pts+=n;floaters.push({x,y,t:0,s:'+'+n});hud()}
const NP=5;
function hud(){
  let l='';for(let i=0;i<3;i++)l+='<span class="lamp'+(i<Z.lamps?'':' off')+'"></span>';$('hLamp').innerHTML='Lamparinas '+l;
  $('hPag').textContent=Z.pages+'/8';$('hPts').textContent=Z.pts;
  $('hTask').innerHTML='Provas <b>'+provas()+'/'+NP+'</b>';
}
/* ============ Diálogo ============ */
let dq=null,dI=0,typing=null,dFull='';
function say(lines){return new Promise(res=>{
  const prev=state;state='dialog';dq={lines,i:0,res,prev};$('dlg').classList.remove('hidden');$('prompt').classList.add('hidden');next();});}
const WHO={bras:['Brás Cubas','retBras'],det:['Detetive',null],narr:['Narrador (o defunto)','retBras'],prud:['Prudêncio (menino)','retPrud'],quincas:['Quincas Borba','retQuincas'],ludg:['Mestre Ludgero','ludg']};
function next(){
  if(typing&&dI<dFull.length){dI=dFull.length;$('dTxt').textContent=dFull;clearInterval(typing);typing=null;return}
  if(dq.i>=dq.lines.length){$('dlg').classList.add('hidden');state=dq.prev==='dialog'?'play':dq.prev;const r=dq.res;dq=null;r();return}
  const [w,t]=dq.lines[dq.i++];const info=WHO[w];$('dNome').textContent=w==='det'?(S.nome||'Detetive'):info[0];
  const ik=w==='det'?(S.gen==='f'?'retDetF':'retDet'):info[1];if(ik){$('dImg').src=SRC[ik];$('dImg').style.display=''}else $('dImg').style.display='none';
  dFull=t;dI=0;$('dTxt').textContent='';clearInterval(typing);
  typing=setInterval(()=>{dI++;$('dTxt').textContent=dFull.slice(0,dI);if(dI%2===0)blip(w==='det'?1:3);if(dI>=dFull.length){clearInterval(typing);typing=null}},24);
}
/* ============ Modais ============ */
function ov(html){const o=$('ov');o.innerHTML='<div class="panel">'+html+'</div>';o.classList.remove('hidden')}
function ovClose(){$('ov').classList.add('hidden');$('ov').innerHTML=''}
function leitura(cfg){
  return new Promise(res=>{
    const prev=state;state='modal';const words=cfg.cita.split(/\s+/).length,secs=Math.max(8,Math.ceil(words/5));
    ov('<h2>'+cfg.titulo+'</h2><p>Leia com calma. A pergunta aparece quando o tempo acabar.</p><div class="cita">'+cfg.cita+'</div><div class="src">'+cfg.fonte+'</div><div class="bar"><i id="lb"></i></div><div id="lq"></div>');
    const b=$('lb');let t0=performance.now();const iv=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/(secs*1000));b.style.width=(p*100)+'%';if(p>=1){clearInterval(iv);perg()}},100);
    function perg(){
      const q=cfg.q;let h='<p><b>'+q.t+'</b></p>';q.o.forEach((o,i)=>h+='<button class="opt" data-i="'+i+'">'+o+'</button>');$('lq').innerHTML=h;
      let tries=0;$('lq').querySelectorAll('.opt').forEach(bt=>bt.onclick=()=>{

   '<p>Seu primeiro nome ou apelido:</p><input type="text" id="iN" maxlength="16" placeholder="Nome"><input type="text" id="iT" maxlength="12" placeholder="Turma (ex.: 3º A)"><p>Detetive:</p><div class="gpick"><button id="gM" class="on">Ele</button><button id="gF">Ela</button></div>'+
   '<p style="font-size:.85em;color:var(--muted)">Setas ou A/D: andar · Espaço: pular (duplo) · Shift: dash · C: lamparina · E: ação · Esc: pausa. No celular, use os botões na tela.</p><button class="btn" id="go">Começar</button><button class="btn sec" id="back">Voltar ao Arquivo</button>');
  $('gM').onclick=()=>{S.gen='m';$('gM').classList.add('on');$('gF').classList.remove('on')};$('gF').onclick=()=>{S.gen='f';$('gF').classList.add('on');$('gM').classList.remove('on')};

  if(window.__restored){$('go').insertAdjacentHTML('afterend','<button class="btn sec" id="zero">Recomeçar do início</button>');$('zero').onclick=()=>{try{localStorage.removeItem(PROGKEY)}catch(e){}location.reload()}}
}



function comecar(){
  ovClose();state='play';$('hud').classList.remove('hidden');hud();
  say([['narr','Cresci como crescem as magnólias e os gatos, leitor, e talvez com menos juízo. Procure a página rasgada com a lamparina (segure C), olhe o tacho, converse com Prudêncio e leia o que fiz. Depois, dê o salto.']]);
}
function fim(){try{localStorage.removeItem(PROGKEY)}catch(e){}
  state='end';$('hud').classList.add('hidden');
  const pct=Math.round((Z.leit/Z.tot)*100);
  try{const o=JSON.parse(localStorage.getItem(SAVE)||'{}');o.zonas=o.zonas||{};o.found=o.found||{};o.done=o.done||[];
    if(!o.zonas[2]||o.zonas[2]<Z.pts)o.zonas[2]=Z.pts;o.found.z2=1;o.score=Object.values(o.zonas).reduce((a,b)=>a+b,0);localStorage.setItem(SAVE,JSON.stringify(o))}catch(e){}
  enviar(pct);
  ov('<h2>Zona 2 concluída: O menino é pai do homem</h2><p>Pontos: <b>'+Z.pts+'</b> · Páginas recolhidas: <b>'+Z.pages+'/8</b> · Leituras certas de primeira: <b>'+Z.leit+'/'+Z.tot+'</b></p>'+
   '<p>Você restaurou o capítulo 11, viu como Brás narra a crueldade sem remorso e entendeu o "espadim": o interesse pessoal que pesa mais que a história do mundo.'+(F.solto?' E soltou o cordel de Prudêncio, algo que o livro não faz.':'')+(F.gaveta?' Resolveu o mistério da gaveta por dedução: duas declarações contraditórias não podem ser falsas ao mesmo tempo.':'')+'</p>'+
   '<p><b>Próxima zona: Marcela e as moedas (o primeiro amor).</b> Em construção.</p><button class="btn" id="ba">Voltar ao Arquivo</button><button class="btn sec" id="rj">Jogar de novo</button>');
  $('ba').onclick=()=>{location.href='../index.html'};$('rj').onclick=()=>location.reload(); if(window.Trans)Trans.fim();
}
function enviar(pct){
  if(Z.enviou)return;Z.enviou=true;
  try{if(typeof SHEETS_URL==='undefined'||!SHEETS_URL)return;
    fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({atividade:'Caso 2 · Fase 1 · Zona 2 · O menino é pai do homem',nome:S.nome,turma:S.turma,acertos:Z.leit,total:Z.tot,pct:pct,abertas:'Pontos: '+Z.pts+' · Páginas: '+Z.pages+'/8'})}).catch(()=>{});}catch(e){}
}

        if(!certo){sel.clear();CASO_CFG.certas.forEach(k=>sel.add(k))}
        const pts=certo?Math.max(100,400-erros*100):100;
        ov('<h2>Caso fechado</h2><p>'+(certo?'Provas certas. ':'Era esta a combinação. ')+CASO_CFG.fecho+'</p><p style="font-size:.85em;opacity:.8">'+CASO_CFG.nota+'</p><button class="btn" id="vok">Continuar (+'+pts+')</button>');
        $('vok').onclick=()=>{ovClose();state=prev;F.vered=true;addPts(pts,CW/2,200);toast('Caso fechado! +'+pts+' pontos',3200);res()};return}
      erros++;sel.clear();
      draw('Ainda não. '+CASO_CFG.dicas[Math.min(erros-1,1)]);
    };
  };
  draw('');
})}
/* ============ Entrada ============ */
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyC:'lamp',ShiftLeft:'dash',ShiftRight:'dash',KeyK:'dash',KeyX:'atk',KeyF:'atk',KeyE:'act',Enter:'act'};
addEventListener('keydown',e=>{
  const k=KM[e.code];
  if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')pause(true);else if(paused)pause(false);return}
  if(e.code==='KeyM'){setMute(!muted);return}
  if(e.code==='KeyN'){caderno();return}
  if(state==='dialog'&&(e.code==='Space'||e.code==='Enter'||e.code==='KeyE')){e.preventDefault();next();return}
  if(!k)return;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
  if(k==='act'){if(!K.act&&state==='play')doAct();K.act=1;return}K[k]=1;
});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)K[k]=0});
function doAct(){const it=nearInter();if(it)it.act()}
function pause(on){paused=on;if(on){state='pause';ov('<h2>Pausa</h2><button class="btn" id="rs">Continuar</button><button class="btn sec" id="bk">Voltar ao Arquivo</button>');$('rs').onclick=()=>pause(false);$('bk').onclick=()=>location.href='../index.html'}else{ovClose();state='play'}}
$('bCad').onclick=()=>caderno();$('bPause').onclick=()=>{if(state==='play')pause(true)};$('bMute').onclick=()=>setMute(!muted);
$('dlg').addEventListener('pointerdown',e=>{e.preventDefault();if(state==='dialog')next()});
function bindT(id,k,act){const b=$(id);const on=e=>{e.preventDefault();if(act){if(state==='dialog'){next();return}if(state==='play')doAct()}else K[k]=1};const off=e=>{e.preventDefault();if(!act)K[k]=0};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)}
bindT('tL','left');bindT('tR','right');bindT('tJ','jump');bindT('tC','lamp');bindT('tS','dash');bindT('tX','atk');bindT('tA',null,true);
if('ontouchstart' in window||navigator.maxTouchPoints>0)document.body.classList.add('touch');
/* ============ Laço ============ */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;T+=dt;
  if(state==='play'){updatePlayer(dt);updateWorld(dt);
    camX+=(((duel.on?WW-CW:P.x-CW*.42+(P.look||0)*.6))-camX)*Math.min(1,dt*5);camX=Math.max(0,Math.min(WW-CW,camX));
    const it=nearInter();const pr=$('prompt');if(it){pr.textContent=it.txt;pr.classList.remove('hidden')}else pr.classList.add('hidden');
    if(K.lamp&&!K._l){K._l=1;}if(!K.lamp)K._l=0;
  }else if(state==='dialog'){updateWorld(dt);P.vx=0}
  render(dt);
}
window.__t={provaLeitura,caderno,veredito,CASO,duel,startDuel,PENS,ROACH,P,F,Z,PAGES,INTER,get state(){return state},set state(v){state=v},get camX(){return camX},set camX(v){camX=v},provas,startCine,fim,K};
(function restaurarProg(){try{const r=JSON.parse(localStorage.getItem(PROGKEY)||'null');if(!r||!(r.cp>0))return;
  cpX=r.cp;P.x=r.cp;camX=Math.max(0,Math.min(WW-CW,P.x-CW*.42+(P.look||0)*.6));Object.assign(Z,r.Z||{});Object.assign(F,r.F||{});
  (r.pg||[]).forEach((v,i)=>{if(v&&PAGES[i])PAGES[i].got=true});(r.rb||[]).forEach((v,i)=>{if(v&&RAS_BOARDS[i])RAS_BOARDS[i].done=true});
  if(typeof hipo!=='undefined'&&F.hipo){hipo.on=true;hipo.landed=true;hipo.x=3440;hipo.y=G-64}
  window.__restored=1}catch(e){}})();
loadAll(()=>{buildBust();requestAnimationFrame(loop);iniciar();hud()});
