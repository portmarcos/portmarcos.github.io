#dlg .x{font-size:clamp(.85rem,1.8vw,1.2rem);line-height:1.45}
#dlg .k{align-self:flex-end;font-size:.75rem;color:var(--muted);animation:bl 1s infinite}

.ov{position:absolute;inset:0;z-index:20;background:rgba(7,4,10,.93);display:flex;align-items:center;justify-content:center;padding:3%;overflow:auto}
.panel{background:linear-gradient(180deg,#201630,#150e20);border:2px solid #8b73bd;border-radius:16px;padding:clamp(12px,2.4vw,26px);max-width:min(860px,100%);width:100%;box-shadow:0 12px 50px #000}
.panel h2{font-family:'Playfair Display',serif;color:var(--amber2);font-size:clamp(1.1rem,2.8vw,1.8rem);margin-bottom:8px}
.panel p{line-height:1.5;margin:6px 0;font-size:clamp(.85rem,1.7vw,1.1rem)}
.cita{border-left:3px solid var(--amber);padding:8px 12px;margin:10px 0;font-style:italic;background:rgba(255,255,255,.04);font-size:clamp(.85rem,1.7vw,1.1rem);line-height:1.55}
.src{font-size:.78rem;color:var(--muted);margin-top:-4px}
.btn{background:linear-gradient(180deg,#e3a84a,#b0701f);color:#1a0f08;font-weight:700;border:none;border-radius:10px;padding:9px 18px;margin:6px 6px 0 0;font-size:clamp(.85rem,1.6vw,1.05rem)}
.btn.sec{background:#2b1f3d;color:var(--paper);border:1px solid #6b55a0}
.btn:disabled{opacity:.4;cursor:default}
.opt{display:block;width:100%;text-align:left;background:#2b1f3d;border:1px solid #6b55a0;border-radius:10px;padding:9px 12px;margin:7px 0;font-size:clamp(.82rem,1.6vw,1.05rem);line-height:1.4}
.opt:hover:not(:disabled){background:#3a2b52}

.bar{height:6px;background:#2b1f3d;border-radius:4px;overflow:hidden;margin:8px 0}

input[type=text]{width:100%;padding:9px 12px;border-radius:8px;border:1px solid #6b55a0;background:#120b1c;color:var(--paper);font:inherit;margin:4px 0 8px;-webkit-user-select:text;user-select:text}
.gpick{display:flex;gap:8px;margin:6px 0 10px}

/* abertura */
.card{position:relative;background:#e9dcc0;color:#2a1a10;border-radius:6px;padding:clamp(18px,4vw,48px);text-align:center;font-family:'Playfair Display',serif;font-weight:700;letter-spacing:.04em;line-height:1.7;box-shadow:inset 0 0 40px rgba(90,50,10,.35);font-size:clamp(.95rem,2.6vw,1.7rem)}
.card small{display:block;font-family:'Special Elite',monospace;font-size:.5em;letter-spacing:.1em;margin-bottom:10px;opacity:.7}
#scr{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.panelImg{width:100%;border-radius:8px;border:1px solid #5d4a7a}
/* touch */
#touch{position:absolute;inset:0;z-index:4;pointer-events:none}
#touch button{pointer-events:auto;position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,12,30,.55);color:#fff;font-size:1.3rem;width:clamp(48px,11vw,72px);height:clamp(48px,11vw,72px);touch-action:none}
#tL{left:2%;bottom:6%}#tR{left:calc(2% + clamp(56px,13vw,84px));bottom:6%}
#tJ{right:2%;bottom:6%}#tA{right:calc(2% + clamp(56px,13vw,84px));bottom:6%;font-size:.8rem}#tC{right:calc(2% + clamp(28px,6.5vw,42px));bottom:calc(6% + clamp(56px,13vw,84px))}
body:not(.touch) #touch{display:none}
#rot{position:fixed;inset:0;z-index:99;background:#07050a;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:1.2rem}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}

</div>

<div id="touch"><button id="tL">◀</button><button id="tR">▶</button><button id="tJ">PULO</button><button id="tA">AÇÃO</button><button id="tC">✦</button></div>

</div></div>

<script>
"use strict";
/* ============ Constantes ============ */
const CW=960,CH=540,G=480,WW=3800;
const DPR=Math.min(window.devicePixelRatio||1,1.5);
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');cv.width=CW*DPR;cv.height=CH*DPR;
const $=id=>document.getElementById(id);
const SAVE='caso_realismo_v1';
const SRC={det:'../caso-originais/img/q1/detetive.webp',detF:'../caso-originais/img/q1/detetive-f.webp',bras:'img/q1/bras.webp',hipo:'img/q1/hipopotamo.webp',
 bg:'img/q1/bg-velorio.webp',bgd:'img/q1/bg-delirio.webp',retBras:'img/q1/ret-bras.webp',retDet:'../caso-originais/img/detetive.webp',retDetF:'../caso-originais/img/detetive-f.webp',
 hq1:'img/q1/hq1.webp',hq2:'img/q1/hq2.webp',hq3:'img/q1/hq3.webp',amigos:'img/q1/amigos.webp',caixao:'img/q1/caixao.webp',padre:'img/q1/padre.webp'};
const OPCIONAL=['hq1','hq2','hq3','amigos','caixao','padre'];
const IMG={};
const SH={det:{w:269,h:232,s:.47},bras:{w:137,h:340,s:.37},hipo:{w:303,h:230,s:.6}};
function loadAll(cb){
  const keys=Object.keys(SRC);let n=0;
  keys.forEach(k=>{const im=new Image();im.onload=()=>{IMG[k]=im;if(++n===keys.length)cb()};im.onerror=()=>{if(++n===keys.length)cb()};im.src=SRC[k]});
}
function sheet(k,sh,f,x,y,flip,alpha,sc){
  const im=IMG[k];if(!im)return;const s=sh.s*(sc||1),w=sh.w*s,h=sh.h*s;
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.translate(x,y+3);if(flip)ctx.scale(-1,1);
  ctx.drawImage(im,f*sh.w,0,sh.w,sh.h,-w/2,-h,w,h);ctx.restore();
}
/* ============ Estado ============ */
let state='start',T=0,camX=0,shake=0,flash=0;
const S={nome:'',turma:'',gen:'m'};
const Z={pts:0,pages:0,lamps:3,leit:0,tot:3,enviou:false};
const F={ded:false,amigos:false,fala:false,disc:false,hipo:false};
const K={left:0,right:0,jump:0,lamp:0,act:0};
const P={x:110,y:G,vx:0,vy:0,face:1,ground:true,jumps:2,inv:0,an:0,land:0,hurt:0};
let cpX=110,lastStep=0;
const PITS=[{x:950,w:120},{x:1620,w:140},{x:2230,w:120}];
const PLAT=[ /* lápides: topo caminhável */
 {x:420,y:G-62,w:64},{x:560,y:G-108,w:64},{x:700,y:G-62,w:64},
 {x:880,y:G-70,w:60},{x:1010,y:G-130,w:70},{x:1130,y:G-70,w:60},
 {x:1380,y:G-66,w:70},{x:1560,y:G-120,w:60},{x:1700,y:G-120,w:60},{x:1830,y:G-66,w:64},
 {x:2000,y:G-76,w:64},{x:2160,y:G-130,w:60},{x:2300,y:G-76,w:60},
 {x:3300,y:G-70,w:70}];
const PAGES=[[300,G-120],[595,G-165],[1040,G-200],[1190,G-110],[1590,G-190],[1730,G-190],[2190,G-200],[3330,G-140]].map(a=>({x:a[0],y:a[1],got:false}));
let stamps=[],stampT=3,rain=[],bolt=0,boltT=8,hint=0,hipo={on:false,x:0,y:0,t:0},cine=null,paused=false,floaters=[],marks=[];
for(let i=0;i<240;i++)rain.push({x:Math.random()*CW*1.3,y:Math.random()*CH,v:520+Math.random()*320,l:10+Math.random()*14});
/* ============ Áudio ============ */
let AC=null,rainG=null,muted=false;
function audio(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=.5;
  rainG=AC.createGain();rainG.gain.value=muted?0:.07;s.connect(f).connect(rainG).connect(AC.destination);s.start();
}
function noiseBurst(dur,freq,vol){if(!AC||muted)return;const n=AC.sampleRate*dur,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=AC.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(AC.destination);s.start()}
function tone(fr,dur,vol,type){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=fr;g.gain.value=vol||.04;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+dur)}
const thunder=()=>noiseBurst(1.8,320,.5),thud=()=>noiseBurst(.4,200,.7),blip=v=>tone(180+v*40,.05,.025,'triangle');
function setMute(m){muted=m;if(rainG)rainG.gain.value=m?0:.07;$('bMute').textContent=m?'×':'♪'}
/* ============ Utilidades de UI ============ */
let toastT=0;
function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms||3200)}
const NARR={queda:['Caro leitor, até os defuntos tropeçam em covas abertas.','Caí. Com a prática, o leitor aprende a cair com dignidade.','Uma cova aberta é só uma página em branco muito funda.'],
 carimbo:['O Carimbo carimbou o leitor. Que falta de educação com quem lê.','Corrigido! Foi o que ele pensou. Eu, que fui corrigido pelo verme, discordo.'],
 pag:['Uma página a mais. Há quem colecione selos; o leitor coleciona capítulos.','Página recolhida. O verme agradece a ordem.']};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function addPts(n,x,y){Z.pts+=n;floaters.push({x,y,t:0,s:'+'+n});hud()}
function hud(){
  let l='';for(let i=0;i<3;i++)l+='<span class="lamp'+(i<Z.lamps?'':' off')+'"></span>';$('hLamp').innerHTML='Lamparinas '+l;
  $('hPag').textContent=Z.pages+'/8';$('hPts').textContent=Z.pts;
  const tasks=[F.ded,F.amigos,F.fala,F.disc].filter(Boolean).length;$('hTask').innerHTML='Provas <b>'+tasks+'/4</b>';
}
/* ============ Diálogo ============ */
let dq=null,dI=0,typing=null,dFull='';
function say(lines){return new Promise(res=>{
  const prev=state;state='dialog';dq={lines,i:0,res,prev};$('dlg').classList.remove('hidden');$('prompt').classList.add('hidden');next();});}
const WHO={bras:['Brás Cubas','retBras'],det:['Detetive',null],narr:['Narrador (o defunto)','retBras']};
function next(){
  if(typing&&dI<dFull.length){dI=dFull.length;$('dTxt').textContent=dFull;clearInterval(typing);typing=null;return}
  if(dq.i>=dq.lines.length){$('dlg').classList.add('hidden');state=dq.prev==='dialog'?'play':dq.prev;const r=dq.res;dq=null;r();return}
  const [w,t]=dq.lines[dq.i++];const info=WHO[w];$('dNome').textContent=w==='det'?(S.nome||'Detetive'):info[0];
  const ik=w==='det'?(S.gen==='f'?'retDetF':'retDet'):info[1];$('dImg').src=SRC[ik];
  dFull=t;dI=0;$('dTxt').textContent='';clearInterval(typing);
  typing=setInterval(()=>{dI++;$('dTxt').textContent=dFull.slice(0,dI);if(dI%2===0)blip(w==='det'?1:3);if(dI>=dFull.length){clearInterval(typing);typing=null}},24);
}
/* ============ Modais ============ */
function ov(html){const o=$('ov');o.innerHTML='<div class="panel">'+html+'</div>';o.classList.remove('hidden')}
function ovClose(){$('ov').classList.add('hidden');$('ov').innerHTML=''}
function leitura(cfg){
  return new Promise(res=>{
    const prev=state;state='modal';const words=cfg.cita.split(/\s+/).length,secs=Math.max(8,Math.ceil(words/5));
    ov('<h2>'+cfg.titulo+'</h2><p>Leia com calma. A pergunta aparece quando o tempo acabar.</p><div class="cita">'+cfg.cita+'</div><div class="src">'+cfg.fonte+'</div><div class="bar"><i id="lb"></i></div><div id="lq"></div>');
    const b=$('lb');let t0=performance.now();const iv=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/(secs*1000));b.style.width=(p*100)+'%';if(p>=1){clearInterval(iv);perg()}},100);
    function perg(){
      const q=cfg.q;let h='<p><b>'+q.t+'</b></p>';q.o.forEach((o,i)=>h+='<button class="opt" data-i="'+i+'">'+o+'</button>');$('lq').innerHTML=h;
      let tries=0;$('lq').querySelectorAll('.opt').forEach(bt=>bt.onclick=()=>{
        const i=+bt.dataset.i;if(i===q.k){bt.classList.add('ok');$('lq').querySelectorAll('.opt').forEach(x=>x.disabled=true);
          $('lq').insertAdjacentHTML('beforeend','<p>'+q.e+'</p><button class="btn" id="lok">Continuar</button>');
          const first=tries===0;if(first){Z.leit++;addPts(100,P.x-camX,P.y-120)}else addPts(40,P.x-camX,P.y-120);
          $('lok').onclick=()=>{ovClose();state=prev;res(first)}}
        else{tries++;bt.classList.add('bad');bt.disabled=true;blip(-3);toast('Releia o trecho e tente de novo.',1800)}});
    }
  });
}
function restaurarDedicatoria(){
  return new Promise(res=>{
    const prev=state;state='modal';
    const frag=['AO VERME','QUE PRIMEIRO ROEU','AS FRIAS CARNES','DO MEU CADÁVER','DEDICO COMO SAUDOSA LEMBRANÇA','ESTAS MEMÓRIAS PÓSTUMAS'];
    let ordem=frag.map((t,i)=>({t,i})).sort(()=>Math.random()-.5),prox=0,erros=0;
    ov('<h2>A página rasgada</h2><p>O Carimbo rasgou a dedicatória em seis pedaços. Toque nos pedaços na ordem certa para restaurá-la.</p><div class="card" id="dd" style="min-height:6em"><small>MEMÓRIAS PÓSTUMAS DE BRÁS CUBAS</small><span id="ddt"></span></div><div id="fr"></div>');
    const draw=()=>{$('ddt').innerHTML=frag.slice(0,prox).join('<br>');
      $('fr').innerHTML=ordem.filter(o=>o.i>=prox).map(o=>'<button class="opt" data-i="'+o.i+'" style="display:inline-block;width:auto;margin:5px">'+o.t+'</button>').join('');
      $('fr').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(+b.dataset.i===prox){prox++;tone(520+prox*60,.12,.05,'triangle');draw()}else{erros++;b.classList.add('bad');tone(110,.2,.05);setTimeout(()=>b.classList.remove('bad'),500)}});
      if(prox>=frag.length){$('fr').innerHTML='<p>Restaurada: a dedicatória é ao <b>verme</b>, e não ao leitor, aos amigos ou à família. Machado começa o livro por uma ironia.</p><button class="btn" id="dok">Guardar a página</button>';
        $('dok').onclick=()=>{ovClose();state=prev;addPts(erros===0?200:120,CW/2,200);res()}}};
    draw();
  });
}
function contarAmigos(){
  return new Promise(res=>{
    const prev=state;state='modal';
    ov('<h2>Quantos amigos foram ao enterro?</h2><p>Conte os homens de guarda-chuva diante da cova. Só vale quem estava na fila.</p><div id="lq"></div>');
    const opts=[9,10,11,12];let h='';opts.forEach(n=>h+='<button class="opt" data-n="'+n+'">'+n+' amigos</button>');$('lq').innerHTML=h;let tries=0;
    $('lq').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(+b.dataset.n===11){b.classList.add('ok');$('lq').querySelectorAll('.opt').forEach(x=>x.disabled=true);
        $('lq').insertAdjacentHTML('beforeend','<p>Onze, como o narrador conta no capítulo 1: "fui acompanhado ao cemitério por onze amigos. Onze amigos!" A exclamação já é uma pequena ironia.</p><button class="btn" id="lok">Continuar</button>');
        $('lok').onclick=()=>{ovClose();state=prev;addPts(tries===0?100:40,CW/2,200);res()}}
      else{tries++;b.classList.add('bad');b.disabled=true;blip(-3)}});
  });
}
/* ============ Interações ============ */
