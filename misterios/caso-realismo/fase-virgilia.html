<style>

#tL{left:2%;bottom:6%}#tR{left:calc(2% + clamp(56px,13vw,84px));bottom:6%}
#tJ{right:2%;bottom:6%}#tA{right:calc(2% + clamp(56px,13vw,84px));bottom:6%;font-size:.8rem}#tX{right:calc(2% + clamp(112px,26vw,168px));bottom:6%;font-size:.7rem}#tS{right:calc(2% + clamp(84px,19vw,126px));bottom:calc(6% + clamp(28px,6.5vw,42px));font-size:.65rem}#tC{right:calc(2% + clamp(28px,6.5vw,42px));bottom:calc(6% + clamp(56px,13vw,84px))}

<script>
"use strict";
/* ============ Constantes ============ */
const CW=960,CH=540,G=480,WW=3700;
const DPR=Math.min(window.devicePixelRatio||1,1.5);
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');cv.width=CW*DPR;cv.height=CH*DPR;
const $=id=>document.getElementById(id);
const SAVE='caso_realismo_v1';
const SRC={det:'../caso-originais/img/q1/detetive.webp',detF:'../caso-originais/img/q1/detetive-f.webp',bras:'img/q1/bras.webp',hipo:'img/q1/hipopotamo.webp',
 bg:'img/q1/bg-velorio.webp',bgd:'img/q1/bg-delirio.webp',retBras:'img/q1/ret-bras.webp',retDet:'../caso-originais/img/detetive.webp',retDetF:'../caso-originais/img/detetive-f.webp',
 bgi:'img/q1/bg-infancia.webp',vir:'img/q1/virgilia.webp',retVir:'img/q1/ret-virgilia.webp',lobo:'img/q1/lobo.webp',retLobo:'img/q1/ret-lobo.webp'};
const OPCIONAL=['hq2','hq3','amigos','caixao','padre'];
const IMG={};
Object.assign(SRC,{dPena:'img/q1/d/pena.webp',dAgu:'img/q1/d/aguia.webp'});
const SH={det:{w:269,h:232,s:.47},bras:{w:137,h:340,s:.37},hipo:{w:303,h:230,s:.6},vir:{w:196,h:340,s:.37},lobo:{w:186,h:340,s:.37}};
function loadAll(cb){
  const keys=Object.keys(SRC);let n=0;
  keys.forEach(k=>{const im=new Image();im.onload=()=>{IMG[k]=im;if(++n===keys.length)cb()};im.onerror=()=>{if(++n===keys.length)cb()};im.src=SRC[k]});
}
/* Arte final dos desafios (img/q1/d). dI: desenha o quadro f de uma tira (cw×ch) centrado em x,y. */
function dImg(k,f,cw,ch,x,y,w,h,rot,alpha,flip){const im=IMG[k];if(!im)return;ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.translate(x,y);if(rot)ctx.rotate(rot);if(flip)ctx.scale(-1,1);ctx.drawImage(im,f*cw,0,cw,ch,-w/2,-h/2,w,h);ctx.restore()}
function sheet(k,sh,f,x,y,flip,alpha,sc){
  const im=IMG[k];if(!im)return;const s=sh.s*(sc||1),w=sh.w*s,h=sh.h*s;
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.translate(x,y+3);if(flip)ctx.scale(-1,1);
  ctx.drawImage(im,f*sh.w,0,sh.w,sh.h,-w/2,-h,w,h);ctx.restore();
}
/* ===== Game feel: partículas (poeira, dash) ===== */
const PART=[];
function puff(x,y,n,k,col){for(let i=0;i<n;i++)PART.push({x:x+(Math.random()-.5)*14,y:y-2,vx:(Math.random()-.5)*90*(k||1),vy:-20-Math.random()*60*(k||1),t:0,l:.35+Math.random()*.3,r:2+Math.random()*3,c:col||'rgba(236,222,190,'})}
function updPart(dt){for(const p of PART){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt}for(let i=PART.length-1;i>=0;i--)if(PART[i].t>=PART[i].l)PART.splice(i,1)}
function drawPart(){ctx.save();ctx.translate(-camX,0);for(const p of PART){const a=1-p.t/p.l;ctx.fillStyle=p.c+(a*.6)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+p.t*1.5),0,7);ctx.fill()}ctx.restore()}
/* ============ Estado ============ */
let state='start',T=0,camX=0,shake=0,flash=0;
const S={nome:'',turma:'',gen:'m'};
const Z={pts:0,pages:0,lamps:3,leit:0,tot:5,enviou:false};
const F={cl:{},vered:false,des:false,ped:false,retrato:false,aguia:false,nariz:false,pontos:false,porta:false};
const LOBO={x:2450,dir:1,pause:0,on:true,seen:0};const BUSH=[{x:2480},{x:2800},{x:3080}];let hidden=false;
const K={left:0,right:0,jump:0,lamp:0,act:0,atk:0};
const P={x:110,y:G,vx:0,vy:0,face:1,ground:true,jumps:2,inv:0,an:0,land:0,hurt:0};
let cpX=110,lastStep=0;
const PITS=[{x:700,w:110},{x:1250,w:130},{x:2300,w:140},{x:2900,w:120}];
const PLAT=[]; /* sem plataformas de caixa */
const PAGES=[[455,G-125,'o'],[595,G-175,'o'],[885,G-135,'c'],[1335,G-195,'c'],[1730,G-175,'o'],[2295,G-190,'c'],[2915,G-195,'o'],[3415,G-135,'o'],[250,G-40,'c'],[1600,G-40,'c'],[2650,G-40,'o']].map(a=>({x:a[0],y:a[1],k:a[2],got:false}));
let stamps=[],stampT=3,rain=[],bolt=0,boltT=8,hint=0,hipo={on:false,x:0,y:0,t:0},cine=null,paused=false,floaters=[],marks=[];
for(let i=0;i<240;i++)rain.push({x:Math.random()*CW*1.3,y:Math.random()*CH,v:520+Math.random()*320,l:10+Math.random()*14});
/* ============ Áudio ============ */
let AC=null,rainG=null,muted=false;
function audio(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=.5;
  rainG=AC.createGain();rainG.gain.value=muted?0:.012;s.connect(f).connect(rainG).connect(AC.destination);s.start();
}
function noiseBurst(dur,freq,vol){if(!AC||muted)return;const n=AC.sampleRate*dur,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=AC.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(AC.destination);s.start()}
function tone(fr,dur,vol,type){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=fr;g.gain.value=vol||.04;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+dur)}
const thunder=()=>noiseBurst(1.8,320,.5),thud=()=>noiseBurst(.4,200,.7),blip=v=>tone(180+v*40,.05,.025,'triangle');
function setMute(m){muted=m;if(rainG)rainG.gain.value=m?0:.012;$('bMute').textContent=m?'×':'♪'}
/* ============ Utilidades de UI ============ */
let toastT=0;
function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms||3200)}
const NARR={queda:['Até a rua da Gamboa tem as suas covas, leitor.','Caí. O pavão que me perdoe.','Uma sarjeta é só um capítulo mais fundo.'],
 carimbo:['O Carimbo carimbou o pavão. A águia está salva.','O Carimbo riscou o leitor. Que falta de educação com quem lê.','Rasurado! Foi o que ele pensou. O Carimbo é pior que um marido ciumento.'],
 pag:['Um bilhete dobrado. O adultério precisa de papel e de tinta.','Bilhete guardado. O vizinho não viu, leitor.']};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function addPts(n,x,y){Z.pts+=n;floaters.push({x,y,t:0,s:'+'+n});hud()}
const NP=6;
function hud(){
  let l='';for(let i=0;i<3;i++)l+='<span class="lamp'+(i<Z.lamps?'':' off')+'"></span>';$('hLamp').innerHTML='Lamparinas '+l;
  $('hPag').textContent=Z.pages+'/11';$('hPts').textContent=Z.pts;
  $('hTask').innerHTML='Provas <b>'+provas()+'/'+NP+'</b>';
}
/* ============ Diálogo ============ */
let dq=null,dI=0,typing=null,dFull='';
function say(lines){return new Promise(res=>{
  const prev=state;state='dialog';dq={lines,i:0,res,prev};$('dlg').classList.remove('hidden');$('prompt').classList.add('hidden');next();});}
const WHO={vir:['Virgília','retVir'],lobo:['Lobo Neves','retLobo'],bras:['Brás Cubas','retBras'],det:['Detetive',null],narr:['Narrador (o defunto)','retBras'],prud:['Prudêncio (menino)','retPrud'],quincas:['Quincas Borba','retQuincas'],ludg:['Mestre Ludgero',null]};
function next(){
  if(typing&&dI<dFull.length){dI=dFull.length;$('dTxt').textContent=dFull;clearInterval(typing);typing=null;return}
  if(dq.i>=dq.lines.length){$('dlg').classList.add('hidden');state=dq.prev==='dialog'?'play':dq.prev;const r=dq.res;dq=null;r();return}
  const [w,t]=dq.lines[dq.i++];const info=WHO[w];$('dNome').textContent=w==='det'?(S.nome||'Detetive'):info[0];
  const ik=w==='det'?(S.gen==='f'?'retDetF':'retDet'):info[1];if(ik){$('dImg').src=SRC[ik];$('dImg').style.display=''}else $('dImg').style.display='none';
  dFull=t;dI=0;$('dTxt').textContent='';clearInterval(typing);
  typing=setInterval(()=>{dI++;$('dTxt').textContent=dFull.slice(0,dI);if(dI%2===0)blip(w==='det'?1:3);if(dI>=dFull.length){clearInterval(typing);typing=null}},24);
}
/* ============ Modais ============ */
function ov(html){const o=$('ov');o.innerHTML='<div class="panel">'+html+'</div>';o.classList.remove('hidden')}
function ovClose(){$('ov').classList.add('hidden');$('ov').innerHTML=''}
function leitura(cfg){
  return new Promise(res=>{
    const prev=state;state='modal';const words=cfg.cita.split(/\s+/).length,secs=Math.max(8,Math.ceil(words/5));
    ov('<h2>'+cfg.titulo+'</h2><p>Leia com calma. A pergunta aparece quando o tempo acabar.</p><div class="cita">'+cfg.cita+'</div><div class="src">'+cfg.fonte+'</div><div class="bar"><i id="lb"></i></div><div id="lq"></div>');
    const b=$('lb');let t0=performance.now();const iv=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/(secs*1000));b.style.width=(p*100)+'%';if(p>=1){clearInterval(iv);perg()}},100);
    function perg(){
      const q=cfg.q;let h='<p><b>'+q.t+'</b></p>';q.o.forEach((o,i)=>h+='<button class="opt" data-i="'+i+'">'+o+'</button>');$('lq').innerHTML=h;
      let tries=0;$('lq').querySelectorAll('.opt').forEach(bt=>bt.onclick=()=>{
        const i=+bt.dataset.i;if(i===q.k){bt.classList.add('ok');$('lq').querySelectorAll('.opt').forEach(x=>x.disabled=true);
          $('lq').insertAdjacentHTML('beforeend','<p>'+q.e+'</p><button class="btn" id="lok">Continuar</button>');
          const first=tries===0;if(cfg.re){addPts(30,P.x-camX,P.y-120)}else if(first){Z.leit++;addPts(100,P.x-camX,P.y-120)}else addPts(40,P.x-camX,P.y-120);
          $('lok').onclick=()=>{ovClose();state=prev;res(first)}}
        else{tries++;bt.classList.add('bad');bt.disabled=true;blip(-3);toast('Releia o trecho e tente de novo.',1800)}});
    }
  });
}
function restaurarFrase(){
  return new Promise(res=>{
    const prev=state;state='modal';
    const frag=['Virgília comparou a águia e o pavão,','e elegeu a águia,','deixando o pavão com o seu espanto.'];
    let ordem=frag.map((t,i)=>({t,i})).sort(()=>Math.random()-.5),prox=0,erros=0;
