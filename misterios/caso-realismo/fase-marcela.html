.panel{background:linear-gradient(180deg,#201630,#150e20);border:2px solid #8b73bd;border-radius:16px;padding:clamp(12px,2.4vw,26px);max-width:min(860px,100%);width:100%;box-shadow:0 12px 50px #000}

input[type=text]{width:100%;padding:9px 12px;border-radius:8px;border:1px solid #6b55a0;background:#120b1c;color:var(--paper);font:inherit;margin:4px 0 8px;-webkit-user-select:text;user-select:text}

.card{position:relative;background:#e9dcc0;color:#2a1a10;border-radius:6px;padding:clamp(18px,4vw,48px);text-align:center;font-family:'Playfair Display',serif;font-weight:700;letter-spacing:.04em;line-height:1.7;box-shadow:inset 0 0 40px rgba(90,50,10,.35);font-size:clamp(.95rem,2.6vw,1.7rem)}

#touch{position:absolute;inset:0;z-index:4;pointer-events:none}
#touch button{pointer-events:auto;position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,12,30,.55);color:#fff;font-size:1.3rem;width:clamp(48px,11vw,72px);height:clamp(48px,11vw,72px);touch-action:none}
#tL{left:2%;bottom:6%}#tR{left:calc(2% + clamp(56px,13vw,84px));bottom:6%}
#tJ{right:2%;bottom:6%}#tA{right:calc(2% + clamp(56px,13vw,84px));bottom:6%;font-size:.8rem}#tC{right:calc(2% + clamp(28px,6.5vw,42px));bottom:calc(6% + clamp(56px,13vw,84px))}
body:not(.touch) #touch{display:none}
#rot{position:fixed;inset:0;z-index:99;background:#07050a;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:1.2rem}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}

</div></div>

<script>
"use strict";
/* ============ Constantes ============ */
const CW=960,CH=540,G=480,WW=3700;
const DPR=Math.min(window.devicePixelRatio||1,1.5);
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');cv.width=CW*DPR;cv.height=CH*DPR;
const $=id=>document.getElementById(id);
const SAVE='caso_realismo_v1';
const SRC={det:'../caso-originais/img/q1/detetive.webp',detF:'../caso-originais/img/q1/detetive-f.webp',bras:'img/q1/bras.webp',hipo:'img/q1/hipopotamo.webp',
 bg:'img/q1/bg-velorio.webp',bgd:'img/q1/bg-delirio.webp',retBras:'img/q1/ret-bras.webp',retDet:'../caso-originais/img/detetive.webp',retDetF:'../caso-originais/img/detetive-f.webp',
 bgi:'img/q1/bg-infancia.webp',marc:'img/q1/marcela.webp',retMarc:'img/q1/ret-marcela.webp'};
const OPCIONAL=['hq2','hq3','amigos','caixao','padre'];
const IMG={};
const SH={det:{w:269,h:232,s:.47},bras:{w:137,h:340,s:.37},hipo:{w:303,h:230,s:.6},marc:{w:242,h:340,s:.37}};
function loadAll(cb){
  const keys=Object.keys(SRC);let n=0;
  keys.forEach(k=>{const im=new Image();im.onload=()=>{IMG[k]=im;if(++n===keys.length)cb()};im.onerror=()=>{if(++n===keys.length)cb()};im.src=SRC[k]});
}
function sheet(k,sh,f,x,y,flip,alpha,sc){
  const im=IMG[k];if(!im)return;const s=sh.s*(sc||1),w=sh.w*s,h=sh.h*s;
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.translate(x,y+3);if(flip)ctx.scale(-1,1);
  ctx.drawImage(im,f*sh.w,0,sh.w,sh.h,-w/2,-h,w,h);ctx.restore();
}
/* ============ Estado ============ */
let state='start',T=0,camX=0,shake=0,flash=0;
const S={nome:'',turma:'',gen:'m'};
const Z={pts:0,pages:0,lamps:3,leit:0,tot:4,enviou:false};
const F={ped:false,rossio:false,asno:false,reflex:false,contos:false,porta:false,digno:false};
const K={left:0,right:0,jump:0,lamp:0,act:0};
const P={x:110,y:G,vx:0,vy:0,face:1,ground:true,jumps:2,inv:0,an:0,land:0,hurt:0};
let cpX=110,lastStep=0;
const PITS=[{x:700,w:110},{x:1250,w:130},{x:2300,w:140},{x:2900,w:120}];
const PLAT=[{x:420,y:G-60,w:70},{x:560,y:G-110,w:70},{x:850,y:G-70,w:64},{x:1180,y:G-80,w:70},{x:1300,y:G-130,w:70},{x:1500,y:G-70,w:64},{x:1700,y:G-110,w:70},
 {x:2140,y:G-70,w:64},{x:2260,y:G-125,w:70},{x:2420,y:G-70,w:64},{x:2760,y:G-80,w:64},{x:2880,y:G-130,w:70},{x:3040,y:G-70,w:64},{x:3380,y:G-70,w:64}];
const PAGES=[[455,G-125],[595,G-175],[885,G-135],[1335,G-195],[1730,G-175],[2295,G-190],[2915,G-195],[3415,G-135],[250,G-40],[1600,G-40],[2650,G-40]].map(a=>({x:a[0],y:a[1],got:false}));
let stamps=[],stampT=3,rain=[],bolt=0,boltT=8,hint=0,hipo={on:false,x:0,y:0,t:0},cine=null,paused=false,floaters=[],marks=[];
for(let i=0;i<240;i++)rain.push({x:Math.random()*CW*1.3,y:Math.random()*CH,v:520+Math.random()*320,l:10+Math.random()*14});
/* ============ Áudio ============ */
let AC=null,rainG=null,muted=false;
function audio(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=.5;
  rainG=AC.createGain();rainG.gain.value=muted?0:.012;s.connect(f).connect(rainG).connect(AC.destination);s.start();
}
function noiseBurst(dur,freq,vol){if(!AC||muted)return;const n=AC.sampleRate*dur,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=AC.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(AC.destination);s.start()}
function tone(fr,dur,vol,type){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=fr;g.gain.value=vol||.04;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+dur)}
const thunder=()=>noiseBurst(1.8,320,.5),thud=()=>noiseBurst(.4,200,.7),blip=v=>tone(180+v*40,.05,.025,'triangle');
function setMute(m){muted=m;if(rainG)rainG.gain.value=m?0:.012;$('bMute').textContent=m?'×':'♪'}
/* ============ Utilidades de UI ============ */
let toastT=0;
function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms||3200)}
const NARR={queda:['Quem corre atrás do amor cai em muita cova, leitor.','Caí. Os onze contos que me perdoem.','Uma cova na rua é só um capítulo mais fundo.'],
 carimbo:['O Carimbo carimbou o leitor. Que falta de educação com quem lê.','Corrigido! Foi o que ele pensou. O Carimbo é a palmatória da crítica.'],
 pag:['Um conto de réis. Em breve ele não será mais seu.','Moeda guardada. Marcela já sabe quanto você tem.']};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function addPts(n,x,y){Z.pts+=n;floaters.push({x,y,t:0,s:'+'+n});hud()}
const NP=5;
function hud(){
  let l='';for(let i=0;i<3;i++)l+='<span class="lamp'+(i<Z.lamps?'':' off')+'"></span>';$('hLamp').innerHTML='Lamparinas '+l;
  $('hPag').textContent=Z.pages+'/11';$('hPts').textContent=Z.pts;
  $('hTask').innerHTML='Provas <b>'+provas()+'/'+NP+'</b>';
}
/* ============ Diálogo ============ */
let dq=null,dI=0,typing=null,dFull='';
function say(lines){return new Promise(res=>{
  const prev=state;state='dialog';dq={lines,i:0,res,prev};$('dlg').classList.remove('hidden');$('prompt').classList.add('hidden');next();});}
const WHO={marc:['Marcela','retMarc'],bras:['Brás Cubas','retBras'],det:['Detetive',null],narr:['Narrador (o defunto)','retBras'],prud:['Prudêncio (menino)','retPrud'],quincas:['Quincas Borba','retQuincas'],ludg:['Mestre Ludgero',null]};
function next(){
  if(typing&&dI<dFull.length){dI=dFull.length;$('dTxt').textContent=dFull;clearInterval(typing);typing=null;return}
  if(dq.i>=dq.lines.length){$('dlg').classList.add('hidden');state=dq.prev==='dialog'?'play':dq.prev;const r=dq.res;dq=null;r();return}
  const [w,t]=dq.lines[dq.i++];const info=WHO[w];$('dNome').textContent=w==='det'?(S.nome||'Detetive'):info[0];
  const ik=w==='det'?(S.gen==='f'?'retDetF':'retDet'):info[1];if(ik){$('dImg').src=SRC[ik];$('dImg').style.display=''}else $('dImg').style.display='none';
  dFull=t;dI=0;$('dTxt').textContent='';clearInterval(typing);
  typing=setInterval(()=>{dI++;$('dTxt').textContent=dFull.slice(0,dI);if(dI%2===0)blip(w==='det'?1:3);if(dI>=dFull.length){clearInterval(typing);typing=null}},24);
}
/* ============ Modais ============ */
function ov(html){const o=$('ov');o.innerHTML='<div class="panel">'+html+'</div>';o.classList.remove('hidden')}
function ovClose(){$('ov').classList.add('hidden');$('ov').innerHTML=''}
function leitura(cfg){
  return new Promise(res=>{
    const prev=state;state='modal';const words=cfg.cita.split(/\s+/).length,secs=Math.max(8,Math.ceil(words/5));
    ov('<h2>'+cfg.titulo+'</h2><p>Leia com calma. A pergunta aparece quando o tempo acabar.</p><div class="cita">'+cfg.cita+'</div><div class="src">'+cfg.fonte+'</div><div class="bar"><i id="lb"></i></div><div id="lq"></div>');
    const b=$('lb');let t0=performance.now();const iv=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/(secs*1000));b.style.width=(p*100)+'%';if(p>=1){clearInterval(iv);perg()}},100);
    function perg(){
      const q=cfg.q;let h='<p><b>'+q.t+'</b></p>';q.o.forEach((o,i)=>h+='<button class="opt" data-i="'+i+'">'+o+'</button>');$('lq').innerHTML=h;
      let tries=0;$('lq').querySelectorAll('.opt').forEach(bt=>bt.onclick=()=>{
        const i=+bt.dataset.i;if(i===q.k){bt.classList.add('ok');$('lq').querySelectorAll('.opt').forEach(x=>x.disabled=true);
          $('lq').insertAdjacentHTML('beforeend','<p>'+q.e+'</p><button class="btn" id="lok">Continuar</button>');
          const first=tries===0;if(first){Z.leit++;addPts(100,P.x-camX,P.y-120)}else addPts(40,P.x-camX,P.y-120);
          $('lok').onclick=()=>{ovClose();state=prev;res(first)}}
        else{tries++;bt.classList.add('bad');bt.disabled=true;blip(-3);toast('Releia o trecho e tente de novo.',1800)}});
    }
  });
}
function restaurarFrase(){
  return new Promise(res=>{
    const prev=state;state='modal';
    const frag=['Marcela amou-me','durante quinze meses','e onze contos de réis;','nada menos.'];
    let ordem=frag.map((t,i)=>({t,i})).sort(()=>Math.random()-.5),prox=0,erros=0;
    ov('<h2>A página do capítulo 17</h2><p>O Carimbo rasgou a frase mais famosa do capítulo em quatro pedaços. Toque nos pedaços na ordem certa.</p><div class="card" id="dd" style="min-height:5em"><small>CAPÍTULO XVII</small><span id="ddt"></span></div><div id="fr"></div>');
    const draw=()=>{$('ddt').innerHTML=frag.slice(0,prox).join(' ');
      $('fr').innerHTML=ordem.filter(o=>o.i>=prox).map(o=>'<button class="opt" data-i="'+o.i+'" style="display:inline-block;width:auto;margin:5px">'+o.t+'</button>').join('');
      $('fr').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(+b.dataset.i===prox){prox++;tone(520+prox*60,.12,.05,'triangle');draw()}else{erros++;b.classList.add('bad');tone(110,.2,.05);setTimeout(()=>b.classList.remove('bad'),500)}});
      if(prox>=frag.length){$('fr').innerHTML='<p>Restaurada: o amor é contado em meses e em contos de réis, como numa conta de armazém. Observe o "nada menos": o narrador faz questão do valor exato.</p><button class="btn" id="dok">Guardar a página</button>';
        $('dok').onclick=()=>{ovClose();state=prev;addPts(erros===0?200:120,CW/2,200);res()}}};
    draw();
  });
}
/* ============ Interações ============ */
const FONTE='Machado de Assis, Memórias Póstumas de Brás Cubas, cap. ';
const INTER=[
 {id:'ped',x:1050,r:90,need:'lamp',txt:'AÇÃO · Pegar a página rasgada',done:()=>F.ped,act:async()=>{
   await say([['det','Uma página rasgada com o carimbo vermelho. Está escrito "onze contos".']]);await restaurarFrase();F.ped=true;hud();
   toast('Capítulo 17 restaurado. Provas '+provas()+'/'+NP,3500)}},
 {id:'rossio',x:900,r:130,txt:'AÇÃO · Rossio Grande, noite das luminárias',done:()=>F.rossio,act:async()=>{
   await say([['bras','Dezessete anos, botas, esporas e chicote. Eu era um corcel de balada, leitor. Foi na noite das luminárias que vi Marcela.']]);

function drawRain(dt){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<30;i++){const x=((i*113+T*10*(1+i%3))%(CW+40)),y=(i*61+Math.sin(T*.7+i)*30)%(G-40)+20;ctx.fillStyle='rgba(255,200,120,'+(.12+.12*Math.sin(T*1.3+i))+')';ctx.beginPath();ctx.arc(x,y,1.5+i%3,0,7);ctx.fill()}
  ctx.restore();
}
function drawFloaters(){
  ctx.save();ctx.font='bold 22px "Special Elite",monospace';ctx.textAlign='center';
  for(const f of floaters){ctx.globalAlpha=1-f.t/1.2;ctx.fillStyle='#ffd98a';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(f.s,f.x,f.y-f.t*40);ctx.fillText(f.s,f.x,f.y-f.t*40)}ctx.restore();
}
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const sx=shake>0?(Math.random()-.5)*shake*16:0,sy=shake>0?(Math.random()-.5)*shake*10:0;ctx.save();ctx.translate(sx,sy);
  if(state==='cine'){drawCine(dt);ctx.restore();return}
  drawBG();drawFigures();drawBras();drawPlat();drawClue();drawPages();drawStamps();drawPlayer();drawLight();drawRain(dt);drawFloaters();
  /* vinheta */
  const v=ctx.createRadialGradient(CW/2,CH/2,CH*.4,CW/2,CH/2,CH*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,CW,CH);
  ctx.restore();
}
/* ============ Cena do cais ============ */
function startCine(){
  state='cine';cine={t:0,lines:[[.6,'"Desta vez vais para a Europa; vais cursar uma Universidade, provavelmente Coimbra."'],[3.4,'"Quero-te para homem sério e não para arruador e gatuno."'],[6.2,'Foi assim que o filho pródigo atravessou o mar, e quem o esperava do outro lado era um almocreve.']]};
  $('prompt').classList.add('hidden');$('hud').classList.add('hidden');
}
function drawCine(dt){
  cine.t+=dt;const t=cine.t;
  const sg=ctx.createLinearGradient(0,0,0,CH);sg.addColorStop(0,'#150f2e');sg.addColorStop(.6,'#4a2a5a');sg.addColorStop(1,'#d08a6a');ctx.fillStyle=sg;ctx.fillRect(0,0,CW,CH);
  for(let i=0;i<50;i++){ctx.fillStyle='rgba(255,240,200,'+(.35+.3*Math.sin(t*2+i))+')';ctx.fillRect((i*173)%CW,(i*89)%250,2,2)}
  ctx.fillStyle='#10223a';ctx.fillRect(0,G-60,CW,CH-(G-60));
  for(let i=0;i<20;i++){ctx.fillStyle='rgba(180,210,255,.2)';ctx.fillRect(((i*97-t*40)%CW+CW)%CW,G-40+(i*13)%60,50,2)}
  const sx=200+t*60;ctx.fillStyle='#3a2616';ctx.beginPath();ctx.moveTo(sx,G-30);ctx.lineTo(sx+260,G-30);ctx.lineTo(sx+230,G+10);ctx.lineTo(sx+30,G+10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#2a1c14';ctx.fillRect(sx+120,G-200,6,170);ctx.fillStyle='#efe0c0';ctx.beginPath();ctx.moveTo(sx+126,G-195);ctx.lineTo(sx+210,G-110);ctx.lineTo(sx+126,G-60);ctx.closePath();ctx.fill();
  const fem=S.gen==='f'&&IMG.detF;sheet(fem?'detF':'det',SH.det,fem?14:5,sx+70,G-26,false,1,.9);
  const l=cine.lines.filter(x=>t>=x[0]).pop();
  if(l){ctx.save();ctx.fillStyle='rgba(10,5,16,.78)';ctx.fillRect(60,CH-110,CW-120,74);ctx.fillStyle='#ffd98a';ctx.font='italic 20px Lora,serif';ctx.textAlign='center';
    const words=l[1].split(' ');let ln='',lines=[];words.forEach(w=>{if((ln+w).length>70){lines.push(ln);ln=''}ln+=w+' '});lines.push(ln);
    lines.forEach((s,i)=>ctx.fillText(s.trim(),CW/2,CH-80+i*26));ctx.restore()}
  const fade=Math.max(0,(t-8)/1.5);if(fade>0){ctx.fillStyle='rgba(255,250,240,'+Math.min(1,fade)+')';ctx.fillRect(0,0,CW,CH)}
  if(t>9.6&&state==='cine')fim();
}

/* ============ Início, HQ, fim ============ */
function iniciar(){
  ov('<h2>O Caso dos Narradores Trocados</h2><p><b>Fase 1 · Zona 3: Marcela e os onze contos</b> (Memórias Póstumas de Brás Cubas, Machado de Assis).</p><p>Rio de Janeiro, 1822. O Agente Carimbo rasgou os capítulos do primeiro amor de Brás. Percorra o Rossio Grande na noite das luminárias, junte os onze contos e descubra quanto custou a linda Marcela.</p>'+
   '<p>Seu primeiro nome ou apelido:</p><input type="text" id="iN" maxlength="16" placeholder="Nome"><input type="text" id="iT" maxlength="12" placeholder="Turma (ex.: 3º A)"><p>Detetive:</p><div class="gpick"><button id="gM" class="on">Ele</button><button id="gF">Ela</button></div>'+
   '<p style="font-size:.85em;color:var(--muted)">Setas ou A/D: andar · Espaço: pular (duplo) · C: lamparina · E: ação · Esc: pausa. No celular, use os botões na tela.</p><button class="btn" id="go">Começar</button><button class="btn sec" id="back">Voltar ao Arquivo</button>');
  $('gM').onclick=()=>{S.gen='m';$('gM').classList.add('on');$('gF').classList.remove('on')};$('gF').onclick=()=>{S.gen='f';$('gF').classList.add('on');$('gM').classList.remove('on')};
  $('back').onclick=()=>{location.href='../index.html'};
  $('go').onclick=()=>{S.nome=($('iN').value||'').trim()||'Detetive';S.turma=($('iT').value||'').trim();audio();setMute(muted);comecar()};
}



function comecar(){
  ovClose();state='play';$('hud').classList.remove('hidden');hud();
  say([['narr','Tinha dezessete anos, botas e esporas, leitor, e fui parar nas mãos de Marcela. Procure a página rasgada com a lamparina (segure C), recolha as moedas, leia os capítulos e fale com ela. Depois, o cais.']]);
}
function fim(){
  state='end';$('hud').classList.add('hidden');
  const pct=Math.round((Z.leit/Z.tot)*100);
  try{const o=JSON.parse(localStorage.getItem(SAVE)||'{}');o.zonas=o.zonas||{};o.found=o.found||{};o.done=o.done||[];
    if(!o.zonas[3]||o.zonas[3]<Z.pts)o.zonas[3]=Z.pts;o.found.z3=1;o.score=Object.values(o.zonas).reduce((a,b)=>a+b,0);localStorage.setItem(SAVE,JSON.stringify(o))}catch(e){}
  enviar(pct);
  ov('<h2>Zona 3 concluída: Marcela e os onze contos</h2><p>Pontos: <b>'+Z.pts+'</b> · Contos reunidos: <b>'+Z.pages+'/11</b> · Leituras certas de primeira: <b>'+Z.leit+'/'+Z.tot+'</b></p>'+
   '<p>Você viu o corcel romântico virar asno, leu a "reflexão imoral" dos joalheiros e entendeu a ironia do amor contado em "quinze meses e onze contos de réis".'+(F.digno?' E saiu com dignidade, algo que Brás não conseguiu.':'')+'</p>'+
   '<p><b>Próxima zona: Coimbra e o almocreve.</b> Em construção.</p><button class="btn" id="ba">Voltar ao Arquivo</button><button class="btn sec" id="rj">Jogar de novo</button>');
  $('ba').onclick=()=>{location.href='../index.html'};$('rj').onclick=()=>location.reload();
}
function enviar(pct){
  if(Z.enviou)return;Z.enviou=true;
  try{if(typeof SHEETS_URL==='undefined'||!SHEETS_URL)return;
    fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({atividade:'Caso 2 · Fase 1 · Zona 3 · Marcela e os onze contos',nome:S.nome,turma:S.turma,acertos:Z.leit,total:Z.tot,pct:pct,abertas:'Pontos: '+Z.pts+' · Contos: '+Z.pages+'/11'})}).catch(()=>{});}catch(e){}
}
/* ============ Entrada ============ */
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyC:'lamp',KeyE:'act',Enter:'act'};
addEventListener('keydown',e=>{
  const k=KM[e.code];
  if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')pause(true);else if(paused)pause(false);return}
  if(e.code==='KeyM'){setMute(!muted);return}
  if(state==='dialog'&&(e.code==='Space'||e.code==='Enter'||e.code==='KeyE')){e.preventDefault();next();return}
  if(!k)return;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
  if(k==='act'){if(!K.act&&state==='play')doAct();K.act=1;return}K[k]=1;
});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)K[k]=0});
function doAct(){const it=nearInter();if(it)it.act()}
function pause(on){paused=on;if(on){state='pause';ov('<h2>Pausa</h2><button class="btn" id="rs">Continuar</button><button class="btn sec" id="bk">Voltar ao Arquivo</button>');$('rs').onclick=()=>pause(false);$('bk').onclick=()=>location.href='../index.html'}else{ovClose();state='play'}}
$('bPause').onclick=()=>{if(state==='play')pause(true)};$('bMute').onclick=()=>setMute(!muted);
$('dlg').addEventListener('pointerdown',e=>{e.preventDefault();if(state==='dialog')next()});
function bindT(id,k,act){const b=$(id);const on=e=>{e.preventDefault();if(act){if(state==='dialog'){next();return}if(state==='play')doAct()}else K[k]=1};const off=e=>{e.preventDefault();if(!act)K[k]=0};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)}
bindT('tL','left');bindT('tR','right');bindT('tJ','jump');bindT('tC','lamp');bindT('tA',null,true);
if('ontouchstart' in window||navigator.maxTouchPoints>0)document.body.classList.add('touch');
/* ============ Laço ============ */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;T+=dt;
  if(state==='play'){updatePlayer(dt);updateWorld(dt);
    camX+=((P.x-CW*.42)-camX)*Math.min(1,dt*5);camX=Math.max(0,Math.min(WW-CW,camX));
    const it=nearInter();const pr=$('prompt');if(it){pr.textContent=it.txt;pr.classList.remove('hidden')}else pr.classList.add('hidden');
    if(K.lamp&&!K._l){K._l=1;}if(!K.lamp)K._l=0;
  }else if(state==='dialog'){updateWorld(dt);P.vx=0}
  render(dt);
}
window.__t={P,F,Z,PAGES,INTER,get state(){return state},set state(v){state=v},get camX(){return camX},set camX(v){camX=v},provas,startCine,fim,K};
loadAll(()=>{requestAnimationFrame(loop);iniciar();hud()});
</script>
