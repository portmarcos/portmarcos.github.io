function embaralhar(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function getBlocos(total){
  if(total<=20) return [{ini:0,fim:total-1}];
  const n=Math.ceil(total/18);
  const base=Math.floor(total/n);
  const rem=total%n;
  const blocos=[];
  let idx=0;
  for(let i=0;i<n;i++){
    const tam=base+(i<rem?1:0);
    blocos.push({ini:idx,fim:idx+tam-1});
    idx+=tam;
  }
  return blocos;
}

const S = { topico:null, qIdx:0, respostas:[], blocos:[], blocoAtivo:0, timerSeg:3000, timerInterval:null, startTime:null, endTime:null };

function iniciarQuiz(topico){
  const t = BANCO[topico];
  embaralhar(t.questoes);
  S.topico = topico;
  S.qIdx = 0;
  S.respostas = new Array(t.questoes.length).fill(-1);
  S.blocos = getBlocos(t.questoes.length);
  S.blocoAtivo = 0;
  S.timerSeg = 3000;
  S.startTime = Date.now();
  S.endTime = null;
  mostrar('sc-quiz');
  document.getElementById('qTopicName').innerHTML = '<span class="tema-icon" style="color:'+(TEMAS_INFO[topico]?TEMAS_INFO[topico].cor:'currentColor')+'">'+temaIconSVG(topico)+'</span>' + t.titulo;
  renderNavDots();
  renderQ();
  iniciarTimer();
}

function iniciarTimer(){
  pararTimer();
  atualizarTimer();
  S.timerInterval = setInterval(()=>{
    S.timerSeg--;
    atualizarTimer();
    if(S.timerSeg<=0){pararTimer();finalizarQuiz();}
  },1000);
}
function pararTimer(){clearInterval(S.timerInterval);S.timerInterval=null;}

function atualizarTimer(){
  const m=Math.floor(S.timerSeg/60), s=S.timerSeg%60;
  const el=document.getElementById('timer');
  el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  el.className='timer-box';
  if(S.timerSeg<=300) el.classList.add('danger');
  else if(S.timerSeg<=600) el.classList.add('warn');
  const q = BANCO[S.topico].questoes;
  const resp = S.respostas.filter(r=>r>=0).length;
  document.getElementById('progFill').style.width=(resp/q.length*100)+'%';
}

function renderNavDots(){
  const blocosEl=document.getElementById('qBlocos');
  blocosEl.innerHTML='';
  if(S.blocos.length>1){
    S.blocos.forEach((b,bi)=>{
      const tam=b.fim-b.ini+1;
      const respondidas=S.respostas.slice(b.ini,b.fim+1).filter(r=>r>=0).length;
      const tab=document.createElement('div');
      tab.className='bloco-tab'+(bi===S.blocoAtivo?' ativo':'')+(respondidas===tam?' completo':'');
      tab.textContent='Bloco '+(bi+1)+' ('+(b.ini+1)+'–'+(b.fim+1)+')';
      tab.onclick=()=>{S.blocoAtivo=bi;S.qIdx=b.ini;renderQ();renderNavDots();};
      blocosEl.appendChild(tab);
    });
  }
  const bloco=S.blocos[S.blocoAtivo];
  const nav=document.getElementById('qNav');
  nav.innerHTML='';
  for(let i=bloco.ini;i<=bloco.fim;i++){
    const d=document.createElement('div');
    d.className='q-dot'+(i===S.qIdx?' ativo':'')+(S.respostas[i]>=0?' respondida':'');
    d.textContent=i+1;
    d.onclick=()=>{S.qIdx=i;renderQ();renderNavDots();};
    nav.appendChild(d);
  }
}

function formatarTexto(t){
  // o pdftotext do PDF de origem quebra cada linha de coluna com \n e, em
  // textos com numeração de linha (para citações tipo "Linha 45"), ainda
  // insere uma linha em branco extra entre elas — sem isso, cada linha da
  // coluna vira um parágrafo com espaço de sobra e o texto fica cheio de
  // buracos. Colapsa qualquer sequência de quebras em uma só antes de gerar
  // os <br>, então cada linha original fica compacta e legível.
  return t.replace(/\n{2,}/g, '\n').replace(/\n/g, '<br>');
}

function renderQ(){
  const total=BANCO[S.topico].questoes.length;
  const q=BANCO[S.topico].questoes[S.qIdx];
  document.getElementById('qNum').textContent='Questão '+(S.qIdx+1)+' de '+total+(S.blocos.length>1?' · Bloco '+(S.blocoAtivo+1)+' de '+S.blocos.length:'');
  const tDiv=document.getElementById('qTexto');
  if(q.texto&&q.texto.trim()){
    tDiv.innerHTML='<div class="q-texto">'+formatarTexto(q.texto)+'<div class="q-fonte">'+q.fonte+'</div></div>';
  } else {
    tDiv.innerHTML='';
  }
  document.getElementById('qEnun').textContent=q.enun;
  const aDiv=document.getElementById('qAlts');
  const letras=['A','B','C','D','E'];
  aDiv.innerHTML='';
  q.alts.forEach((alt,i)=>{
    const btn=document.createElement('button');
    btn.className='alt-btn'+(S.respostas[S.qIdx]===i?' selecionada':'');
    btn.innerHTML='<span class="alt-letra">'+letras[i]+'</span><span class="alt-txt">'+alt+'</span>';
    btn.onclick=()=>selecionarAlt(i);
    aDiv.appendChild(btn);
  });
  document.getElementById('btnAnterior').disabled=S.qIdx===0;
  document.getElementById('btnProximo').disabled=S.qIdx===total-1;
}

function selecionarAlt(i){
  S.respostas[S.qIdx]=i;
  renderQ();
  renderNavDots();
  const total=BANCO[S.topico].questoes.length;
  const resp=S.respostas.filter(r=>r>=0).length;
  document.getElementById('progFill').style.width=(resp/total*100)+'%';
}

function navQ(dir){
  const novoIdx=S.qIdx+dir;
  const total=BANCO[S.topico].questoes.length;
  if(novoIdx>=0&&novoIdx<total){
    S.qIdx=novoIdx;
    const bi=S.blocos.findIndex(b=>novoIdx>=b.ini&&novoIdx<=b.fim);
    if(bi>=0) S.blocoAtivo=bi;
    renderQ();renderNavDots();
  }
}

function finalizarQuiz(){
  pararTimer();
  S.endTime=Date.now();
  const q=BANCO[S.topico].questoes;
  let certas=0, erradas=0, puladas=0;
  S.respostas.forEach((r,i)=>{
    if(r<0) puladas++;
    else if(r===q[i].correta) certas++;
    else erradas++;
  });
  const pct=Math.round(certas/q.length*100);
  document.getElementById('rScore').textContent=certas;
  document.getElementById('rTotal').textContent=q.length;
  document.getElementById('rCertas').textContent=certas;
  document.getElementById('rErradas').textContent=erradas;
  document.getElementById('rPuladas').textContent=puladas;
  const seg=Math.floor((S.endTime-S.startTime)/1000);
  const m=Math.floor(seg/60), s=seg%60;
  document.getElementById('rTempo').textContent=m+'min '+s+'s';
  const msgs=[
    [90,'🏆 Excelente! Nível avançado.'],
    [75,'💪 Muito bem! Acima da média.'],
    [60,'✅ Bom resultado! Continue praticando.'],
    [40,'📚 Metade do caminho. Revise os erros.'],
    [0,'🔁 Continue estudando — cada erro ensina.']
  ];
  document.getElementById('rMsg').textContent=msgs.find(([v])=>pct>=v)[1];
  document.getElementById('gabaritoLista').innerHTML='';
  document.getElementById('gabFiltros').style.display='none';
  document.getElementById('btnGabarito').textContent='📊 Ver análise das questões ▾';
  document.getElementById('btnRefazer').setAttribute('data-topico',S.topico);
  const respostasDetalhadas = S.respostas.map((r,i)=>{
    const qi=BANCO[S.topico].questoes[i];
    return { escolhida:r, correta:qi.correta, ok:r===qi.correta, enun:qi.enun, alts:qi.alts, expl:qi.expl };
  });
  AUTH.saveResult(S.topico, {
    score: certas, total: q.length,
    data: new Date().toISOString(),
    tempo_seg: Math.floor((S.endTime - S.startTime)/1000),
    respostas: respostasDetalhadas
  });
  enviarResultadoSheets(S.topico, certas, q.length, pct, respostasDetalhadas);
  mostrar('sc-result');
}

function enviarResultadoSheets(topico, certas, totalQ, pct, respostasDetalhadas){
  const urlSheets = (typeof SHEETS_URL === 'string' ? SHEETS_URL : '').trim();
  if(!urlSheets.startsWith('https://')) return;
  const erradas = respostasDetalhadas.filter(r=>!r.ok && r.enun).map(r=>r.enun.slice(0,80));
  fetch(urlSheets, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({
      atividade: 'Concursos LP · ' + (TEMAS_INFO[topico]?TEMAS_INFO[topico].titulo:topico),
      nome: (AUTH.current && AUTH.current.nome) || '(sem nome)',
      turma: (AUTH.current && AUTH.current.turma) || '(sem turma)',
      acertos: certas,
      total: totalQ,
      pct: pct,
      abertas: erradas.length ? ('Errou: ' + erradas.join(' | ')) : ''
    })
  }).catch(()=>{});
}

function abrirGabarito(){
  const cont=document.getElementById('gabaritoLista');
  const filtros=document.getElementById('gabFiltros');
  const btn=document.getElementById('btnGabarito');
  if(cont.innerHTML.trim()) {
    cont.innerHTML='';
    filtros.style.display='none';
    btn.textContent='📊 Ver análise das questões ▾';
    return;
  }
  btn.textContent='📊 Ver análise das questões ▴';

  const q=BANCO[S.topico].questoes;
  const letras=['A','B','C','D','E'];
  let nCertas=0, nErradas=0, nPuladas=0;
  q.forEach((qst,i)=>{
    const resp=S.respostas[i];
    const certa=qst.correta;
    let status='pulou', stLabel='Sem resposta';
    if(resp>=0){
      if(resp===certa){status='certo';stLabel='✓ Correta';nCertas++;}
      else {status='errou';stLabel='✗ Errada';nErradas++;}
    } else nPuladas++;
    const item=document.createElement('div');
    item.className='gabarito-item';
    item.dataset.status=status;
    const textoHtml=qst.texto?'<div class="g-texto">'+formatarTexto(qst.texto)+'</div>':'';
    const altsHtml=qst.alts.map((a,ai)=>{
      let cls='g-alt';
      if(ai===certa) cls+=' correta-alt';
      else if(ai===resp&&resp!==certa) cls+=' escolhida-errada';
      return '<div class="'+cls+'"><span class="gl">'+letras[ai]+'</span><span>'+a+'</span></div>';
    }).join('');
    item.innerHTML='<div class="gabarito-head" onclick="toggleGab(this)"><span class="g-num">Questão '+(i+1)+'</span><span>&nbsp;'+qst.enun.substring(0,60)+'…</span><span class="g-status '+status+'">'+stLabel+'</span></div><div class="gabarito-body'+(status==='errou'?' aberto':'')+'"><div>'+textoHtml+'<div class="g-enun">'+qst.enun+'</div><div class="g-alts">'+altsHtml+'</div><div class="g-expl">💡 '+qst.expl+'</div></div></div>';
    cont.appendChild(item);
  });

  const filtrosDef=[['todas','Todas ('+q.length+')'],['errou','Erros ('+nErradas+')'],['certo','Acertos ('+nCertas+')'],['pulou','Sem resposta ('+nPuladas+')']];
  filtros.innerHTML='';
  filtrosDef.forEach(([key,label])=>{
    if(key!=='todas' && key!=='errou' && cont.querySelectorAll('[data-status="'+key+'"]').length===0) return;
    const b=document.createElement('div');
    b.className='gab-filtro-btn'+(key==='errou'&&nErradas>0?' ativo':key==='todas'&&nErradas===0?' ativo':'');
    b.textContent=label;
    b.onclick=()=>filtrarGabarito(key,b);
    filtros.appendChild(b);
  });
  filtros.style.display='flex';
  if(nErradas>0) filtrarGabarito('errou', filtros.querySelector('.gab-filtro-btn.ativo'));
}

function filtrarGabarito(status, btnEl){
  document.querySelectorAll('#gabFiltros .gab-filtro-btn').forEach(b=>b.classList.remove('ativo'));
  if(btnEl) btnEl.classList.add('ativo');
  document.querySelectorAll('#gabaritoLista .gabarito-item').forEach(item=>{
    item.classList.toggle('g-hide', status!=='todas' && item.dataset.status!==status);
  });
}

function toggleGab(head){
  const body=head.nextElementSibling;
  body.classList.toggle('aberto');
}

function gerarProva(){
  let selecionadas=[];
  TEMAS_ORDEM.forEach(t=>{

    if(chk && chk.checked){
      const qtd=parseInt(document.getElementById('gerQtd-'+t).value)||0;
      const pool=embaralhar(BANCO[t].questoes.slice());
      selecionadas=selecionadas.concat(pool.slice(0,qtd));
    }
  });
  if(selecionadas.length===0){
    alert('Selecione ao menos um tema e defina a quantidade de questões pra gerar a prova.');

  if(document.getElementById('gerEmbaralhar').checked){

  PROVA.questoes=selecionadas;
  PROVA.titulo=document.getElementById('gerTitulo').value.trim()||'Avaliação de Interpretação de Texto';
  PROVA.subtitulo=document.getElementById('gerSubtitulo').value.trim();

  mostrar('sc-prova');
}

  PROVA.questoes.forEach((q,i)=>{
    html+=`<div class="prova-q">
      <div class="prova-q-num">Questão ${i+1}</div>
      ${q.texto?'<div class="prova-q-texto">'+formatarTexto(q.texto)+'</div>':''}
      ${q.fonte?'<div class="prova-q-fonte">'+q.fonte+'</div>':''}
      <div class="prova-q-enun">${q.enun}</div>
      <div class="prova-q-alts">${q.alts.map((a,ai)=>'<div class="prova-q-alt"><b>'+letras[ai]+')</b> '+a+'</div>').join('')}</div>
    </div>`;
  });

  if(PROVA.gabarito){
    html+='<div class="prova-gabarito"><h3>Gabarito</h3><div class="prova-gab-grid">';
    PROVA.questoes.forEach((q,i)=>{
      html+='<div class="prova-gab-item">'+(i+1)+'. '+letras[q.correta]+'</div>';
    });
    html+='</div></div>';
  }

  document.getElementById('provaFolha').innerHTML=html;
}

/* ── BOOTSTRAP ── */
AUTH.init();
renderDashboard();
if(AUTH.current.nome==='Estudante' && !localStorage.getItem('concursos_pediu_nome')){
  localStorage.setItem('concursos_pediu_nome','1');
  setTimeout(()=>{ if(confirm('Quer digitar seu nome e turma agora? Isso ajuda seu professor a acompanhar seu progresso.')) editarIdentidade(); }, 400);
}
</script>
