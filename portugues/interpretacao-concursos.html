<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interpretação em Provas de Concurso · Prof. Marcos Cruz</title>
<meta name="description" content="Quiz com questões reais de provas de concurso público — interpretação de texto e gramática em contexto, organizadas por tema, com gabarito comentado e gerador de provas para impressão.">
<meta property="og:title" content="Interpretação em Provas de Concurso — Prof. Marcos Cruz">
<meta property="og:description" content="Questões reais de concursos públicos, organizadas por tema, com gabarito comentado.">
<meta property="og:url" content="https://portmarcos.github.io/portugues/interpretacao-concursos.html">
<meta property="og:type" content="website">
<link rel="icon" href="/favicon.ico">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --az:#A78BFA;--az2:#8B5CF6;--az3:rgba(167,139,250,0.14);--az4:#0B1120;
  --ouro:#FBBF24;--ouro-l:rgba(251,191,36,0.12);
  --bg:#0B0710;--card:rgba(24,17,36,0.75);
  --tx:#E7E3F0;--tx2:#A79FBE;--tx3:#786F92;
  --verde:#34D399;--vd-c:rgba(52,211,153,0.15);
  --verm:#F87171;--vm-c:rgba(248,113,113,0.15);
  --borda:rgba(88,71,120,0.5);
  --r:16px;--r2:10px;--r3:24px;
  --shadow:0 4px 16px rgba(0,0,0,0.4);
  --shadow2:0 12px 32px rgba(0,0,0,0.5);
  --shadow3:0 20px 60px rgba(0,0,0,0.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;color:var(--tx);min-height:100vh;line-height:1.6;position:relative;background:linear-gradient(180deg,rgba(11,7,16,.72) 0%,rgba(11,7,16,.88) 50%,rgba(11,7,16,.985) 90%,#0B0710 100%),url('https://images.unsplash.com/photo-1481627834876-b7833e8f5570?auto=format&fit=crop&w=1920&q=74') center top/cover fixed no-repeat,var(--bg)}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(167,139,250,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(167,139,250,0.05) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 70% 50% at 50% 0%,black 40%,transparent 100%);mask-image:radial-gradient(ellipse 70% 50% at 50% 0%,black 40%,transparent 100%)}
.topo,.screen{position:relative;z-index:1}
h1,h2,h3,h4,.num{font-family:'Space Grotesk','Inter',sans-serif}

/* TOPO */
.topo{background:rgba(11,7,16,0.85);backdrop-filter:blur(12px);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--borda)}
.topo-marca{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
.topo-mc{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:.85rem;color:#0B0710;background:linear-gradient(135deg,#A78BFA,#8B5CF6);flex-shrink:0}
.topo-logo{font-size:1.15rem;font-weight:700;letter-spacing:.5px;color:var(--az);font-family:'Space Grotesk','Inter',sans-serif;line-height:1.1}
.topo-sub{font-size:.72rem;opacity:.7;font-family:'Inter',sans-serif;font-weight:400;letter-spacing:.3px}
.topo-btn{margin-left:auto;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:24px;padding:7px 16px;cursor:pointer;font-size:.78rem;font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;transition:.2s;letter-spacing:.5px;text-decoration:none;display:inline-block}
.topo-btn:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}

/* SCREENS */
.screen{display:none;animation:fadeUp .35s ease}
.screen.ativo{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* HOME DASHBOARD */
.dash-greeting{background:transparent;color:#fff;padding:44px 24px 40px;text-align:center;position:relative;overflow:hidden}
.dash-greeting h2{font-size:1.7rem;font-weight:800;position:relative;margin-bottom:6px}
.dash-greeting p{font-size:.9rem;opacity:.75;position:relative}
.dash-editar-id{background:rgba(255,255,255,.12);border:none;border-radius:50%;width:30px;height:30px;font-size:.85rem;cursor:pointer;vertical-align:middle;transition:.2s}
.dash-editar-id:hover{background:rgba(255,255,255,.25)}
.dash-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:900px;margin:0 auto;padding:0 20px 40px;position:relative}
@media(max-width:720px){.dash-cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.dash-cards{grid-template-columns:1fr}}
.dash-card{background:var(--card);border-radius:var(--r);padding:24px 20px;box-shadow:var(--shadow2);border:2px solid transparent;transition:.25s;position:relative;overflow:hidden;isolation:isolate}
.dash-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--grad,var(--az));border-radius:var(--r) var(--r) 0 0}
.dash-card.disponivel{cursor:pointer}
.dash-card.disponivel:hover{transform:translateY(-5px);box-shadow:var(--shadow3);border-color:var(--az3)}
.dash-card.concluido{--grad:var(--verde);border-color:#A7F3D0;background:linear-gradient(135deg,rgba(52,211,153,0.08),rgba(24,17,36,0.75))}
.dc-ico{width:34px;height:34px;display:flex;align-items:center;margin-bottom:12px}
.dc-ico svg{width:100%;height:100%;display:block}
.dc-titulo{font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:.92rem;color:var(--az);margin-bottom:4px}
.dc-score{font-size:2rem;font-weight:900;font-family:'Space Grotesk','Inter',sans-serif;color:var(--verde);line-height:1;margin:6px 0}
.dc-status{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;font-family:'Space Grotesk','Inter',sans-serif;padding:5px 12px;border-radius:20px;margin-top:8px}
.dc-status.ok{background:var(--vd-c);color:var(--verde)}
.dc-status.livre{background:var(--az3);color:var(--az)}
.dc-refazer{display:block;margin-top:10px;padding:6px 14px;border-radius:20px;border:2px solid var(--verde);background:transparent;color:var(--verde);font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:.72rem;cursor:pointer;transition:.2s}
.dc-refazer:hover{background:var(--vd-c)}
.dash-acoes{display:flex;gap:10px;justify-content:center;max-width:900px;margin:0 auto 40px;padding:0 20px;flex-wrap:wrap}
.tema-icon{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.22em;margin-right:.35em;color:currentColor}
.tema-icon svg{width:100%;height:100%;display:block}
.topic-card,.dash-card{isolation:isolate}
.topic-card::before,.dash-card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb, var(--cor,#A78BFA) 22%, transparent), transparent 60%);opacity:0;transition:opacity .35s ease;pointer-events:none;z-index:0}
.topic-card:hover::before,.dash-card:hover::before{opacity:1}
.topic-card>*,.dash-card>*{position:relative;z-index:1}

/* SEÇÃO HEADER */
.section-header{background:linear-gradient(135deg,#100B1C,#170F28);color:#fff;padding:32px 24px 24px;text-align:center}
.section-header h2{font-size:1.5rem;font-weight:800;margin-bottom:4px}
.section-header p{font-size:.85rem;opacity:.8}

/* QUIZ */
.quiz-header{background:linear-gradient(135deg,#100B1C,#170F28);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:16px}
.quiz-topic-name{font-family:'Space Grotesk','Inter',sans-serif;font-weight:800;font-size:1rem;letter-spacing:.3px}
.timer-box{margin-left:auto;font-family:'Space Grotesk','Inter',sans-serif;font-weight:900;font-size:1.15rem;padding:8px 20px;border-radius:24px;background:rgba(255,255,255,.15);transition:.4s;min-width:88px;text-align:center;border:1.5px solid rgba(255,255,255,.2)}
.timer-box.warn{background:#F59E0B;border-color:#F59E0B;color:#fff}
.timer-box.danger{background:#EF4444;border-color:#EF4444;color:#fff;animation:pulsar .7s infinite}
@keyframes pulsar{0%,100%{opacity:1}50%{opacity:.6}}
.progress-bar{height:5px;background:rgba(255,255,255,.15)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ouro),#FBBF24);transition:width .5s;border-radius:0 3px 3px 0}
.quiz-body{max-width:820px;margin:0 auto;padding:28px 20px}
.q-blocos{display:flex;justify-content:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.bloco-tab{padding:7px 16px;border-radius:20px;border:2px solid var(--borda);background:var(--card);cursor:pointer;font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:.72rem;color:var(--tx3);transition:.2s}
.bloco-tab.ativo{border-color:var(--az2);color:#fff;background:var(--az2)}
.bloco-tab.completo:not(.ativo){border-color:var(--az);color:var(--az)}
.q-nav{display:flex;justify-content:center;gap:7px;margin-bottom:24px;flex-wrap:wrap}
.q-dot{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--borda);background:var(--card);cursor:pointer;font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:.72rem;color:var(--tx3);transition:.2s;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.q-dot.ativo{border-color:var(--az2);color:var(--az2);background:var(--az3);transform:scale(1.1)}
.q-dot.respondida{background:var(--az);border-color:var(--az);color:#fff}
.q-box{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow2);padding:32px}
.q-num{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk','Inter',sans-serif;font-size:.75rem;font-weight:700;color:var(--az2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:20px}
.q-num::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--az3),transparent)}
.q-texto{background:linear-gradient(135deg,rgba(30,20,45,0.6),var(--az3));border-left:4px solid var(--az2);border-radius:0 var(--r2) var(--r2) 0;padding:20px 22px;margin-bottom:22px;font-size:.9rem;line-height:1.8;white-space:pre-line}
.q-texto img{max-width:100%;border-radius:8px;margin:10px auto;display:block;box-shadow:var(--shadow)}
.q-fonte{font-size:.71rem;color:var(--tx3);margin-top:10px;font-style:italic;padding-top:8px;border-top:1px solid var(--borda)}
.q-enun{font-size:.97rem;line-height:1.7;margin-bottom:24px;font-weight:600;color:var(--tx)}
.alt-btn{display:flex;align-items:flex-start;gap:14px;width:100%;background:var(--card);border:2px solid var(--borda);border-radius:var(--r2);padding:14px 18px;cursor:pointer;text-align:left;transition:.2s;margin-bottom:10px;font-family:'Inter',sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.alt-btn:hover{border-color:var(--az2);background:var(--az3);transform:translateX(4px)}
.alt-letra{font-family:'Space Grotesk','Inter',sans-serif;font-weight:900;font-size:.82rem;color:var(--az);min-width:26px;padding-top:2px;flex-shrink:0;width:28px;height:28px;background:var(--az3);border-radius:50%;display:flex;align-items:center;justify-content:center}
.alt-txt{font-size:.88rem;line-height:1.6;color:var(--tx);flex:1}
.alt-btn.selecionada{border-color:var(--az);background:var(--az3);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
.alt-btn.selecionada .alt-letra{background:var(--az);color:#0B0710}
.quiz-nav-btns{display:flex;gap:12px;justify-content:space-between;margin-top:8px}
.btn{font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:.82rem;padding:11px 24px;border-radius:24px;border:none;cursor:pointer;transition:.2s;letter-spacing:.3px}
.btn-sec{background:var(--card);border:2px solid var(--borda);color:var(--tx2);box-shadow:var(--shadow)}
.btn-sec:hover{border-color:var(--az);color:var(--az);transform:translateY(-1px)}
.btn-pri{background:linear-gradient(135deg,var(--az),var(--az2));color:#0B0710;box-shadow:0 4px 16px rgba(139,92,246,.3)}
.btn-pri:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(139,92,246,.4)}
.btn-ouro{background:linear-gradient(135deg,#D97706,var(--ouro));color:#fff;box-shadow:0 4px 16px rgba(217,119,6,.3)}
.btn-ouro:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(217,119,6,.4)}

/* RESULTADO */
.result-hero{background:linear-gradient(135deg,#100B1C,#170F28,#1E1230);color:#fff;padding:48px 24px;text-align:center;position:relative;overflow:hidden}
.result-score{font-size:3.2rem;font-weight:900;color:var(--ouro);line-height:1;font-family:'Space Grotesk','Inter',sans-serif}
.result-msg{font-size:1.15rem;font-weight:700;margin-top:8px}
.result-stats{display:flex;justify-content:center;gap:28px;margin-top:24px;flex-wrap:wrap}
.result-stat{text-align:center;background:rgba(255,255,255,.1);border-radius:12px;padding:12px 20px}
.result-stat .val{font-size:1.6rem;font-weight:900;font-family:'Space Grotesk','Inter',sans-serif}
.result-stat .lbl{font-size:.72rem;opacity:.7;margin-top:2px}
.result-body{max-width:820px;margin:0 auto;padding:32px 20px}
.gabarito-item{background:var(--card);border-radius:var(--r);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.gabarito-head{padding:16px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}
.gabarito-head:hover{background:var(--bg)}
.gabarito-head .g-num{font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:.82rem;color:var(--tx2)}
.gabarito-head .g-status{margin-left:auto;font-family:'Space Grotesk','Inter',sans-serif;font-size:.72rem;font-weight:700;padding:4px 12px;border-radius:20px;flex-shrink:0}
.g-status.certo{background:var(--vd-c);color:var(--verde)}
.g-status.errou{background:var(--vm-c);color:var(--verm)}
.g-status.pulou{background:rgba(88,71,120,0.4);color:#A79FBE}
.gabarito-body{display:none;padding:0 20px 20px;border-top:1px solid var(--borda)}
.gabarito-body.aberto{display:block}
.g-texto{background:linear-gradient(135deg,rgba(30,20,45,0.6),var(--az3));border-left:4px solid var(--az2);border-radius:0 var(--r2) var(--r2) 0;padding:14px 16px;margin:14px 0;font-size:.85rem;line-height:1.7;white-space:pre-line}
.g-texto img{max-width:100%;border-radius:8px;margin:8px auto;display:block}
.g-enun{font-size:.9rem;line-height:1.65;margin:12px 0;font-weight:600}
.g-alt{display:flex;gap:10px;padding:9px 14px;border-radius:var(--r2);font-size:.85rem;margin-bottom:5px;align-items:flex-start}
.g-alt .gl{font-weight:900;font-family:'Space Grotesk','Inter',sans-serif;min-width:20px;font-size:.78rem;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.g-alt.correta-alt{background:var(--vd-c);color:var(--verde)}
.g-alt.correta-alt .gl{background:var(--verde);color:#0B0710}
.g-alt.escolhida-errada{background:var(--vm-c);color:var(--verm)}
.g-alt.escolhida-errada .gl{background:var(--verm);color:#0B0710}
.g-expl{background:var(--az3);border-radius:var(--r2);padding:14px 16px;font-size:.83rem;line-height:1.65;margin-top:12px;color:var(--az);border-left:3px solid var(--az)}
.gab-filtros{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.gab-filtro-btn{padding:8px 18px;border-radius:20px;border:2px solid var(--borda);background:var(--card);cursor:pointer;font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:.78rem;color:var(--tx2);transition:.2s}
.gab-filtro-btn.ativo{border-color:var(--az2);color:#fff;background:var(--az2)}
.gabarito-item.g-hide{display:none}

/* GERADOR DE PROVAS */
.ger-wrap{max-width:820px;margin:0 auto;padding:28px 20px 60px}
.ger-config-box{background:var(--card);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);margin-bottom:24px}
.ger-label{display:block;font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:.78rem;color:var(--tx2);margin-bottom:6px;margin-top:14px}
.ger-label:first-child{margin-top:0}
.ger-input{width:100%;padding:11px 14px;border-radius:var(--r2);border:1.5px solid var(--borda);background:var(--bg);color:var(--tx);font-size:.9rem;font-family:inherit}
.ger-input:focus{outline:none;border-color:var(--az2)}
.ger-opcoes{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.ger-check{display:flex;align-items:center;gap:9px;font-size:.85rem;color:var(--tx2);cursor:pointer}
.ger-check input{width:17px;height:17px;accent-color:var(--az2);cursor:pointer}
.ger-temas-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ger-temas-header>span:first-child{font-family:'Space Grotesk','Inter',sans-serif;font-weight:800;font-size:.9rem}
.ger-total-sel{font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:.8rem;color:var(--az2);background:var(--az3);padding:5px 14px;border-radius:20px}
.ger-temas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:28px}
.ger-tema-card{background:var(--card);border-radius:var(--r2);padding:16px;box-shadow:var(--shadow);border:2px solid transparent;transition:.2s}
.ger-tema-card.selecionado{border-color:var(--az2)}
.ger-tema-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ger-tema-top input[type=checkbox]{width:17px;height:17px;accent-color:var(--az2);cursor:pointer;flex-shrink:0}
.ger-tema-nome{font-size:.83rem;font-weight:700;font-family:'Space Grotesk','Inter',sans-serif;line-height:1.3}
.ger-tema-disp{font-size:.72rem;color:var(--tx3);margin-bottom:10px;margin-left:25px}
.ger-tema-qtd{display:flex;align-items:center;gap:8px;margin-left:25px}
.ger-tema-qtd input[type=number]{width:60px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--borda);background:var(--bg);color:var(--tx);font-size:.85rem;text-align:center}
.ger-tema-qtd label{font-size:.75rem;color:var(--tx3)}
.ger-acoes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.prova-folha{max-width:780px;margin:0 auto 60px;background:#fff;color:#111;padding:50px 55px;box-shadow:var(--shadow2);border-radius:8px;font-family:Georgia,'Times New Roman',serif}
.prova-cabecalho{text-align:center;border-bottom:2.5px solid #111;padding-bottom:16px;margin-bottom:22px}
.prova-titulo{font-size:1.4rem;font-weight:700;margin-bottom:4px}
.prova-subtitulo{font-size:.95rem;color:#444}
.prova-campos{display:flex;flex-wrap:wrap;gap:18px;margin-top:18px;font-size:.88rem}
.prova-campo{flex:1;min-width:160px;border-bottom:1px solid #999;padding-bottom:3px}
.prova-instrucoes{font-size:.82rem;color:#444;margin:18px 0 28px;font-style:italic}
.prova-q{margin-bottom:26px}
.prova-q-num{font-weight:700;font-size:.95rem;margin-bottom:8px}
.prova-q-texto{font-size:.87rem;line-height:1.65;white-space:pre-line;margin-bottom:10px;text-align:justify}
.prova-q-texto img{max-width:100%;border-radius:4px;margin:8px auto;display:block}
.prova-q-fonte{font-size:.72rem;color:#666;text-align:right;margin-bottom:10px}
.prova-q-enun{font-size:.9rem;margin-bottom:10px;font-weight:600}
.prova-q-alts{display:flex;flex-direction:column;gap:6px}
.prova-q-alt{font-size:.87rem;display:flex;gap:8px}
.prova-q-alt b{flex-shrink:0}
.prova-gabarito{margin-top:40px;padding-top:20px;border-top:2.5px solid #111}
.prova-gabarito h3{font-size:1.05rem;margin-bottom:14px}
.prova-gab-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;font-size:.85rem}
.prova-gab-item{text-align:center;background:#f0f0f0;border-radius:6px;padding:6px 2px}
@media(max-width:640px){.prova-folha{padding:28px 18px}.prova-gab-grid{grid-template-columns:repeat(4,1fr)}}

@media(max-width:480px){
  .quiz-body{padding:16px 12px}
  .q-box{padding:20px 16px}
}
@media print{.topo,.topo-btn,.quiz-nav-btns,.btn,.gab-filtros{display:none!important}body{background:#fff}.screen{display:block!important}}
body:has(#sc-prova.ativo) > *:not(#sc-prova){display:none!important}
@media print{
  .screen:not(#sc-prova){display:none!important}
  #sc-prova{display:block!important}
  #sc-prova .no-print{display:none!important}

 de alcance consciente. É entender que destino é também – mas não só – origem. É expressar a essência na\nexistência através de escolhas corajosamente autênticas. É ser subversivo, fazer algo que ainda não foi imaginado. E\npagar os eventuais pedágios com um discreto sorriso de Monalisa no rosto.",

os ganham vida.\n\n    Bem-aventurados os bobos porque sabem sem que ninguém desconfie. Aliás não se importam que saibam que eles\n\n    sabem.\n\n            Há lugares que facilitam mais as pessoas serem bobas (não confundir bobo com burro, com tolo, com fútil).\n\n    Minas Gerais, por exemplo, facilita ser bobo. Ah, quantos perdem por não nascer em Minas! [...]\n\n25          Bobo é Chagall, que põe vaca no espaço, voando por cima das casas. É quase impossível evitar excesso\n\n    de amor que o bobo provoca. É que só o bobo é capaz de excesso de amor. E só o amor faz o bobo.",

0  Pode continuar a trocar o ministro da Saúde, o ministro da Fazenda, o ministro do Planejamento, o\n\n    ministro da Educação (aliás, por onde anda Aloizio Mercadante, qual será seu bloco escolar este ano?). De\n\n    nada vai adiantar essa dança das cadeiras ministeriais para agradar a um ou outro partido. Não são eles os\n\n    mosquitos vetores que contaminaram o Brasil com uma ziquizira da qual será muito difícil sair. O da\n\n    Saúde, Marcelo Castro, formado em psiquiatria, depois de espalhar piadinhas de mau gosto com mulheres\n\n25 grávidas, cometeu o pecado fatal: foi sincero. Marcelo Castro disse que o Brasil “está perdendo feio” a\n\n    guerra contra o mosquito – e isso é o fim da picada, não é, presidente?Dilma não convive com a sinceridade. Seu governo não erra. Aliás, “se erra”, como admitiu há\n\n    alguns meses, erra pouco e sem maldade – e tudo tem conserto. Erra porque foi vítima. Suas amigas, do\n\n    gênero Erenice Guerra, também sempre acertam. Se erram, é por ingenuidade ou por falta de memória. A\n\n30 ex-ministra Erenice é ingênua, dá para sentir. E nem lembra quem pagou viagens aéreas dela. Dilma\n\n    também já se esqueceu de muitas canetadas nessa roda-viva de Petrobras, Casa Civil, Presidência da\n\n    República. Seu problema não foi o mosquito, mas a mosca azul.\n\n    Para a mosca azul não há antídoto nem vacina. A mosca, num passe de mágica, tira as contas do\n\n    vermelho num gráfico ilusório, com a sua, a nossa ajuda. Uns bilhões do FGTS aqui, outros da CPMF ali, e\n\n35 pronto. O país fica cor-de-rosa, a cor dos programas eleitorais do PT. Só que não, a conta não fecha mesmo\n\n    assim, porque o Estado brasileiro é voraz e gigantesco. Não há foco na redução do tamanho. Só no aumento\n\n    de taxas, impostos e contas de serviços públicos. A dívida pública federal terminou 2015 em R$ 2.793\n\n    trilhões. A dívida – assim como o Brasil – não vai parar.\n\n    Diante do Conselhão de quase uma centena de empresários, empreendedores, banqueiros e\n\n40 autoridades – sem a presença incômoda da imprensa –, Dilma lançou um plano de sete medidas para liberar\n\n    R$ 83 bilhões em crédito para habitação, agricultura, infraestrutura, pequenas e médias empresas. A maior\n\n    parte desse dinheiro viria do FGTS. Crédito para um país em recessão, que não acredita na capacidade do\n\n    governo para enfrentar a crise. Dilma disse que, para “a travessia a um porto seguro”, a CPMF é “a melhor\n\n    solução disponível”.\n\n45  Não existe nem espaço para o crédito moral, quando se vê Lula, o fiador de Dilma, acuado por\n\n    delações que o envolvem em reformas milionárias e obscuras de imóveis como o tríplex do Guarujá ou o\n\n    sítio de Atibaia – hoje amaldiçoados. Na vida real, os juros batem recorde e famílias endividadas precisam\n\n    refinanciar seus débitos porque não podem lançar mão do dinheiro alheio. O Solaris não nasce para todos. A\n\n    zica que contaminou o país tem origem na Capital.\n\n    (Disponível em : <http://epoca.globo.com/colunas-e-blogs/ruth-de aquino/noticia/2016/01/zica-do-planalto.html>.\n                                                                                                                 Acesso em: 2 fev. 2016.)",

        "texto": "Leia, com atenção, o texto abaixo para responder às questões que se seguem.\n\n                                     A zica do Planalto\n\n1   Zica com “c” é uma gíria brasileira que significa mau agouro, azar, maldição, momento de baixo-\n\n    astral, quando tudo dá errado. A origem da palavra não se sabe ao certo, mas há quem jure que seria uma\n\n    contração da palavra ziquizira. Faz sentido. Não tem nada a ver com a zika, triste doença transmitida pelo\n\n    mosquito Aedes aegypti. Triste porque infecta o cérebro de bebês no útero materno, triste porque atesta\n\n5 nossa incompetência de país subdesenvolvido diante do mosquito que também transmite a dengue, triste\n\n    porque pode atingir 1,5 milhão de pessoas no Brasil neste ano, segundo a Organização Mundial da Saúde\n\n    (OMS).\n\n    Cada fala da presidente Dilma Rousseff sobre a zika vira uma festa para humoristas e um\n\n    constrangimento para a maioria da população – não, claro, para os militantes dilmistas, que a perdoam\n\n10 sempre e atribuem esses lapsos à pressão da dieta argentina ou da “inquisição medieval” contra ela e\n\n    contra Lula. Dilma já chamou o mosquito de vírus. Dilma já chamou a zika de vetor. Dilma já disse que a\n\n    doença é transmitida por ovos infectados por vírus. Dilma já inventou um outro inseto que seria\n\n    especializado em zika, e que não seria o mesmo da dengue.\n\n    Dilma também disse que “o Brasil não parou e nem vai parar” – e não vai mesmo parar de piorar\n\n15 enquanto ela achar que o inferno são os outros. A microcefalia do Planalto não permite que criatura e\n\n    criador caiam na real. Dilma e Lula estão juntos na saúde e na doença, na alegria e na tristeza. Juntos no\n\n    idioma maltratado. Juntos na solidariedade a Zé Dirceu, o consultor-modelo que mais voou em jatinhos de\n\n    empreiteiros e lobistas, abastecidos por propinas. Juntos no discurso de perseguição da “mídia”, da Lava\n\n    Jato e dos delatores premiados.\n\n20  Pode continuar a trocar o ministro da Saúde, o ministro da Fazenda, o ministro do Planejamento, o\n\n    ministro da Educação (aliás, por onde anda Aloizio Mercadante, qual será seu bloco escolar este ano?). De\n\n    nada vai adiantar essa dança das cadeiras ministeriais para agradar a um ou outro partido. Não são eles os\n\n    mosquitos vetores que contaminaram o Brasil com uma ziquizira da qual será muito difícil sair. O da\n\n    Saúde, Marcelo Castro, formado em psiquiatria, depois de espalhar piadinhas de mau gosto com mulheres\n\n25 grávidas, cometeu o pecado fatal: foi sincero. Marcelo Castro disse que o Brasil “está perdendo feio” a\n\n    guerra contra o mosquito – e isso é o fim da picada, não é, presidente?Dilma não convive com a sinceridade. Seu governo não erra. Aliás, “se erra”, como admitiu há\n\n    alguns meses, erra pouco e sem maldade – e tudo tem conserto. Erra porque foi vítima. Suas amigas, do\n\n    gênero Erenice Guerra, também sempre acertam. Se erram, é por ingenuidade ou por falta de memória. A\n\n30 ex-ministra Erenice é ingênua, dá para sentir. E nem lembra quem pagou viagens aéreas dela. Dilma\n\n    também já se esqueceu de muitas canetadas nessa roda-viva de Petrobras, Casa Civil, Presidência da\n\n    República. Seu problema não foi o mosquito, mas a mosca azul.\n\n    Para a mosca azul não há antídoto nem vacina. A mosca, num passe de mágica, tira as contas do\n\n    vermelho num gráfico ilusório, com a sua, a nossa ajuda. Uns bilhões do FGTS aqui, outros da CPMF ali, e\n\n35 pronto. O país fica cor-de-rosa, a cor dos programas eleitorais do PT. Só que não, a conta não fecha mesmo\n\n    assim, porque o Estado brasileiro é voraz e gigantesco. Não há foco na redução do tamanho. Só no aumento\n\n    de taxas, impostos e contas de serviços públicos. A dívida pública federal terminou 2015 em R$ 2.793\n\n    trilhões. A dívida – assim como o Brasil – não vai parar.\n\n    Diante do Conselhão de quase uma centena de empresários, empreendedores, banqueiros e\n\n40 autoridades – sem a presença incômoda da imprensa –, Dilma lançou um plano de sete medidas para liberar\n\n    R$ 83 bilhões em crédito para habitação, agricultura, infraestrutura, pequenas e médias empresas. A maior\n\n    parte desse dinheiro viria do FGTS. Crédito para um país em recessão, que não acredita na capacidade do\n\n    governo para enfrentar a crise. Dilma disse que, para “a travessia a um porto seguro”, a CPMF é “a melhor\n\n    solução disponível”.\n\n45  Não existe nem espaço para o crédito moral, quando se vê Lula, o fiador de Dilma, acuado por\n\n    delações que o envolvem em reformas milionárias e obscuras de imóveis como o tríplex do Guarujá ou o\n\n    sítio de Atibaia – hoje amaldiçoados. Na vida real, os juros batem recorde e famílias endividadas precisam\n\n    refinanciar seus débitos porque não podem lançar mão do dinheiro alheio. O Solaris não nasce para todos. A\n\n    zica que contaminou o país tem origem na Capital.\n\n    (Disponível em : <http://epoca.globo.com/colunas-e-blogs/ruth-de aquino/noticia/2016/01/zica-do-planalto.html>.\n                                                                                                                 Acesso em: 2 fev. 2016.)",

0  Pode continuar a trocar o ministro da Saúde, o ministro da Fazenda, o ministro do Planejamento, o\n\n    ministro da Educação (aliás, por onde anda Aloizio Mercadante, qual será seu bloco escolar este ano?). De\n\n    nada vai adiantar essa dança das cadeiras ministeriais para agradar a um ou outro partido. Não são eles os\n\n    mosquitos vetores que contaminaram o Brasil com uma ziquizira da qual será muito difícil sair. O da\n\n    Saúde, Marcelo Castro, formado em psiquiatria, depois de espalhar piadinhas de mau gosto com mulheres\n\n25 grávidas, cometeu o pecado fatal: foi sincero. Marcelo Castro disse que o Brasil “está perdendo feio” a\n\n    guerra contra o mosquito – e isso é o fim da picada, não é, presidente?Dilma não convive com a sinceridade. Seu governo não erra. Aliás, “se erra”, como admitiu há\n\n    alguns meses, erra pouco e sem maldade – e tudo tem conserto. Erra porque foi vítima. Suas amigas, do\n\n    gênero Erenice Guerra, também sempre acertam. Se erram, é por ingenuidade ou por falta de memória. A\n\n30 ex-ministra Erenice é ingênua, dá para sentir. E nem lembra quem pagou viagens aéreas dela. Dilma\n\n    também já se esqueceu de muitas canetadas nessa roda-viva de Petrobras, Casa Civil, Presidência da\n\n    República. Seu problema não foi o mosquito, mas a mosca azul.\n\n    Para a mosca azul não há antídoto nem vacina. A mosca, num passe de mágica, tira as contas do\n\n    vermelho num gráfico ilusório, com a sua, a nossa ajuda. Uns bilhões do FGTS aqui, outros da CPMF ali, e\n\n35 pronto. O país fica cor-de-rosa, a cor dos programas eleitorais do PT. Só que não, a conta não fecha mesmo\n\n    assim, porque o Estado brasileiro é voraz e gigantesco. Não há foco na redução do tamanho. Só no aumento\n\n    de taxas, impostos e contas de serviços públicos. A dívida pública federal terminou 2015 em R$ 2.793\n\n    trilhões. A dívida – assim como o Brasil – não vai parar.\n\n    Diante do Conselhão de quase uma centena de empresários, empreendedores, banqueiros e\n\n40 autoridades – sem a presença incômoda da imprensa –, Dilma lançou um plano de sete medidas para liberar\n\n    R$ 83 bilhões em crédito para habitação, agricultura, infraestrutura, pequenas e médias empresas. A maior\n\n    parte desse dinheiro viria do FGTS. Crédito para um país em recessão, que não acredita na capacidade do\n\n    governo para enfrentar a crise. Dilma disse que, para “a travessia a um porto seguro”, a CPMF é “a melhor\n\n    solução disponível”.\n\n45  Não existe nem espaço para o crédito moral, quando se vê Lula, o fiador de Dilma, acuado por\n\n    delações que o envolvem em reformas milionárias e obscuras de imóveis como o tríplex do Guarujá ou o\n\n    sítio de Atibaia – hoje amaldiçoados. Na vida real, os juros batem recorde e famílias endividadas precisam\n\n    refinanciar seus débitos porque não podem lançar mão do dinheiro alheio. O Solaris não nasce para todos. A\n\n    zica que contaminou o país tem origem na Capital.\n\n    (Disponível em : <http://epoca.globo.com/colunas-e-blogs/ruth-de aquino/noticia/2016/01/zica-do-planalto.html>.\n                                                                                                                 Acesso em: 2 fev. 2016.)",

eendedores, banqueiros e\n\n40 autoridades – sem a presença incômoda da imprensa –, Dilma lançou um plano de sete medidas para liberar\n\n    R$ 83 bilhões em crédito para habitação, agricultura, infraestrutura, pequenas e médias empresas. A maior\n\n    parte desse dinheiro viria do FGTS. Crédito para um país em recessão, que não acredita na capacidade do\n\n    governo para enfrentar a crise. Dilma disse que, para “a travessia a um porto seguro”, a CPMF é “a melhor\n\n    solução disponível”.\n\n45  Não existe nem espaço para o crédito moral, quando se vê Lula, o fiador de Dilma, acuado por\n\n    delações que o envolvem em reformas milionárias e obscuras de imóveis como o tríplex do Guarujá ou o\n\n    sítio de Atibaia – hoje amaldiçoados. Na vida real, os juros batem recorde e famílias endividadas precisam\n\n    refinanciar seus débitos porque não podem lançar mão do dinheiro alheio. O Solaris não nasce para todos. A\n\n    zica que contaminou o país tem origem na Capital.\n\n    (Disponível em : <http://epoca.globo.com/colunas-e-blogs/ruth-de aquino/noticia/2016/01/zica-do-planalto.html>.\n                                                                                                                 Acesso em: 2 fev. 2016.)",

        "texto": "Leia, com atenção, o texto a seguir para responder às questões propostas.\n\n                                                 A desoras, desfeliz\n\n1   Encenou-se, no Tribunal de Justiça do Rio de Janeiro, no feriado de 21 de abril, em forma de peça\n\n    teatral, uma celebração chamada “desenforcamento de Tiradentes”. Com advogado, promotor e júri popular,\n\n    refez-se o julgamento do herói da Inconfidência Mineira, tudo mais ou menos conforme o que registram os\n\n    autos de dois séculos atrás, mas com resultado inverso: no final o réu é inocentado. Ou seja, desenforcado.\n\n5 O melhor de tudo foi o título. “Desenforcamento” entra para o rol de mágicas palavras que o ‘des’ inicial\n\n    permite criar, invertendo significados e instituindo um mundo às avessas.\n\n    Em Apesar de Você, sua música contra a ditadura, Chico Buarque pediu: “Você, que inventou a\n\n    tristeza, ora tenha a fineza de desinventar”. Talvez já se invocasse o “desinventar” antes; depois, invocou-se\n\n    mais ainda. Até foi acolhido no dicionário digital Aulete, que lhe dá o significado de “retroceder, retroagir\n\n10 na ação de inventar”, e oferece como exemplo um trecho do poeta Manoel de Barros: “É preciso desinventar\n\n    os objetos. O pente, por exemplo. É preciso dar ao pente a função de não pentear. Até que ele fique à\n\n    disposição de ser uma begônia”.\n\n    Numa de suas malucas aventuras no País das Maravilhas, Alice comemora seu unbirthday, como\n\n    escreveu o autor do livro, o inglês Lewis Carroll. Unbirthday foi traduzida em português para\n\n15 “desaniversário”, bela palavra para significar um belíssimo não evento. E, por falar em belo, a escritora Ana\n\n    Miranda deu o título de Desmundo ao romance em que narra a sina de uma órfã portuguesa enviada à força\n\n    ao Brasil da época do Descobrimento para servir de esposa a um dos desbravadores da terra. “Desmundo” é\n\n    mais que fim do mundo; é o mundo ao avesso.\n\n    É o que aguarda, no romance, a inocente Oribela. Há bons exemplos mais antigos. No livro\n\n20 Roteiro de Macunaíma, de 1950, o crítico M. Cavalcanti Proença escreveu que o personagem de Mário de\n\n    Andrade resumia as “desvirtudes nacionais”. O próprio Mário de Andrade engendrou, por sua vez, outro\n\n    oportuno ‘des’ ao lamentar, num poema (Louvação da Tarde), a “pátria tão despatriada”.\n\n    Desvirtudes nacionais e despatriamentos da pátria continuam em cartaz, 87 anos depois da\n\n    publicação de Macunaíma e setenta depois da morte de Mário de Andrade, completados neste ano, mas não\n\n25 é disso que se trata aqui – por que raios, ó insistente leitor, o colunista teria sempre de afundar no\n\n    mar de nossas misérias públicas? Refugiemo-nos nas palavras. O tema de hoje são as que portam o prefixo\n\n    ‘des’, começando com as inventadas, mas não se esgotando nelas. O exímio criador/recolhedor de palavras\n\n    que foi Guimarães Rosa espalhou por suas obras, entre muitas outras, “desamigo”, “desendoidecer”,\n\n    “desdormido”, “desexistir”, “destriste”, “desfeliz”, “desviver”, “desfalar”.\n\n30  No precioso livro O Léxico de Guimarães Rosa, da professora Nice Sant’Anna Martins, registram-se\n\n    exatas 230 palavras com ‘des’, sinal de que o ‘des’ é uma tentação irresistível para quem gosta de brincar\n\n    com as possibilidades do idioma. Até “desmim” Guimarães Rosa inventou. “Querer mil gritar, e não pude,\n\n    desmim de mim mesmo, me tonteava, numas ânsias”, diz Riobaldo, no Grande Sertão: Veredas.\n\n    O ‘des’ traz em si a atração anarquista de pôr o mundo de cabeça para baixo. Mesmo as palavras em\n\n35 ‘des’ perfeitamente acomodadas à língua, e acolhidas nos dicionários há muitos anos, nos chegam com novo\n\n    viço quando nos detemos a examiná-las. A uma família melancólica pertencem “desamor”, “desventura”,\n\n    “desencanto” e a fatal “desespero”, ao inverter o alto significado moral de “amor”, “ventura”, “encanto” e\n\n    “esperança”. “Desassossego” vai no mesmo caminho.\n\n    “Desentendimento” é mais bruta; é eufemismo para briga. Ao contrário, de alto valor moral são\n\n40 “destemor” e “desassombro” ao opor-se ao temor e ao assombro. “Desatino” é humilhante; é perder o tino.\n\n    “Desoras” só pode ter sido criada por um surrealista. Usa-se no sentido de “altas horas”, mas na pura raiz\n\n    etimológica significa estar fora das horas – como assim, fora das horas? “Desasnar” é o inspirado sinônimo\n\n    de aprender pela via de deixar de ser asno.\n\n    Uma ida ao dicionário, onde dormem as palavras em estado de inocência, revela maravilhas. O leitor\n\n45 não deve saber, como o colunista não sabia, que existe a palavra “desnamorar”, assim como “desnamorado”.\n\n    A difícil arte do dicionarista revela-se em seu melhor na definição de “namorar” do Houaiss: “terem duas\n\n    pessoas relacionamento amoroso em que a aproximação física e psíquica, fundada numa atração recíproca,aspira à continuidade”. Descontinuada tal relação, fica-se com a desconsolada figura do desnamorado, que\nse imagina desamparado, a desoras, desnorteado e desterrado de si mesmo, desfeliz.\n\n                                                        (TOLEDO, Roberto Pompeu de. A desoras, desfeliz. Revista Veja, 3-março-2015.)",

, no romance, a inocente Oribela. Há bons exemplos mais antigos. No livro\n\n20 Roteiro de Macunaíma, de 1950, o crítico M. Cavalcanti Proença escreveu que o personagem de Mário de\n\n    Andrade resumia as “desvirtudes nacionais”. O próprio Mário de Andrade engendrou, por sua vez, outro\n\n    oportuno ‘des’ ao lamentar, num poema (Louvação da Tarde), a “pátria tão despatriada”.\n\n    Desvirtudes nacionais e despatriamentos da pátria continuam em cartaz, 87 anos depois da\n\n    publicação de Macunaíma e setenta depois da morte de Mário de Andrade, completados neste ano, mas não\n\n25 é disso que se trata aqui – por que raios, ó insistente leitor, o colunista teria sempre de afundar no\n\n    mar de nossas misérias públicas? Refugiemo-nos nas palavras. O tema de hoje são as que portam o prefixo\n\n    ‘des’, começando com as inventadas, mas não se esgotando nelas. O exímio criador/recolhedor de palavras\n\n    que foi Guimarães Rosa espalhou por suas obras, entre muitas outras, “desamigo”, “desendoidecer”,\n\n    “desdormido”, “desexistir”, “destriste”, “desfeliz”, “desviver”, “desfalar”.\n\n30  No precioso livro O Léxico de Guimarães Rosa, da professora Nice Sant’Anna Martins, registram-se\n\n    exatas 230 palavras com ‘des’, sinal de que o ‘des’ é uma tentação irresistível para quem gosta de brincar\n\n    com as possibilidades do idioma. Até “desmim” Guimarães Rosa inventou. “Querer mil gritar, e não pude,\n\n    desmim de mim mesmo, me tonteava, numas ânsias”, diz Riobaldo, no Grande Sertão: Veredas.\n\n    O ‘des’ traz em si a atração anarquista de pôr o mundo de cabeça para baixo. Mesmo as palavras em\n\n35 ‘des’ perfeitamente acomodadas à língua, e acolhidas nos dicionários há muitos anos, nos chegam com novo\n\n    viço quando nos detemos a examiná-las. A uma família melancólica pertencem “desamor”, “desventura”,\n\n    “desencanto” e a fatal “desespero”, ao inverter o alto significado moral de “amor”, “ventura”, “encanto” e\n\n    “esperança”. “Desassossego” vai no mesmo caminho.\n\n    “Desentendimento” é mais bruta; é eufemismo para briga. Ao contrário, de alto valor moral são\n\n40 “destemor” e “desassombro” ao opor-se ao temor e ao assombro. “Desatino” é humilhante; é perder o tino.\n\n    “Desoras” só pode ter sido criada por um surrealista. Usa-se no sentido de “altas horas”, mas na pura raiz\n\n    etimológica significa estar fora das horas – como assim, fora das horas? “Desasnar” é o inspirado sinônimo\n\n    de aprender pela via de deixar de ser asno.\n\n    Uma ida ao dicionário, onde dormem as palavras em estado de inocência, revela maravilhas. O leitor\n\n45 não deve saber, como o colunista não sabia, que existe a palavra “desnamorar”, assim como “desnamorado”.\n\n    A difícil arte do dicionarista revela-se em seu melhor na definição de “namorar” do Houaiss: “terem duas\n\n    pessoas relacionamento amoroso em que a aproximação física e psíquica, fundada numa atração recíproca,aspira à continuidade”. Descontinuada tal relação, fica-se com a desconsolada figura do desnamorado, que\nse imagina desamparado, a desoras, desnorteado e desterrado de si mesmo, desfeliz.\n\n                                                        (TOLEDO, Roberto Pompeu de. A desoras, desfeliz. Revista Veja, 3-março-2015.)",

ego” vai no mesmo caminho.\n\n    “Desentendimento” é mais bruta; é eufemismo para briga. Ao contrário, de alto valor moral são\n\n40 “destemor” e “desassombro” ao opor-se ao temor e ao assombro. “Desatino” é humilhante; é perder o tino.\n\n    “Desoras” só pode ter sido criada por um surrealista. Usa-se no sentido de “altas horas”, mas na pura raiz\n\n    etimológica significa estar fora das horas – como assim, fora das horas? “Desasnar” é o inspirado sinônimo\n\n    de aprender pela via de deixar de ser asno.\n\n    Uma ida ao dicionário, onde dormem as palavras em estado de inocência, revela maravilhas. O leitor\n\n45 não deve saber, como o colunista não sabia, que existe a palavra “desnamorar”, assim como “desnamorado”.\n\n    A difícil arte do dicionarista revela-se em seu melhor na definição de “namorar” do Houaiss: “terem duas\n\n    pessoas relacionamento amoroso em que a aproximação física e psíquica, fundada numa atração recíproca,aspira à continuidade”. Descontinuada tal relação, fica-se com a desconsolada figura do desnamorado, que\nse imagina desamparado, a desoras, desnorteado e desterrado de si mesmo, desfeliz.\n\n                                                        (TOLEDO, Roberto Pompeu de. A desoras, desfeliz. Revista Veja, 3-março-2015.)",

, no romance, a inocente Oribela. Há bons exemplos mais antigos. No livro\n\n20 Roteiro de Macunaíma, de 1950, o crítico M. Cavalcanti Proença escreveu que o personagem de Mário de\n\n    Andrade resumia as “desvirtudes nacionais”. O próprio Mário de Andrade engendrou, por sua vez, outro\n\n    oportuno ‘des’ ao lamentar, num poema (Louvação da Tarde), a “pátria tão despatriada”.\n\n    Desvirtudes nacionais e despatriamentos da pátria continuam em cartaz, 87 anos depois da\n\n    publicação de Macunaíma e setenta depois da morte de Mário de Andrade, completados neste ano, mas não\n\n25 é disso que se trata aqui – por que raios, ó insistente leitor, o colunista teria sempre de afundar no\n\n    mar de nossas misérias públicas? Refugiemo-nos nas palavras. O tema de hoje são as que portam o prefixo\n\n    ‘des’, começando com as inventadas, mas não se esgotando nelas. O exímio criador/recolhedor de palavras\n\n    que foi Guimarães Rosa espalhou por suas obras, entre muitas outras, “desamigo”, “desendoidecer”,\n\n    “desdormido”, “desexistir”, “destriste”, “desfeliz”, “desviver”, “desfalar”.\n\n30  No precioso livro O Léxico de Guimarães Rosa, da professora Nice Sant’Anna Martins, registram-se\n\n    exatas 230 palavras com ‘des’, sinal de que o ‘des’ é uma tentação irresistível para quem gosta de brincar\n\n    com as possibilidades do idioma. Até “desmim” Guimarães Rosa inventou. “Querer mil gritar, e não pude,\n\n    desmim de mim mesmo, me tonteava, numas ânsias”, diz Riobaldo, no Grande Sertão: Veredas.\n\n    O ‘des’ traz em si a atração anarquista de pôr o mundo de cabeça para baixo. Mesmo as palavras em\n\n35 ‘des’ perfeitamente acomodadas à língua, e acolhidas nos dicionários há muitos anos, nos chegam com novo\n\n    viço quando nos detemos a examiná-las. A uma família melancólica pertencem “desamor”, “desventura”,\n\n    “desencanto” e a fatal “desespero”, ao inverter o alto significado moral de “amor”, “ventura”, “encanto” e\n\n    “esperança”. “Desassossego” vai no mesmo caminho.\n\n    “Desentendimento” é mais bruta; é eufemismo para briga. Ao contrário, de alto valor moral são\n\n40 “destemor” e “desassombro” ao opor-se ao temor e ao assombro. “Desatino” é humilhante; é perder o tino.\n\n    “Desoras” só pode ter sido criada por um surrealista. Usa-se no sentido de “altas horas”, mas na pura raiz\n\n    etimológica significa estar fora das horas – como assim, fora das horas? “Desasnar” é o inspirado sinônimo\n\n    de aprender pela via de deixar de ser asno.\n\n    Uma ida ao dicionário, onde dormem as palavras em estado de inocência, revela maravilhas. O leitor\n\n45 não deve saber, como o colunista não sabia, que existe a palavra “desnamorar”, assim como “desnamorado”.\n\n    A difícil arte do dicionarista revela-se em seu melhor na definição de “namorar” do Houaiss: “terem duas\n\n    pessoas relacionamento amoroso em que a aproximação física e psíquica, fundada numa atração recíproca,aspira à continuidade”. Descontinuada tal relação, fica-se com a desconsolada figura do desnamorado, que\nse imagina desamparado, a desoras, desnorteado e desterrado de si mesmo, desfeliz.\n\n                                                        (TOLEDO, Roberto Pompeu de. A desoras, desfeliz. Revista Veja, 3-março-2015.)",

        "texto": "Questões numeradas de 16 a 25\n\n    Instrução: Para responder às questões propostas, leia, com atenção, o texto que se segue.\n\n                           As coisas começam a andar\n\n1   Esta coluna começa de um jeito e termina de outro, e essa contradição me alegra. Vejamos: outro dia\n\n    eu falava com meu marido das trapalhadas de um conhecido nosso. Ele sorriu dentro de suas barbas brancas,\n\n    e comentou: \"Do jeito que as coisas andam no mundo e aqui no Brasil, isso até me parece bem normal\".\n\n    Concordei, e fiquei pensando na dramática incerteza em que vivemos, a ponto de acharmos quase tudo\n\n5 \"normal\". Mais um figurão apanhado na Operação Lava-Jato? Mais um escândalo desmascarado? Novas\n\n    revelações vão fazer o petrolão parecer brincadeira de criança? Não caímos para trás, ninguém desmaia de\n\n    susto: lixões morais vão se tornando normalidade. Mais longe, desgraças antigas como milhões morrendo de\n\n    fome em terras africanas ou em guerras no Oriente, e agora uma gigantesca migração aportando na Europa\n\n    — fugitivos ou refugiados sem lugar onde ficar, num drama sem solução à vista. Às vezes enfiados em trens\n\n10 que lembram o pavoroso tempo nazista, ou caminhando quilômetros impensáveis, em geral não são\n\n    recebidos de braços abertos (onde botar, como tratar tais multidões?). Em alguns noticiosos aparecem\n\n    velhos, mulheres e bebês, gente simples ou profissionais liberais, recebendo água e comida lançadas por\n\n    cima de uma cerca alta, como se fossem ração para gado. Corrijo: o gado, em geral, é bem tratado —\n\n    também os porcos.\n\n15  E por aqui, nas nossas vastas e hoje desoladoras terras brasileiras, o império da bandidagem e da\n\n    insegurança: já não espanta ver tiroteios nas ruas principais de grandes cidades ou de povoados que já foram\n\n    românticos, gente correndo ou paralisada, agências bancárias e caixas eletrônicos explodidos, gerentes de\n\n    banco sequestrados com sua família. Aqui no meu cotidiano recolhido, assalto em qualquer esquina e hora é\n\n    a regra. Na bela cidade do Rio de Janeiro, ex-maravilhosa, onde morei, furtos ou arrastões a toda hora sob o\n\n20 sol em praias apinhadas de gente, tudo filmado, para horror nosso e dos estrangeiros (e ainda se fala em\n\n    Olimpíada). Começa o pânico em nosso bolso: o desastre da economia, a subida veloz dos preços e\n\n    impostos, comércio fechando, restaurantes vazios, desemprego catastrófico, universidades quase em ruínas,\n\n    doentes maltratados, estradas abandonadas — mas, coroando tudo, ainda ecoam discursos alienados que\n\n    talvez enganassem criancinhas de colo.\n\n25  As notícias que vêm (além das que nunca saberemos) das altas esferas também são assombrosas: ir e\n\n    vir, propor e retirar, escrever e rasgar. Sussurram-se, atrás de portas fechadas, conchavos fervilhantes em\n\n    eternas reuniões, providenciam-se compra e venda de lealdades e deslealdades, enquanto cresce a indecisão.\n\n    Nada de projeto firme, nada de proposta sensata: experiência, lucidez e seriedade parecem se esconder; mais\n\n    que negociações, negociatas (alguns começam a se retirar delas, por receio ou dignidade). Nós a tudo\n\n30 assistimos atônitos e descrentes. Não sabemos em quem confiar, não divisamos que futuro esperar, pois a\n\n    realidade atual é um camaleão superativo. Nossa vida — a de nossa família e amigos, velhos e crianças,\n\n    doentes desassistidos, pobres enganados, país explorado e sucateado — não está nas mãos de ninguém. E\n\n    parece que nada anda.\n\n    Mas — surpresa, surpresa —, de repente, algumas coisas começam a andar! Apesar de tudo o que\n\n35 incansavelmente escrevo, as rodas da Justiça funcionam: moem, moem, moem, metodicamente apontam,\n\n    acusam e condenam figurões que nunca antes tínhamos imaginado fora de sua toca (ou pedestal). Ex-\n\n    diretores de grandes estatais, tesoureiros de partidos, e outros que naturalmente negam...         "texto": "Questões numeradas de 16 a 25\n\n    Instrução: Para responder às questões propostas, leia, com atenção, o texto que se segue.\n\n                           As coisas começam a andar\n\n1   Esta coluna começa de um jeito e termina de outro, e essa contradição me alegra. Vejamos: outro dia\n\n    eu falava com meu marido das trapalhadas de um conhecido nosso. Ele sorriu dentro de suas barbas brancas,\n\n    e comentou: \"Do jeito que as coisas andam no mundo e aqui no Brasil, isso até me parece bem normal\".\n\n    Concordei, e fiquei pensando na dramática incerteza em que vivemos, a ponto de acharmos quase tudo\n\n5 \"normal\". Mais um figurão apanhado na Operação Lava-Jato? Mais um escândalo desmascarado? Novas\n\n    revelações vão fazer o petrolão parecer brincadeira de criança? Não caímos para trás, ninguém desmaia de\n\n    susto: lixões morais vão se tornando normalidade. Mais longe, desgraças antigas como milhões morrendo de\n\n    fome em terras africanas ou em guerras no Oriente, e agora uma gigantesca migração aportando na Europa\n\n    — fugitivos ou refugiados sem lugar onde ficar, num drama sem solução à vista. Às vezes enfiados em trens\n\n10 que lembram o pavoroso tempo nazista, ou caminhando quilômetros impensáveis, em geral não são\n\n    recebidos de braços abertos (onde botar, como tratar tais multidões?). Em alguns noticiosos aparecem\n\n    velhos, mulheres e bebês, gente simples ou profissionais liberais, recebendo água e comida lançadas por\n\n    cima de uma cerca alta, como se fossem ração para gado. Corrijo: o gado, em geral, é bem tratado —\n\n    também os porcos.\n\n15  E por aqui, nas nossas vastas e hoje desoladoras terras brasileiras, o império da bandidagem e da\n\n    insegurança: já não espanta ver tiroteios nas ruas principais de grandes cidades ou de povoados que já foram\n\n    românticos, gente correndo ou paralisada, agências bancárias e caixas eletrônicos explodidos, gerentes de\n\n    banco sequestrados com sua família. Aqui no meu cotidiano recolhido, assalto em qualquer esquina e hora é\n\n    a regra. Na bela cidade do Rio de Janeiro, ex-maravilhosa, onde morei, furtos ou arrastões a toda hora sob o\n\n20 sol em praias apinhadas de gente, tudo filmado, para horror nosso e dos estrangeiros (e ainda se fala em\n\n    Olimpíada). Começa o pânico em nosso bolso: o desastre da economia, a subida veloz dos preços e\n\n    impostos, comércio fechando, restaurantes vazios, desemprego catastrófico, universidades quase em ruínas,\n\n    doentes maltratados, estradas abandonadas — mas, coroando tudo, ainda ecoam discursos alienados que\n\n    talvez enganassem criancinhas de colo.\n\n25  As notícias que vêm (além das que nunca saberemos) das altas esferas também são assombrosas: ir e\n\n    vir, propor e retirar, escrever e rasgar. Sussurram-se, atrás de portas fechadas, conchavos fervilhantes em\n\n    eternas reuniões, providenciam-se compra e venda de lealdades e deslealdades, enquanto cresce a indecisão.\n\n    Nada de projeto firme, nada de proposta sensata: experiência, lucidez e seriedade parecem se esconder; mais\n\n    que negociações, negociatas (alguns começam a se retirar delas, por receio ou dignidade). Nós a tudo\n\n30 assistimos atônitos e descrentes. Não sabemos em quem confiar, não divisamos que futuro esperar, pois a\n\n    realidade atual é um camaleão superativo. Nossa vida — a de nossa família e amigos, velhos e crianças,\n\n    doentes desassistidos, pobres enganados, país explorado e sucateado — não está nas mãos de ninguém. E\n\n    parece que nada anda.\n\n    Mas — surpresa, surpresa —, de repente, algumas coisas começam a andar! Apesar de tudo o que\n\n35 incansavelmente escrevo, as rodas da Justiça funcionam: moem, moem, moem, metodicamente apontam,\n\n    acusam e condenam figurões que nunca antes tínhamos imaginado fora de sua toca (ou pedestal). Ex-\n\n    diretores de grandes estatais, tesoureiros de partidos, e outros que naturalmente negam... Isso me dá uma\n\n    cálida esperança: se a Justiça prevalecer, se alguém experiente e honrado nos liderar, se nossa descrença\n\n    mudar para indignação com atitudes firmes, o Titanic-Brasil se salvará da destruição intencional causada\n\n40 pela fatal dupla \"arrogância e incompetência\", liderada pela ganância. Haverá reconstrução, reorganização\n\n    dos nossos valores e orgulho por sermos brasileiros.\n\n                           (LUFT, Lya. As coisas começam a andar. Revista Veja. p. 24, 30 de setembro de 2015.)",

      {
        "texto": "Leia, com atenção, o texto a seguir para responder às questões propostas.\n\n   “A xacina do testo”\n\n1  Apezar da xuva, muita jente esteve prezente ao ezersisio de jinastica qe teve lugar no colejio.\n\n   Omens, mulheres e criansas, no fim, cantaram o Ino Nasional. Ouve pesoas qe ate xoraram de emosão\n\n   cuando a festa terminou. Oje qem qiser pode asistir a nova aprezentasão.\n\n   A impressão é de escombros do que foi outrora a língua portuguesa em sua forma escrita. Como se\n\n5 tivesse sido atingida por uma bomba e alguns destroços irreconhecíveis houvessem sido resgatados da\n\n   hecatombe. A comparação não é absurda. Tem o efeito de uma bomba a radical reforma ortográfica\n\n   defendida pelo site Simplificando a Ortografia (simplificandoaortografia.com), criado pelo professor de\n\n   português Ernani Pimentel. Sua proposta é acabar com letras que não se pronunciam, como o “H” no início\n\n   de certas palavras e o “U” que se segue ao “Q” em “quintal” e “querido”, assim como a duplicidade de\n\n10 representação do mesmo som em “S” e “Z”, “SS” e “Ç” ou “G” e “J”.\n\n   Não é uma proposta inovadora. Para citar uma das que já se apresentaram com espírito semelhante\n\n   no passado, o general Bertoldo Klinger, figura preeminente da Era Vargas, não só formulou a sua como a\n\n   praticou – ele grafava seus textos segundo as regras que inventou. O general (aliás, jeneral) Klinger, em\n\n   quem o reformador da língua escrita se misturava ao reformador do povo brasileiro, explicava: “Ortografia\n\n15 é lojica. Lojica é ordem. Sem ordem não a nasão. Logo, não a nasão sem ortografia lojica”.\n\n   [...] Essa história tem origem nas discórdias que se seguiram à assinatura, em 1990, do Acordo\n\n   Ortográfico pelo qual os países de língua portuguesa se comprometeram a unificar suas regras ortográficas.\n\n   Restrições surgiram em todos os países signatários. No Brasil, o acordo deveria entrar em vigor em 2009, e\n\n   na prática realmente entrou, com sua adoção nas escolas, na imprensa e nas editoras de livros. Oficialmente,\n\n20 no entanto, dadas as divergências com os outros países, adiou-se a entrada em vigor para 2016.\n\n   Nesse vácuo entrou a Comissão de Educação [...], que decidiu rediscutir o acordo e criou um grupo\n\n   de trabalho [...] Duas audiências públicas serão realizadas. Espera-se que, nelas, falem mais alto as palavras\n\n   da professora Marília Ferreira, presidente da Associação Brasileira de Linguística [...]: “A ortografia não\n\n   existe para representar a fala, mas é uma representação abstrata e convencional da língua. Para poder ser de\n\n25 fato funcional, a ortografia deve necessariamente afastar-se da diversidade da fala. Só assim se poderá\n\n   garantir um sistema ortográfico estável e perene em que haja uma única representação gráfica para cada\n\n   palavra. É essa representação única que torna possível que a palavra seja reconhecida em qualquer texto,\n\n   independentemente de suas inúmeras pronúncias no espaço e no tempo”.\n\n   A alternativa é a xacina do testo em língua portugueza. A anarqia. A ecatombe.\n\n   (TOLEDO Roberto Pompeu de. A xacina do testo. Revista Veja. p. 106. 21 de setembro de 2014. Adaptado.)",

ou, com sua adoção nas escolas, na imprensa e nas editoras de livros. Oficialmente,\n\n20 no entanto, dadas as divergências com os outros países, adiou-se a entrada em vigor para 2016.\n\n   Nesse vácuo entrou a Comissão de Educação [...], que decidiu rediscutir o acordo e criou um grupo\n\n   de trabalho [...] Duas audiências públicas serão realizadas. Espera-se que, nelas, falem mais alto as palavras\n\n   da professora Marília Ferreira, presidente da Associação Brasileira de Linguística [...]: “A ortografia não\n\n   existe para representar a fala, mas é uma representação abstrata e convencional da língua. Para poder ser de\n\n25 fato funcional, a ortografia deve necessariamente afastar-se da diversidade da fala. Só assim se poderá\n\n   garantir um sistema ortográfico estável e perene em que haja uma única representação gráfica para cada\n\n   palavra. É essa representação única que torna possível que a palavra seja reconhecida em qualquer texto,\n\n   independentemente de suas inúmeras pronúncias no espaço e no tempo”.\n\n   A alternativa é a xacina do testo em língua portugueza. A anarqia. A ecatombe.\n\n   (TOLEDO Roberto Pompeu de. A xacina do testo. Revista Veja. p. 106. 21 de setembro de 2014. Adaptado.)",

ou, com sua adoção nas escolas, na imprensa e nas editoras de livros. Oficialmente,\n\n20 no entanto, dadas as divergências com os outros países, adiou-se a entrada em vigor para 2016.\n\n   Nesse vácuo entrou a Comissão de Educação [...], que decidiu rediscutir o acordo e criou um grupo\n\n   de trabalho [...] Duas audiências públicas serão realizadas. Espera-se que, nelas, falem mais alto as palavras\n\n   da professora Marília Ferreira, presidente da Associação Brasileira de Linguística [...]: “A ortografia não\n\n   existe para representar a fala, mas é uma representação abstrata e convencional da língua. Para poder ser de\n\n25 fato funcional, a ortografia deve necessariamente afastar-se da diversidade da fala. Só assim se poderá\n\n   garantir um sistema ortográfico estável e perene em que haja uma única representação gráfica para cada\n\n   palavra. É essa representação única que torna possível que a palavra seja reconhecida em qualquer texto,\n\n   independentemente de suas inúmeras pronúncias no espaço e no tempo”.\n\n   A alternativa é a xacina do testo em língua portugueza. A anarqia. A ecatombe.\n\n   (TOLEDO Roberto Pompeu de. A xacina do testo. Revista Veja. p. 106. 21 de setembro de 2014. Adaptado.)",

        "texto": "A POESIA QUE MORA DENTRO DA GENTE\n 1 Há sentimentos que fazem morada em nós, mas é preciso que sejam despertados do sono da rotina para que\n\n     assim, também nós, estejamos acordados para o que a vida nos oferece. Um acordo entre poesia e liberdade de\n     pensamento, essa é a fórmula utilizada por Rubem Alves que permanece ao alcance de mentes que ousam se abrir\n     para a beleza e a sensibilidade.\n 5 Todas as tardes, após sair do trabalho, passo por uma avenida repleta de árvores, entre elas, um grande ipê\n     carregado de flores amarelas. Hoje, sei bem sobre os detalhes desse monumento natural porque me permiti olhar\n     para ele com o reparo merecido. Sei também sobre o ninho de passarinhos no seu mais alto galho e sobre o sorriso\n     da criança que se encanta com a pequena flor que cai no chão, misturando-se às outras num verdadeiro tapete de\n     cor. Sei da moça que, delicadamente, procura desviar-se dessas pétalas que tomam conta da calçada com pena de\n10 esmagá-las. Posso falar sobre quem, sempre tão ocupado em seu celular, passa e não vê, sobre quem olha, sorri e\n     segue seu caminho e sobre quem não se cansa de olhar, mas devo confessar que só me dei conta da grandiosidade\n     do ipê quando, um dia, que parecia ser igual a todos os outros, minha pequena irmã diminuiu o passo, tocou\n     docemente meu ombro e disse:\n\n         – Olha que coisa mais linda essa árvore!\n15 Foi então que a observei sem pressa e, finalmente, passei a entender o que Rubem Alves pretendia quando disse\n\n     que “os olhos são a porta pela qual a beleza entra na alma”. Compreendi que o modo de ver das crianças é\n     realmente mais eficaz na percepção do belo e que ele estava completamente lúcido quando escreveu que desejava\n     conservar nos olhos o fascínio e a capacidade de se assombrar diante do banal, características típicas da infância,\n     mas que são essenciais aos adultos que desejam tornar-se sábios. Foi preciso que um ser que, aparentemente, não\n20 sabe nada sobre a vida, me despertasse para a beleza que estava bem a minha frente. Assim são as mensagens de\n     Rubem, leves toques no ombro do leitor, despertando sentimentos que já habitam em nós, mas que estavam\n     adormecidos, instigando a inteligência e a percepção do simples como uma dádiva, uma maneira de provocar a vida.\n     Distribuídas em mais de 146 obras sustentadas por uma linguagem simples e poética, são uma combinação de\n     frases colhidas de um coração que acreditava que as palavras só têm sentido quando podem ajudar a ver o mundo\n25 melhor.\n\n          Adentrando o universo de simplicidade do escritor, passei a ter a certeza de que é no coração disposto e\n     apaixonado que está a verdadeira graça e, quando usadas como alimento para a alma, as boas palavras tocam,\n     instruem e nos ajudam a construir o que queremos ser. Ter a paixão em seu âmago não significa somente ser\n     apaixonado por alguém, mas ter paixão por viver, essa é a poesia que está dentro da gente e é ela quem reconhece\n30 o belo. No mundo em que vivemos, o óbvio precisa ser dito porque muitos ainda estão cegos e surdos para o viver e\n     ocupados demais para olhar para dentro de si e para o outro. Muitas vezes, é preciso que alguém nos aponte a\n     direção ou que algo aconteça para que enxerguemos o encanto e a magia de estarmos vivos. Tornando-se mestre\n     na arte de perceber as maravilhas ao nosso redor, Rubem deixou um imenso legado que faz do amor ingrediente\n     principal das relações verdadeiras e da alegria um agente transformador.\n35 Como ele mesmo diria, “encantou-se” em 19 de julho de 2014 e, em respeito ao seu desejo, suas cinzas foram\n     colocadas junto à muda de um ipê amarelo, tão citado em seus escritos, permanecendo vivo não somente por meio\n     das muitas sementes lançadas no canteiro de tantas mentes dispostas à evolução, como também entre as raízes de\n     sua árvore preferida. Sua maior e mais valiosa herança é a consciência de que o que realmente importa está em\n     nós, já que ele sempre soube, e fez questão de nos dizer: “é preciso que a gente escute a própria música, é nessa\n40 música que está a imagem da nossa felicidade”.\n\n         Quanto a mim, desde o dia em que encarei verdadeiramente aquela manifestação da natureza de todas as\n     tardes, fiquei mais atenta não só para o olhar que lanço sobre as coisas, mas agucei também os ouvidos, ouço a\n     minha música e me permito ouvir a do meu semelhante. Prestar atenção no que aparenta ser singelo tornou-se\n     minha magia e desafio diários, uma maneira de manter acesa a chama da poesia que mora em mim.\n\n      BERTELLI, Camila. A poesia que mora dentro da gente.",

 que, aparentemente, não\n20 sabe nada sobre a vida, me despertasse para a beleza que estava bem a minha frente. Assim são as mensagens de\n     Rubem, leves toques no ombro do leitor, despertando sentimentos que já habitam em nós, mas que estavam\n     adormecidos, instigando a inteligência e a percepção do simples como uma dádiva, uma maneira de provocar a vida.\n     Distribuídas em mais de 146 obras sustentadas por uma linguagem simples e poética, são uma combinação de\n     frases colhidas de um coração que acreditava que as palavras só têm sentido quando podem ajudar a ver o mundo\n25 melhor.\n\n          Adentrando o universo de simplicidade do escritor, passei a ter a certeza de que é no coração disposto e\n     apaixonado que está a verdadeira graça e, quando usadas como alimento para a alma, as boas palavras tocam,\n     instruem e nos ajudam a construir o que queremos ser. Ter a paixão em seu âmago não significa somente ser\n     apaixonado por alguém, mas ter paixão por viver, essa é a poesia que está dentro da gente e é ela quem reconhece\n30 o belo. No mundo em que vivemos, o óbvio precisa ser dito porque muitos ainda estão cegos e surdos para o viver e\n     ocupados demais para olhar para dentro de si e para o outro. Muitas vezes, é preciso que alguém nos aponte a\n     direção ou que algo aconteça para que enxerguemos o encanto e a magia de estarmos vivos. Tornando-se mestre\n     na arte de perceber as maravilhas ao nosso redor, Rubem deixou um imenso legado que faz do amor ingrediente\n     principal das relações verdadeiras e da alegria um agente transformador.\n35 Como ele mesmo diria, “encantou-se” em 19 de julho de 2014 e, em respeito ao seu desejo, suas cinzas foram\n     colocadas junto à muda de um ipê amarelo, tão citado em seus escritos, permanecendo vivo não somente por meio\n     das muitas sementes lançadas no canteiro de tantas mentes dispostas à evolução, como também entre as raízes de\n     sua árvore preferida. Sua maior e mais valiosa herança é a consciência de que o que realmente importa está em\n     nós, já que ele sempre soube, e fez questão de nos dizer: “é preciso que a gente escute a própria música, é nessa\n40 música que está a imagem da nossa felicidade”.\n\n         Quanto a mim, desde o dia em que encarei verdadeiramente aquela manifestação da natureza de todas as\n     tardes, fiquei mais atenta não só para o olhar que lanço sobre as coisas, mas agucei também os ouvidos, ouço a\n     minha música e me permito ouvir a do meu semelhante. Prestar atenção no que aparenta ser singelo tornou-se\n     minha magia e desafio diários, uma maneira de manter acesa a chama da poesia que mora em mim.\n\n      BERTELLI, Camila. A poesia que mora dentro da gente.",

iosa herança é a consciência de que o que realmente importa está em\n     nós, já que ele sempre soube, e fez questão de nos dizer: “é preciso que a gente escute a própria música, é nessa\n40 música que está a imagem da nossa felicidade”.\n\n         Quanto a mim, desde o dia em que encarei verdadeiramente aquela manifestação da natureza de todas as\n     tardes, fiquei mais atenta não só para o olhar que lanço sobre as coisas, mas agucei também os ouvidos, ouço a\n     minha música e me permito ouvir a do meu semelhante. Prestar atenção no que aparenta ser singelo tornou-se\n     minha magia e desafio diários, uma maneira de manter acesa a chama da poesia que mora em mim.\n\n      BERTELLI, Camila. A poesia que mora dentro da gente.",

        "texto": "O paraíso é um estado de espírito\n\n        Quando penso em paraíso, a imagem que me vem à cabeça é de uma praia de mar azulinho, céu de brigadeiro,\nsilêncio, alegria e eu no modo desligadona. E você?\n\n        Na vida que acontece fora da nossa imaginação, mesmo diante do mar mais azul, muitas vezes estamos\nacinzentados de medo, raiva, tédio ou tristeza. O corpo tira férias, mas a mente não. Porque mesmo que a gente\ndesconecte logo do trabalho, as danadas das emoções reprimidas acham espaço pra emergir.\n\n        Escrevo essa coluna da Tailândia, mais precisamente de um dos hotéis usados para as gravações da terceira\ntemporada da série “The White Lotus” e resolvi te contar isso porque é extremo e irônico. Vim para essas férias idealizando\nleveza, certa de que seria uma pausa divertida, sem grandes lições. Afinal, essa coisa de caos psicológico e drama da\nsérie é pura ficção. Rá!\n\n        Já na primeira massagem percebi que o silêncio impecável do lugar despertava uma melancolia guardada, e logo\nme vi frustrada por não estar flutuando pela praia com meus gêmeos fofos, nem aceitando bem as frustrações da minha\nfamília. Afinal, como não estamos todos morrendo de felicidade só por estar no paraíso? Resolvi voltar para mim mesma\ncom mais atenção, ajustar meus pedidos e expectativas, e me lembrei que tudo estava bem viver férias deliciosas, mesmo\nque diferentes da minha imaginação.\n\n        Nossa inabilidade de lidar com frustrações acompanha a bagagem. Isso é tão verdade que tem até nome: o\nparadoxo do lazer. Quanto mais expectativa colocamos no tempo livre, mais ele vira fonte de pressão. Queremos que cada\nmomento seja inesquecível. Sem perceber, levamos para as férias a mesma lógica de produtividade que nos exaure no\ntrabalho. [...]\n\n        Além do que sentimos, os incômodos também aparecem no outro, que nem sempre entende o que está vindo à\ntona. Lidar com isso exige flexibilidade. Ninguém vira uma versão perfeita só porque mudou de cenário. Crianças se\nentediam, casais se desentendem, amigos se desencontram. Ver essas dinâmicas menos como falhas e mais como parte\ndo pacote ajuda a sair do modo controle e entrar no modo conexão. [...]\n\n        Quando vivemos as férias como exercício de presença, não como projeto de perfeição, a volta ao trabalho também\nmuda. Não voltamos esperando que as férias tenham sido mágicas, nem carregando a frustração de não termos\ndescansado direito. Voltamos um pouco mais íntimos de nós mesmos. Com um olhar menos rígido para o trabalho, menos\nidealizado para o descanso, mais conscientes dos próprios limites.\n\n        No fim, o verdadeiro paraíso talvez não seja um lugar nem um estado fixo, mas a capacidade de atravessar o que\nsurge com humanidade. Um paraíso imperfeito, mas verdadeiro, que vai com a gente da praia para o escritório, do silêncio\npara o Zoom, do descanso para a ação. [...]",

const AUTH = {
  current: null,
  _LK: 'concursos_progresso_local',
  _load(){ try{ const d=localStorage.getItem(this._LK); return d?JSON.parse(d):null; } catch(e){ return null; } },
  _save(){ if(!this.current) return; try{ localStorage.setItem(this._LK, JSON.stringify(this.current)); } catch(e){ console.warn('localStorage indisponível'); } },
  init(){
    let d=this._load();
    if(!d){
      const tentativas={};
      TEMAS_ORDEM.forEach(t=>tentativas[t]=null);
      d = { nome:'Estudante', turma:'Concursos', criado_em:new Date().toISOString(), tentativas };
    }
    TEMAS_ORDEM.forEach(t=>{ if(!(t in d.tentativas)) d.tentativas[t]=null; });
    this.current=d;
    this._save();
  },
  saveResult(topico, result){
    if(!this.current) return;
    const anterior=this.current.tentativas[topico];
    const historico=(anterior && anterior.historico)?anterior.historico.slice():(anterior?[{score:anterior.score,total:anterior.total,data:anterior.data,tempo_seg:anterior.tempo_seg}]:[]);
    historico.push({score:result.score,total:result.total,data:result.data,tempo_seg:result.tempo_seg});
    const pctNovo=result.score/result.total;
    const pctAnterior=anterior?anterior.score/anterior.total:-1;
    const melhor=pctNovo>=pctAnterior?result:anterior;
    this.current.tentativas[topico]={...melhor, historico, numTentativas:historico.length};
    this._save();
  },
  isLocked(topico){ return false; }
};
